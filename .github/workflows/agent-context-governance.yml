name: Agent Context Governance

on:
  pull_request:
    paths:
      - AGENTS.md
      - project_context.md
      - Handoff.md
      - Handoff.archive.md
      - changelog.md
      - docs/changelog/internal/**
      - docs/operations/agent-context-history/**
      - docs/operations/agent-context-router.json
      - docs/operations/CONTEXT_HANDOFF_OPERATING_MODEL_V1.md
      - docs/operations/DOCUMENTATION_OPERATING_MODEL_V1.md
      - docs/operations/CODEX_EXECUTION_PROMPT_V1.md
      - .claude/commands/implement-task.md
      - .claude/skills/greenhouse-documentation-governor/SKILL.md
      - .codex/skills/greenhouse-documentation-governor/SKILL.md
      - scripts/check-context-handoff.mjs
      - scripts/maintenance/rotate-handoff-context.mjs
      - scripts/maintenance/rotate-handoff-context.test.mjs
      - package.json
      - pnpm-lock.yaml
  push:
    branches: [develop, main]
    paths:
      - AGENTS.md
      - project_context.md
      - Handoff.md
      - Handoff.archive.md
      - changelog.md
      - docs/changelog/internal/**
      - docs/operations/agent-context-history/**
      - docs/operations/agent-context-router.json
      - docs/operations/CONTEXT_HANDOFF_OPERATING_MODEL_V1.md
      - docs/operations/DOCUMENTATION_OPERATING_MODEL_V1.md
      - docs/operations/CODEX_EXECUTION_PROMPT_V1.md
      - .claude/commands/implement-task.md
      - .claude/skills/greenhouse-documentation-governor/SKILL.md
      - .codex/skills/greenhouse-documentation-governor/SKILL.md
      - scripts/check-context-handoff.mjs
      - scripts/maintenance/rotate-handoff-context.mjs
      - scripts/maintenance/rotate-handoff-context.test.mjs
      - package.json
      - pnpm-lock.yaml

jobs:
  context-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npmrc="$RUNNER_TEMP/greenhouse-npmrc"
          trap 'rm -f "$npmrc"' EXIT
          printf '%s\n' '@efeoncepro:registry=https://npm.pkg.github.com' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$npmrc"
          NPM_CONFIG_USERCONFIG="$npmrc" pnpm install --frozen-lockfile
      - name: Verify active context budgets, routing and immutable snapshots
        run: pnpm docs:context-check:strict
      - name: Test context and changelog rotation
        run: node --test scripts/maintenance/rotate-handoff-context.test.mjs
