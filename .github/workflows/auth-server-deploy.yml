name: Auth Server Deploy

# TASK-1828 / EPIC-044 — Efeonce authorization server (`auth.efeonce.org`) on Cloud Run.
#
# ONE service serves production at auth.efeonce.org: no staging deployment exists.
# Only main pushes, production-release.yml workflow_call and audited production
# dispatches may deploy. All lanes use the production Environment and one lock.
# Feature flags/cohorts remain independent governed inputs; routing never enables them.

on:
  push:
    branches:
      - main
    paths:
      - 'services/auth-server/**'
      - 'scripts/auth-server/rooms-config-drift.py'
      - '.github/workflows/auth-server-deploy.yml'
      - 'services/_shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.dockerignore'
      - '.gcloudignore'
      - 'vendor/**'
      - 'tsconfig.json'
      # Coarse on purpose (same rationale as ops-worker): the bundle pulls
      # src/lib transitively. Gate: `pnpm worker:deploy-path-gate`.
      - 'src/lib/**'
      - 'src/emails/**'
      - 'src/types/**'
      - 'src/config/**'
      - 'src/components/**'
      - 'src/i18n/**'
      - 'src/@core/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Single production service (staging is unsupported)'
        type: choice
        required: true
        default: production
        options:
          - production
      expected_sha:
        description: 'Expected git SHA (default: github.sha). TASK-851 — orchestrator passes target_sha.'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      environment:
        description: 'Must be production; there is no staging Auth service'
        type: string
        required: true
      expected_sha:
        description: 'Target git SHA the orchestrator wants deployed'
        type: string
        required: true
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true

# Serialize all callers of the same production service. Never cancel a running deploy.
concurrency:
  group: auth-server-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation to GCP

jobs:
  deploy:
    name: Deploy auth-server to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 25

    environment: production

    env:
      ENV: production
      REQUESTED_ENVIRONMENT: ${{ inputs.environment || 'production' }}
      RAW_EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
      GCP_PROJECT_ID: efeonce-group
      GCP_REGION: us-east4
      # Deployer identity via WIF; runtime identity is the dedicated auth-server SA
      # (set by deploy.sh). Deploy and runtime identities are kept separate on purpose.
      DEPLOYER_SERVICE_ACCOUNT: github-actions-deployer@efeonce-group.iam.gserviceaccount.com
      RUNTIME_SERVICE_ACCOUNT: auth-server@efeonce-group.iam.gserviceaccount.com

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve expected SHA
        id: resolve-sha
        shell: bash
        env:
          RAW_EXPECTED_SHA: ${{ env.RAW_EXPECTED_SHA }}
        run: |
          set -euo pipefail

          # workflow_call retains the caller's event/ref; never trust event_name
          # to distinguish reusable calls from production dispatches.
          if [ "${GITHUB_REF}" != "refs/heads/main" ] || [ "${REQUESTED_ENVIRONMENT}" != "production" ]; then
            echo "ERROR: auth-server serves production; only main + production may deploy."
            exit 1
          fi
          if [[ ! "${RAW_EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: expected_sha must be a full 40-character commit SHA."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${RAW_EXPECTED_SHA}" origin/main; then
            echo "ERROR: expected_sha is not published on main."
            exit 1
          fi
          git checkout --detach "${RAW_EXPECTED_SHA}"
          if [ "$(git rev-parse HEAD)" != "${RAW_EXPECTED_SHA}" ]; then
            echo "ERROR: build checkout does not match expected_sha."
            exit 1
          fi
          echo "EXPECTED_SHA=${RAW_EXPECTED_SHA}" >> "${GITHUB_ENV}"
          echo "expected_sha=${RAW_EXPECTED_SHA}" >> "${GITHUB_OUTPUT}"
          echo "resolution_source=verified-main-commit" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify gcloud account
        run: |
          gcloud config list --format='value(core.project,core.account)'
          gcloud auth list

      - name: Check deployed revision drift
        id: worker-drift
        shell: bash
        env:
          ENV: production
          RESEND_API_KEY_SECRET_REF: greenhouse-resend-api-key-production:1
          AUTH_SERVER_FIRST_PARTY_ENABLED: ${{ vars.AUTH_SERVER_FIRST_PARTY_ENABLED || 'false' }}
          AUTH_SERVER_INVITATION_EMAIL_OTP_ENABLED: ${{ vars.AUTH_SERVER_INVITATION_EMAIL_OTP_ENABLED || 'false' }}
          AUTH_SERVER_INVITATION_EMAIL_OTP_CLIENT_ID: ${{ vars.AUTH_SERVER_INVITATION_EMAIL_OTP_CLIENT_ID || '' }}
          AUTH_SERVER_INVITATION_EMAIL_OTP_ROOMS_ORIGIN: ${{ vars.AUTH_SERVER_INVITATION_EMAIL_OTP_ROOMS_ORIGIN || '' }}
          AUTH_SERVER_INVITATION_EMAIL_OTP_HMAC_SECRET_REF: ${{ vars.AUTH_SERVER_INVITATION_EMAIL_OTP_HMAC_SECRET_REF || '' }}
          ROOMS_INVITATION_AUTHORITY_TOKEN_SECRET_REF: ${{ vars.ROOMS_INVITATION_AUTHORITY_TOKEN_SECRET_REF || '' }}
          DESIRED_AUTH_SERVER_INTERNAL_AUTH_ENABLED: ${{ vars.AUTH_SERVER_INTERNAL_AUTH_ENABLED || 'false' }}
          DESIRED_AUTH_SERVER_INTERNAL_MULTI_ORG_ENABLED: ${{ vars.AUTH_SERVER_INTERNAL_MULTI_ORG_ENABLED || 'false' }}
          DESIRED_AUTH_SERVER_INTERNAL_MULTI_ORG_PROFILE_IDS: ${{ vars.AUTH_SERVER_INTERNAL_MULTI_ORG_PROFILE_IDS || '' }}
          DESIRED_EXTERNAL_IDENTITY_CANARY_ENABLED: ${{ vars.EXTERNAL_IDENTITY_CANARY_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          WORKER_RUNTIME_PATHS=(
            package.json
            pnpm-lock.yaml
            tsconfig.json
            services/auth-server
            scripts/auth-server/rooms-config-drift.py
            .github/workflows/auth-server-deploy.yml
            services/_shared
            src/lib
            src/emails
            src/types
            src/config
            src/components
            src/i18n
            src/@core
          )

          CURRENT_REVISION="$(gcloud run services describe auth-server \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format=json | python3 -c 'import json, sys; traffic = [t for t in json.load(sys.stdin).get("status", {}).get("traffic", []) if t.get("percent", 0) > 0]; sys.exit("ERROR: Auth requires one revision with 100% traffic before deployment") if len(traffic) != 1 or traffic[0].get("percent") != 100 or not traffic[0].get("revisionName") else print(traffic[0]["revisionName"])')"

          CURRENT_GIT_SHA=""
          CURRENT_AUTH_SERVER_INTERNAL_AUTH_ENABLED=""
          CURRENT_EXTERNAL_IDENTITY_CANARY_ENABLED=""
          CURRENT_AUTH_SERVER_INTERNAL_MULTI_ORG_ENABLED=""
          CURRENT_AUTH_SERVER_INTERNAL_MULTI_ORG_PROFILE_IDS=""
          if [ -n "${CURRENT_REVISION}" ]; then
            CURRENT_RUNTIME_STATE=()
            while IFS= read -r runtime_value; do CURRENT_RUNTIME_STATE+=("${runtime_value}"); done < <(gcloud run revisions describe "${CURRENT_REVISION}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --format=json | python3 -c 'import json, sys; data = json.load(sys.stdin); values = {env.get("name"): env.get("value", "") for container in data.get("spec", {}).get("containers", []) or [] for env in container.get("env") or []}; [print(values.get(name, "")) for name in ("GIT_SHA", "AUTH_SERVER_INTERNAL_AUTH_ENABLED", "EXTERNAL_IDENTITY_CANARY_ENABLED", "AUTH_SERVER_INTERNAL_MULTI_ORG_ENABLED", "AUTH_SERVER_INTERNAL_MULTI_ORG_PROFILE_IDS")]' 2>/dev/null || true)
            CURRENT_GIT_SHA="${CURRENT_RUNTIME_STATE[0]:-}"
            CURRENT_AUTH_SERVER_INTERNAL_AUTH_ENABLED="${CURRENT_RUNTIME_STATE[1]:-}"
            CURRENT_EXTERNAL_IDENTITY_CANARY_ENABLED="${CURRENT_RUNTIME_STATE[2]:-}"
            CURRENT_AUTH_SERVER_INTERNAL_MULTI_ORG_ENABLED="${CURRENT_RUNTIME_STATE[3]:-false}"
            CURRENT_AUTH_SERVER_INTERNAL_MULTI_ORG_PROFILE_IDS="${CURRENT_RUNTIME_STATE[4]:-}"
          fi

          if [[ ! "${CURRENT_GIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: active Auth revision has no verifiable source SHA; refusing deployment."
            exit 1
          fi

          ROOMS_CONFIG_MATCHES="false"
          if [ -n "${CURRENT_REVISION}" ]; then
            ROOMS_CONFIG_MATCHES="$(gcloud run revisions describe "${CURRENT_REVISION}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json \
              | python3 scripts/auth-server/rooms-config-drift.py)"
          fi

          CONFIG_MATCHES="false"
          if [ "${CURRENT_AUTH_SERVER_INTERNAL_AUTH_ENABLED}" = "${DESIRED_AUTH_SERVER_INTERNAL_AUTH_ENABLED}" ] \
            && [ "${CURRENT_EXTERNAL_IDENTITY_CANARY_ENABLED}" = "${DESIRED_EXTERNAL_IDENTITY_CANARY_ENABLED}" ] \
            && [ "${CURRENT_AUTH_SERVER_INTERNAL_MULTI_ORG_ENABLED}" = "${DESIRED_AUTH_SERVER_INTERNAL_MULTI_ORG_ENABLED}" ] \
            && [ "${CURRENT_AUTH_SERVER_INTERNAL_MULTI_ORG_PROFILE_IDS}" = "${DESIRED_AUTH_SERVER_INTERNAL_MULTI_ORG_PROFILE_IDS}" ] \
            && [ "${ROOMS_CONFIG_MATCHES}" = "true" ]; then
            CONFIG_MATCHES="true"
          fi

          echo "auth-server config drift: internal_auth current=${CURRENT_AUTH_SERVER_INTERNAL_AUTH_ENABLED:-unset} desired=${DESIRED_AUTH_SERVER_INTERNAL_AUTH_ENABLED}; external_canary current=${CURRENT_EXTERNAL_IDENTITY_CANARY_ENABLED:-unset} desired=${DESIRED_EXTERNAL_IDENTITY_CANARY_ENABLED}"

          if [ -n "${CURRENT_GIT_SHA}" ] && [ "${CURRENT_GIT_SHA}" != "${EXPECTED_SHA}" ]; then
            if ! git cat-file -e "${CURRENT_GIT_SHA}^{commit}" 2>/dev/null; then
              echo "ERROR: cannot verify currently served commit; refusing an unverified source replacement."
              exit 1
            fi
            if ! git merge-base --is-ancestor "${CURRENT_GIT_SHA}" "${EXPECTED_SHA}" \
              && ! git diff --quiet "${EXPECTED_SHA}..${CURRENT_GIT_SHA}" -- "${WORKER_RUNTIME_PATHS[@]}"; then
              echo "ERROR: target would replace unpromoted or newer Auth runtime; promote/reconcile it first."
              exit 1
            fi
          fi

          if [ "${CURRENT_GIT_SHA}" = "${EXPECTED_SHA}" ] && [ "${CONFIG_MATCHES}" = "true" ]; then
            DEPLOY_NEEDED="false"
            echo "auth-server already serves EXPECTED_SHA=${EXPECTED_SHA} with matching runtime config at revision ${CURRENT_REVISION}; skipping build/deploy."
          elif [ -n "${CURRENT_GIT_SHA}" ] \
            && [ "${CONFIG_MATCHES}" = "true" ] \
            && git cat-file -e "${CURRENT_GIT_SHA}^{commit}" 2>/dev/null \
            && git diff --quiet "${EXPECTED_SHA}..${CURRENT_GIT_SHA}" -- "${WORKER_RUNTIME_PATHS[@]}"; then
            DEPLOY_NEEDED="false"
            echo "auth-server serves ${CURRENT_GIT_SHA}; runtime paths and config are unchanged since EXPECTED_SHA=${EXPECTED_SHA}; skipping build/deploy."
          else
            DEPLOY_NEEDED="true"
            echo "auth-server deploy required: current_revision=${CURRENT_REVISION:-none}, current_git_sha=${CURRENT_GIT_SHA:-none}, expected_sha=${EXPECTED_SHA}, config_matches=${CONFIG_MATCHES}"
          fi

          echo "deploy_needed=${DEPLOY_NEEDED}" >> "${GITHUB_OUTPUT}"
          echo "config_matches=${CONFIG_MATCHES}" >> "${GITHUB_OUTPUT}"
          echo "current_revision=${CURRENT_REVISION}" >> "${GITHUB_OUTPUT}"
          echo "current_git_sha=${CURRENT_GIT_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Deploy auth-server
        if: steps.worker-drift.outputs.deploy_needed == 'true'
        run: |
          bash services/auth-server/deploy.sh
        env:
          ENV: ${{ env.ENV }}
          AUTH_SERVER_FIRST_PARTY_ENABLED: ${{ vars.AUTH_SERVER_FIRST_PARTY_ENABLED || 'false' }}
          AUTH_SERVER_INVITATION_EMAIL_OTP_ENABLED: ${{ vars.AUTH_SERVER_INVITATION_EMAIL_OTP_ENABLED || 'false' }}
          AUTH_SERVER_INVITATION_EMAIL_OTP_CLIENT_ID: ${{ vars.AUTH_SERVER_INVITATION_EMAIL_OTP_CLIENT_ID || '' }}
          AUTH_SERVER_INVITATION_EMAIL_OTP_ROOMS_ORIGIN: ${{ vars.AUTH_SERVER_INVITATION_EMAIL_OTP_ROOMS_ORIGIN || '' }}
          AUTH_SERVER_INVITATION_EMAIL_OTP_HMAC_SECRET_REF: ${{ vars.AUTH_SERVER_INVITATION_EMAIL_OTP_HMAC_SECRET_REF || '' }}
          ROOMS_INVITATION_AUTHORITY_TOKEN_SECRET_REF: ${{ vars.ROOMS_INVITATION_AUTHORITY_TOKEN_SECRET_REF || '' }}
          AUTH_SERVER_INTERNAL_AUTH_ENABLED: ${{ vars.AUTH_SERVER_INTERNAL_AUTH_ENABLED || 'false' }}
          AUTH_SERVER_INTERNAL_MULTI_ORG_ENABLED: ${{ vars.AUTH_SERVER_INTERNAL_MULTI_ORG_ENABLED || 'false' }}
          AUTH_SERVER_INTERNAL_MULTI_ORG_PROFILE_IDS: ${{ vars.AUTH_SERVER_INTERNAL_MULTI_ORG_PROFILE_IDS || '' }}
          EXTERNAL_IDENTITY_CANARY_ENABLED: ${{ vars.EXTERNAL_IDENTITY_CANARY_ENABLED || 'false' }}
          EXPECTED_SHA: ${{ steps.resolve-sha.outputs.expected_sha }}

      - name: Verify deployment health
        run: |
          REVISION="$(gcloud run services describe auth-server \
            --project=${GCP_PROJECT_ID} \
            --region=${GCP_REGION} \
            --format='value(status.latestReadyRevisionName)')"
          READY="$(gcloud run services describe auth-server \
            --project=${GCP_PROJECT_ID} \
            --region=${GCP_REGION} \
            --format='value(status.conditions[0].status)')"
          echo "Latest ready revision: ${REVISION}"
          echo "Service ready: ${READY}"
          if [ "${READY}" != "True" ]; then
            echo "::warning::Service reports not-ready. Check Cloud Run logs."
          fi
          echo "✓ auth-server deploy verified (revision ${REVISION})"

      - name: Poll Ready=True bounded
        run: |
          DEADLINE=$((SECONDS + 300))
          while [ ${SECONDS} -lt ${DEADLINE} ]; do
            READY="$(gcloud run services describe auth-server \
              --project=${GCP_PROJECT_ID} \
              --region=${GCP_REGION} \
              --format='value(status.conditions[0].status)')"
            if [ "${READY}" = "True" ]; then
              echo "✓ Service Ready=True at $((SECONDS))s"
              exit 0
            fi
            echo "  waiting Ready=True (current=${READY}, elapsed=${SECONDS}s)"
            sleep 10
          done
          echo "ERROR: Service did not reach Ready=True within 300s"
          exit 1

      - name: Record deployment commit
        run: |
          echo "Deployed commit: ${{ steps.resolve-sha.outputs.expected_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Environment: ${{ env.ENV }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered by: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA resolution: ${{ steps.resolve-sha.outputs.resolution_source }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy needed: ${{ steps.worker-drift.outputs.deploy_needed }}" >> "$GITHUB_STEP_SUMMARY"
