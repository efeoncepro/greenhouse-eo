# AXIS package credential expiry watch (TASK-1589 V1.1).
#
# The AXIS read credential is consumed by Cloud Build only — the four Greenhouse
# worker builds and Globe's — through Secret Manager. GitHub Actions installs the
# private packages with the runner's own GITHUB_TOKEN and never touches it.
#
# That asymmetry is the reason this workflow exists: when the credential expires,
# every PR stays green and the only thing that breaks is a worker build, possibly
# weeks later and under deadline. Nothing in the PR path can see it coming.
name: AXIS credential expiry

on:
  workflow_dispatch:
  schedule:
    # Semanal, martes 13:00 UTC (≈09:00 America/Santiago) — llega en horario
    # laboral, no un lunes de madrugada donde se lee tarde.
    - cron: '0 13 * * 2'

permissions:
  contents: read # checkout
  id-token: write # WIF para leer Secret Manager

concurrency:
  group: axis-credential-expiry
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Sin `pnpm install`: el gate usa solo `fetch` nativo. No necesita el
      # registry privado, así que tampoco necesita el credencial que audita.

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-deployer@efeonce-group.iam.gserviceaccount.com

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: efeonce-group

      # `continue-on-error` a propósito: mientras el secreto siga viviendo en el
      # proyecto legacy `efeonce-globe`, este paso falla. El gate lo trata como
      # "omitido" y sale 0, así que el workflow no hace ruido antes de tiempo y
      # empieza a medir solo en cuanto el secreto exista acá.
      - name: Read AXIS credential from Secret Manager
        id: secret
        continue-on-error: true
        run: |
          umask 077
          if gcloud secrets versions access latest \
            --secret=axis-packages-read-token \
            --project=efeonce-group > "$RUNNER_TEMP/axis-token" 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::El secreto axis-packages-read-token todavía no existe en efeonce-group; gate omitido."
          fi

      - name: Check credential expiry
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/axis-token"' EXIT
          if [ "${{ steps.secret.outputs.available }}" = "true" ]; then
            export AXIS_PACKAGES_READ_TOKEN="$(cat "$RUNNER_TEMP/axis-token")"
          fi
          node scripts/ci/axis-package-credential-expiry-gate.mjs
