            - article [ref=f130e144]:
              - generic [ref=f130e145]:
                - paragraph [ref=f130e146]: Glitch Flash · 28 de septiembre de 2026
                - paragraph [ref=f130e147]:
                  - strong [ref=f130e148]: El micrófono se abre… en modo Flash, porque esta noticia no esperaba al lunes.
                - paragraph [ref=f130e149]: Anthropic lanzó Claude Sonnet 5.5, su modelo del medio. En casi todas las pruebas queda a un par de puntos de Opus 5.5, el modelo grande que presentó la semana pasada. En una, lo supera. Y cuesta la mitad.
                - paragraph [ref=f130e150]: "Por eso no es un lanzamiento más: el modelo del medio dejó de ser el plan B."
                - paragraph [ref=f130e151]: Vamos.
                - generic [ref=f130e152]:
                  - heading "Tabla de contenidos" [level=2] [ref=f130e153]
