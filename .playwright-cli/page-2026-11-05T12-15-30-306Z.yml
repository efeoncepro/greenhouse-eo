                - heading "Qué anunció Anthropic" [level=2] [ref=f130e173]
                - 'figure "Imagen: Anthropic (video de lanzamiento de Claude Sonnet 5.5)." [ref=f130e174]':
                  - 'img "Banner de Glitch Flash: fotograma del video de lanzamiento de Claude Sonnet 5.5, un dial graduado en duotono navy que se desarma en bytes." [ref=f130e175]'
                - paragraph [ref=f130e177]:
                  - text: "Sonnet 5.5 es el segundo modelo de la familia Claude 5.5, una semana después de Opus 5.5. Anthropic lo presenta como su complemento más rápido y barato: Opus queda para el trabajo complejo que exige juicio sostenido; Sonnet, para las tareas acotadas del día a día, corregir bugs y armar documentos, presentaciones y planillas bien terminados. Según el"
                  - link "anuncio oficial" [ref=f130e178] [cursor=pointer]:
                    - /url: https://www.anthropic.com/claude-sonnet-5-5
                  - text: ", también tiene «buen ojo para el diseño»."
                - list [ref=f130e179]:
                  - listitem [ref=f130e180]:
                    - strong [ref=f130e181]: "Velocidad:"
                    - text: genera más de 30% más rápido que Sonnet 5. Es el Sonnet más rápido que Anthropic ha lanzado.
                  - listitem [ref=f130e182]:
                    - strong [ref=f130e183]: "Precio:"
                    - text: USD 2 por millón de tokens de entrada, USD 10 de salida y USD 0,20 en lectura de caché. Es lo mismo que Sonnet 5 y la mitad que Opus 5.5 (USD 4 y USD 20). La escritura en caché cuesta USD 2,50, contra USD 5 en Opus.
                  - listitem [ref=f130e184]:
                    - strong [ref=f130e185]: "Costo por tarea:"
                    - text: según Anthropic, hasta 30% menos que su antecesor, porque necesita muchos menos tokens y agrupa las llamadas a herramientas para terminar el mismo trabajo en menos pasos.
                  - listitem [ref=f130e186]:
                    - strong [ref=f130e187]: "Disponibilidad:"
                    - text: desde hoy en las apps de Claude, en Claude Code, en la API (claude-sonnet-5-5) y en AWS, Google Cloud y Microsoft Azure, con opción de retención cero de datos.
                - paragraph [ref=f130e188]: El tercero de la familia, Haiku 5.5, pensado para alto volumen y bajo costo, llega en las próximas semanas.
                - heading "Los números, uno al lado del otro" [level=2] [ref=f130e189]
                - 'figure "Fuente: Anthropic, anuncio de Claude Sonnet 5.5 (28 de septiembre de 2026)." [ref=f130e190]':
