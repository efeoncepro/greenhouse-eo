                - paragraph [ref=f130e240]: "Opus sigue arriba en casi todas, pero en la mayoría por menos de tres puntos. La excepción es FrontierCode con esfuerzo máximo, donde la distancia sube a ocho. Y en Terminal-Bench 4.0, la prueba de programación con agentes, el orden se invierte: gana Sonnet por cuatro. El salto frente a Sonnet 5 es el otro titular: de 10,3% a 70,6% en esa misma prueba, y unos 400 puntos más en GDPval-AA."
                - paragraph [ref=f130e241]: Anthropic también se compara con GPT-6 Sol, de OpenAI. En FrontierCode, Sonnet 5.5 con esfuerzo alto iguala el mejor puntaje de GPT-6 Sol por cerca de una quinta parte del costo por tarea, y en trabajo de conocimiento de largo aliento y lectura de gráficos queda por encima. Las cifras de GPT-6 Sol llevan notas al pie en el anuncio, así que conviene leerlas con esa cautela.
                - paragraph [ref=f130e242]: "Y hay un matiz que Anthropic pone por escrito: los benchmarks muestran sólo una cara del modelo. En sus pruebas, Opus 5.5 sigue siendo claramente más fuerte en el trabajo complejo y abierto que exige juicio sostenido."
                - heading "El esfuerzo también se elige" [level=2] [ref=f130e243]
                - paragraph [ref=f130e244]: Sonnet 5.5 permite ajustar cuánto «piensa» antes de responder. Con esfuerzo bajo responde más rápido y gasta menos tokens; con esfuerzo alto razona por más tiempo y revisa mejor su trabajo, a un costo mayor por tarea. En las apps de Claude y en Claude Code viene en esfuerzo medio; en la plataforma para desarrolladores, en alto.
                - paragraph [ref=f130e245]: "Lo más interesante del anuncio no está en el máximo, está en el mínimo. Según Anthropic:"
                - list [ref=f130e246]:
                  - listitem [ref=f130e247]: En Terminal-Bench 4.0, con esfuerzo medio, supera de lejos el mejor puntaje de Sonnet 5 por menos de una décima parte del costo por tarea.
                  - listitem [ref=f130e248]: En CursorBench, con esfuerzo bajo, supera el mejor puntaje de Sonnet 5 también por menos de una décima parte del costo.
                  - listitem [ref=f130e249]: En AA-Briefcase, con esfuerzo medio, supera el mejor puntaje de Sonnet 5 por cerca de una novena parte del costo.
                  - listitem [ref=f130e250]: En FrontierCode, con esfuerzo alto, saca 10 puntos más que Sonnet 5 en el mismo ajuste, por cerca de una quinceava parte del costo por tarea.
                - paragraph [ref=f130e251]: "Un detalle para quien lo configure: en FrontierCode rinde mejor con esfuerzo extra alto (52,1%) que con el máximo (46,2%). Más esfuerzo no siempre es mejor resultado."
                - heading "Qué dicen las empresas que lo probaron" [level=2] [ref=f130e252]
                - paragraph [ref=f130e253]: "El anuncio trae resultados de empresas que tuvieron acceso anticipado. Los más concretos:"
                - list [ref=f130e254]:
                  - listitem [ref=f130e255]:
                    - strong [ref=f130e256]: "Zendesk:"
                    - text: con cientos de casos reales de soporte, tomó menos decisiones equivocadas y procesó los tickets 20% más rápido que los modelos de Claude que usan hoy en producción.
                  - listitem [ref=f130e257]:
                    - strong [ref=f130e258]: "Slack:"
                    - text: sin cambiar ningún prompt, superó a Sonnet 5 en casi todas sus evaluaciones internas de Slackbot, en menos pasos y con cerca de 14% menos tokens de salida.
                  - listitem [ref=f130e259]:
                    - strong [ref=f130e260]: "Box:"
                    - text: más preciso, 2,4 veces más rápido y con 12% menos tokens. Además vuelve a revisar los datos en los documentos de origen y encuentra errores que Sonnet 5 no veía.
                  - listitem [ref=f130e261]:
                    - strong [ref=f130e262]: "Lovable:"
                    - text: un tercio menos de llamadas a herramientas y cerca de la mitad de ejecuciones de terminal para terminar una tarea.
                  - listitem [ref=f130e263]:
                    - strong [ref=f130e264]: "Base44:"
                    - text: en 118 aplicaciones construidas, llegó a la calidad de Opus 5 en 3,6 iteraciones por aplicación, contra 7,7 de Opus 5.
                  - listitem [ref=f130e265]:
                    - strong [ref=f130e266]: "Atlassian:"
                    - text: sus agentes Rovo pueden correr hasta 30% más rápido que con Sonnet 5.
                  - listitem [ref=f130e267]:
                    - strong [ref=f130e268]: "Unity:"
                    - text: completó 90% de las tareas de su prueba de varios pasos en Unity Editor y programación.
                  - listitem [ref=f130e269]:
                    - strong [ref=f130e270]: "Epic Games:"
                    - text: en sus pruebas pasó la vara de calidad que se espera de un modelo de gama superior, con decenas de miles de líneas de código y tareas de varias horas.
                - paragraph [ref=f130e271]: Son testimonios que Anthropic eligió para su anuncio. Sirven como señal de dónde rinde el modelo, no como estudio independiente.
                - heading "Más allá del código" [level=2] [ref=f130e272]
                - paragraph [ref=f130e273]: El salto no es sólo de programación. En GDPval-AA, que mide tareas reales de 44 ocupaciones en nueve industrias, Sonnet 5.5 queda prácticamente empatado con Opus 5.5. También se acerca a Opus en uso del computador y en lectura de gráficos.
                - paragraph [ref=f130e274]: "Anthropic cuenta una prueba interna que le habla directo a marketing y finanzas: le entregaron los materiales de resultados trimestrales de una empresa pública, las transcripciones de su llamada con inversionistas y una plantilla de presentación, y le pidieron una revisión operativa de 10 láminas. Dos expertos consideraron que el primer borrador estaba listo para enviarse tal cual."
                - paragraph [ref=f130e275]: "En diseño, los probadores destacaron que pule interfaces y sigue plantillas de presentaciones con muy poca edición. Y un dato de color que no es menor: es el primer Sonnet que termina Pokémon Rojo mirando sólo capturas de pantalla, una prueba de razonamiento de largo aliento y comprensión de imágenes."
                - heading "El modelo del medio dejó de ser el plan B" [level=2] [ref=f130e276]
                - complementary "Glitch" [ref=f130e277]:
                  - paragraph [aria-hidden] [ref=f130e278]: Glitch
                  - generic [ref=f130e279]: "Durante mucho tiempo la regla fue sencilla: si la tarea importaba, ibas al modelo más grande. Sonnet 5.5 la rompe justo donde más duele, en el trabajo de agentes que escriben código y ejecutan tareas: ahí el modelo del medio no sólo alcanza al grande, lo pasa. Por la mitad del precio.La pregunta ya no es «¿cuál es el mejor modelo?», sino «¿para qué tarea necesito de verdad el más caro?»."
                - paragraph [ref=f130e280]:
                  - text: Es la misma conversación que abrimos con
                  - link "GPT-5.6 y ChatGPT Work" [ref=f130e281] [cursor=pointer]:
                    - /url: https://efeoncepro.com/glitch/gpt-5-6-y-chatgpt-work-openai/
                  - text: ": no se trata de elegir un modelo, sino de repartir el trabajo entre niveles de inteligencia. Con Sonnet 5.5, esa repartición se vuelve bastante más barata."
                - 'heading "Seguridad: lo que trae el modelo" [level=2] [ref=f130e282]'
                - list [ref=f130e283]:
                  - listitem [ref=f130e284]:
                    - strong [ref=f130e285]: "Alineación:"
                    - text: en una auditoría de comportamiento con cerca de 1.850 escenarios, iguala o mejora a Sonnet 5 en la mayoría de las medidas de alineación, resistencia al mal uso y honestidad. Anthropic dice no haber encontrado evidencia de que persiga objetivos contrarios a los del usuario.
                  - listitem [ref=f130e286]:
                    - strong [ref=f130e287]: "Ciberseguridad:"
                    - text: es el primer Sonnet que sale con salvaguardas como las de Opus 5.5. Corregir bugs en el trabajo normal no cambia, pero las tareas de ciberseguridad de mayor riesgo pasan a Sonnet 5, y se ve cuando ocurre.
                  - listitem [ref=f130e288]:
                    - strong [ref=f130e289]: "Destilación:"
                    - text: estrena clasificadores que impiden extraer su razonamiento a escala con cuentas falsas, y el razonamiento queda ligado a la cuenta que lo generó.
                  - listitem [ref=f130e290]:
                    - strong [ref=f130e291]: "Biología:"
                    - text: mantiene las mismas salvaguardas que Sonnet 5.
                - heading "Lo que cambia para tu equipo" [level=2] [ref=f130e292]
                - list [ref=f130e293]:
                  - listitem [ref=f130e294]:
                    - strong [ref=f130e295]: Revisa qué modelo corre en cada flujo.
                    - text: Si todo pasa por el modelo grande por costumbre, ahí hay un costo que nadie está mirando.
                  - listitem [ref=f130e296]:
                    - strong [ref=f130e297]: Mide por tarea terminada, no por token.
                    - text: El ahorro que promete Sonnet 5.5 viene de usar menos tokens y menos pasos, algo que la tarifa por millón no muestra. Lo contamos en
                    - 'link "Glitch #16" [ref=f130e298] [cursor=pointer]':
                      - /url: https://efeoncepro.com/glitch/glitch-costo-real-ia-tarea/
                    - text: .
                  - listitem [ref=f130e299]:
                    - strong [ref=f130e300]: Empieza por el esfuerzo bajo o medio.
                    - text: Según los números del anuncio, ahí está la mejor relación entre resultado y costo; sube sólo cuando la tarea lo pida.
                  - listitem [ref=f130e301]:
                    - strong [ref=f130e302]: Reserva el modelo grande
                    - text: para lo que exige pensar en profundidad y donde equivocarse sale caro.
                  - listitem [ref=f130e303]:
                    - strong [ref=f130e304]: Prueba antes de migrar.
                    - text: Corre tus propias tareas con los dos modelos y compara resultado, tiempo y costo. Los benchmarks del anuncio son una pista, no tu caso. Y si usas la API con el razonamiento apagado, revisa la guía de migración de Anthropic antes de cambiar.
                - heading "Lo que falta ver" [level=2] [ref=f130e305]
                - paragraph [ref=f130e306]: Todas las cifras de este Flash son de Anthropic y de las empresas que eligió para su anuncio. Faltan las evaluaciones independientes que confirmen la velocidad y el ahorro en tareas reales, fuera de las pruebas del laboratorio.
                - paragraph [ref=f130e307]: También falta Haiku 5.5, que completa la familia en las próximas semanas y puede mover otra vez la cuenta de qué modelo usar para cada cosa.
                - paragraph [ref=f130e308]: Lo vamos a seguir mirando. Si los números aguantan, esta semana cambió la forma de armar un stack de IA.
                - separator [ref=f130e309]
                - paragraph [ref=f130e310]:
                  - strong [ref=f130e311]: El micrófono se cierra. — El equipo editorial de Glitch.
                  - text: ¿Te llegó por otro lado?
                  - link "Suscríbete a Glitch" [ref=f130e312] [cursor=pointer]:
                    - /url: https://efeoncepro.com/glitch/
                  - text: y recibe la edición completa cada lunes.
      - region "Sobre el autor" [ref=f130e317]:
        - img "Julio Reyes" [ref=f130e319]
        - generic [ref=f130e324]:
          - paragraph [ref=f130e325]: Escribe
          - paragraph [ref=f130e326]: Julio Reyes.
          - paragraph [ref=f130e327]: Managing & GTM Director · Efeonce Group
          - paragraph [ref=f130e328]: "Más de 12 años diseñando sistemas de marketing, crecimiento y operaciones creativas para empresas medianas y grandes de Latinoamérica: banca, manufactura, retail y SaaS."
