    - paragraph [ref=e68]:
      - text: La comparación oficial de velocidad está reproducida a
      - strong [ref=e69]: 8×
      - text: ", según la descripción del anuncio. Sirve para observar la secuencia comparada; no para cronometrar una generación como si estuviéramos viendo tiempo real."
    - paragraph [ref=e70]: La velocidad puede cambiar la conversación creativa. Si una alternativa llega mientras el equipo todavía tiene presente la decisión que estaba discutiendo, es más fácil comparar una luz, un encuadre o una intención. Si llega mucho después, alguien tiene que reconstruir el contexto antes de opinar. Reducir esa espera tiene valor, aunque la pieza final tarde más.
    - paragraph [ref=e71]: "Ahora bien, producir alternativas más rápido también puede llenar la mesa de versiones que nadie tiene tiempo de revisar. Una exploración necesita una pregunta: decidir entre una escena íntima y una abierta, probar dos jerarquías o encontrar un fondo que permita leer el titular. Pedir veinte opciones sin saber qué estamos comparando sólo acelera la indecisión."
    - complementary [ref=e72]:
      - text: GLITCH DROP
      - paragraph [ref=e73]: Si duplicas las alternativas, alguien tendrá que elegir entre ellas.
      - paragraph [ref=e74]: La velocidad necesita un criterio de descarte para convertirse en capacidad de producción.
    - paragraph [ref=e75]: Por eso separaría dos mediciones. Una registra cuánto demora el modelo en devolver una imagen. La otra registra cuánto demora el equipo en aceptar una dirección y llegar a un archivo utilizable. El lanzamiento habla directamente de la primera; el trabajo de cada organización tendrá que demostrar qué pasa con la segunda.
    - heading "Editar sin volver a negociar toda la imagen" [level=2] [ref=e76]
    - paragraph [ref=e77]: Imagina una pieza de producto que ya tiene aprobado el encuadre. Falta cambiar el color de un elemento secundario. El pedido parece sencillo, pero el resultado sólo sirve si la forma del envase, las proporciones y el resto de la escena siguen siendo los que aprobaste.
    - paragraph [ref=e78]:
      - text: La edición por anotaciones ayuda a expresar dónde está el cambio. El
      - strong [ref=e79]:
        - link "changelog de la API del 4 de noviembre" [ref=e80] [cursor=pointer]:
          - /url: https://developers.openai.com/api/docs/changelog
      - text: confirma el soporte de image markup para los modelos compatibles 2.5 y 2.6. La
      - strong [ref=e81]:
        - link "referencia de edición" [ref=e82] [cursor=pointer]:
          - /url: https://developers.openai.com/api/reference/resources/images/methods/edit
      - text: describe una capa PNG transparente, del mismo tamaño que la primera imagen, sobre la cual se dibujan las indicaciones.
