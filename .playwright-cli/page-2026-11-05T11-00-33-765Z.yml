      - text: ", ya trabajaba la fidelidad, los bocetos y la consistencia durante varias ediciones. La historia de 2.6 no empieza desde cero: suma posibilidades sobre una dirección que OpenAI ya venía desarrollando."
    - heading "La velocidad sirve cuando puedes seguir pensando" [level=2] [ref=e57]
    - paragraph [ref=e58]:
