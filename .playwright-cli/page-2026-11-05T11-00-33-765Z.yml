    - figure [ref=e87]:
      - img "La misma cocina con el florero azul y sin la anotación roja." [ref=e88]
      - generic [ref=e89]:
        - text: "El resultado de Sunburst: jarrón azul cobalto y círculo eliminado. Ejemplo publicado por OpenAI; no es una prueba realizada por Efeonce."
        - 'link "Crédito: OpenAI — ejemplo oficial de GPT Image 2.6 Sunburst" [ref=e90] [cursor=pointer]':
          - /url: https://developers.openai.com/api/docs/guides/image-prompting
        - text: .
    - paragraph [ref=e91]:
      - text: En el ejemplo de la
      - strong [ref=e92]:
        - link "guía de prompts de OpenAI" [ref=e93] [cursor=pointer]:
          - /url: https://developers.openai.com/api/docs/guides/image-prompting
      - text: ", una marca roja identifica un florero y la salida lo muestra azul. Mira también la mesa, las sillas y los objetos cercanos. La utilidad de una corrección localizada se juega tanto en el objeto que cambia como en todo aquello que debía quedarse quieto."
    - paragraph [ref=e94]: "Una demostración seleccionada no nos dice qué porcentaje de intentos conserva bien una escena. Sí permite formular una prueba mejor que «haz algo parecido»: partir de la misma imagen, pedir una modificación delimitada y revisar una lista explícita de elementos que deben permanecer. Después repetir el ejercicio con una segunda corrección. Ahí empieza a aparecer la diferencia entre una imagen atractiva y un proceso confiable."
    - complementary [ref=e95]:
      - text: GLITCH DROP
      - paragraph [ref=e96]: Una corrección pequeña debería tener un perímetro pequeño de revisión.
      - paragraph [ref=e97]: Si cambiar un florero obliga a revisar de nuevo toda la cocina, todavía hay trabajo que el equipo está absorbiendo.
    - paragraph [ref=e98]: Para una marca, ese perímetro puede incluir la geometría de un producto, un personaje, el vestuario, una textura o el espacio reservado para el copy. Escríbelo antes de generar. Si la condición sólo existe en la cabeza de quien aprueba, cada nueva versión vuelve a abrir la misma conversación.
    - 'heading "Calidad y complejidad: dos decisiones distintas" [level=2] [ref=e99]'
    - paragraph [ref=e100]: "El nuevo control de complejidad merece una pausa porque invita a un error conocido: subir todos los parámetros y esperar que eso resuelva el brief."
    - paragraph [ref=e101]:
      - text: La
      - strong [ref=e102]:
        - link "referencia de generación" [ref=e103] [cursor=pointer]:
          - /url: https://developers.openai.com/api/reference/resources/images/methods/generate
      - text: distingue complexity de quality. El primero regula el esfuerzo de planificación; el segundo, la calidad visual de salida. La
      - strong [ref=e104]:
        - link "guía de generación" [ref=e105] [cursor=pointer]:
          - /url: https://developers.openai.com/api/docs/guides/image-generation
      - text: recomienda probar complejidad baja para muchas ediciones y reservar niveles mayores para solicitudes con más elementos o restricciones.
    - paragraph [ref=e106]: Pensemos en dos pedidos hipotéticos. En uno cambias el color de una taza. En el otro compones una mesa con varias personas, productos identificables, un gesto particular y espacio para un titular. Los dos pueden necesitar una imagen final cuidada, pero el problema de relaciones entre elementos es muy distinto.
    - paragraph [ref=e107]: Esa separación abre una forma más precisa de experimentar. Mantén la calidad que exige el uso final y cambia la complejidad para observar si mejora el cumplimiento del pedido. Después compara el tiempo y las alteraciones que introduce. El ajuste útil será el que resuelva ese trabajo con menos fricción; no hay una combinación universal para todas las marcas, escenas y correcciones.
    - paragraph [ref=e108]: En un flujo compartido, registra también la configuración. Una persona del equipo debería poder entender cómo se obtuvo una versión aceptada sin reconstruir una tarde completa de pruebas. El prompt ayuda, pero una captura aislada del prompt no guarda por sí sola las referencias, las decisiones y los parámetros que hicieron funcionar el resultado.
    - blockquote [ref=e109]: La siguiente versión también debe conservar lo que ya decidiste.
    - 'heading "GIF: el movimiento también necesita una intención" [level=2] [ref=e110]'
    - paragraph [ref=e111]: "Las animaciones breves son una de las novedades más visibles. El anuncio muestra ejemplos de OpenArt y Town: personajes, reacciones y pequeñas escenas que exploran movimiento. Son demostraciones del lanzamiento, seleccionadas por el proveedor y sus colaboradores; no evaluaciones independientes de una campaña."
    - figure [ref=e112]:
      - iframe [ref=e113]
      - generic [ref=e114]:
        - text: Montaje oficial de escenas animadas generadas con Images 2.6.
        - 'link "Crédito: OpenAI" [ref=e115] [cursor=pointer]':
          - /url: https://openai.com/index/introducing-images-2-6/
        - text: .
        - link "Abrir video oficial" [ref=e116] [cursor=pointer]:
          - /url: https://player.vimeo.com/video/1242918503?h=5974be9997
        - text: .
    - paragraph [ref=e117]: "La documentación oficial añade este ejemplo de un personaje con una linterna. Sirve para mirar un loop con una tarea concreta: seguir el gesto, observar qué partes del personaje permanecen y revisar la transición entre el final y el principio."
    - figure [ref=e118]:
      - img "Personaje con abrigo verde que levanta una linterna frente a una cabaña nevada." [ref=e119]
      - generic [ref=e120]:
        - text: "GIF oficial de Sunburst: nueve fotogramas y un bucle de 1,8 segundos. La novedad se entiende mejor viéndola."
        - 'link "Crédito: OpenAI — ejemplo oficial de GPT Image 2.6 Sunburst" [ref=e121] [cursor=pointer]':
          - /url: https://developers.openai.com/api/docs/guides/image-prompting
        - text: .
    - paragraph [ref=e122]: "Un GIF puede resolver una reacción, una señal de estado o el pequeño gesto de una mascota. La pregunta creativa viene antes del movimiento: ¿qué debe comunicar ese gesto que una imagen fija no comunica igual? Si no hay respuesta, probablemente sólo estamos agregando actividad a la pieza."
    - paragraph [ref=e123]: Para una marca, revisaría especialmente que el personaje siga siendo reconocible en cada cuadro y que el loop tenga una vuelta natural. Una deformación apenas perceptible en una reproducción puede volverse evidente después de verla repetirse diez veces. También importan el peso del archivo, el tamaño de visualización y el formato que acepte el canal.
    - paragraph [ref=e124]: Esto no convierte a los modelos en un sistema de producción audiovisual completo. Un GIF no trae por sí solo sonido, montaje ni control narrativo de una secuencia larga. Si el destino requiere MP4, habrá otra etapa de preparación. Y si se usa en una interfaz, hay que decidir cuándo se mueve, cuándo se detiene y cómo se comporta para quien prefiere menos animación.
    - complementary [ref=e125]:
      - text: GLITCH DROP
      - paragraph [ref=e126]: Antes de animar una mascota, decide qué está diciendo con el movimiento.
      - paragraph [ref=e127]: Una identidad también se reconoce por sus gestos; no sólo por su silueta.
    - paragraph [ref=e128]:
      - text: Al revisar las fuentes el 5 de noviembre, la
      - strong [ref=e129]:
        - link "guía de generación" [ref=e130] [cursor=pointer]:
          - /url: https://developers.openai.com/api/docs/guides/image-generation
      - text: admite hasta 64 cuadros por GIF y la
      - strong [ref=e131]:
        - link "referencia de generación" [ref=e132] [cursor=pointer]:
          - /url: https://developers.openai.com/api/reference/resources/images/methods/generate
      - text: indica hasta 16. Esa discrepancia entre páginas oficiales impide dar aquí un máximo como condición cerrada. Antes de comprometer una animación, comprueba la operación, el acceso y el archivo real en la cuenta con la que vas a trabajar.
    - 'heading "SVG: recibir vectores abre otra etapa de trabajo" [level=2] [ref=e133]'
    - paragraph [ref=e134]:
      - text: La salida SVG en la API puede ser especialmente útil para equipos que necesitan gráficos escalables. La
      - strong [ref=e135]:
        - link "referencia de generación" [ref=e136] [cursor=pointer]:
          - /url: https://developers.openai.com/api/reference/resources/images/methods/generate
      - text: describe un flujo con una imagen de referencia y un modelo autor que produce el SVG. Eso explica por qué conviene mirar tanto el resultado visual como la estructura del archivo, y por qué su costo puede tener más de un componente.
    - figure [ref=e137]:
      - img "Ejemplo SVG de Field & Flour con un pan, espigas y un rodillo." [ref=e138]
      - generic [ref=e139]:
        - text: Un SVG generado por Sunburst para la marca ficticia Field & Flour. Sus trazados, formas y colores se pueden editar.
        - 'link "Crédito: OpenAI — ejemplo oficial de GPT Image 2.6 Sunburst" [ref=e140] [cursor=pointer]':
          - /url: https://developers.openai.com/api/docs/guides/image-prompting
        - text: .
    - paragraph [ref=e141]: El ejemplo oficial de Field & Flour permite revisar una composición con ilustración y lettering. Que un archivo se pueda ampliar no resuelve automáticamente su espaciado, la coherencia del trazo o su funcionamiento en tamaños pequeños. Un vector también puede dibujar una decisión equivocada con una nitidez impecable.
    - paragraph [ref=e142]: "Yo lo evaluaría en tres usos reales: el tamaño al que se va a leer, una reducción exigente y una ampliación donde aparezcan los detalles del trazado. Después comprobaría si el equipo puede editarlo de forma razonable. Un archivo que exige rehacer casi todo para cambiar una palabra tiene un valor distinto al de uno que permite continuar el trabajo."
    - paragraph [ref=e143]: Para un logo o un sistema de iconos, además hay decisiones de identidad que no se delegan a la extensión del archivo. Hay que revisar formas, jerarquía, consistencia con el sistema y usos previstos. En impresión también corresponde verificar el proceso de salida. El SVG puede ser un material de trabajo valioso; su aprobación sigue dependiendo del uso.
    - heading "Qué muestran las piezas con texto y producto" [level=2] [ref=e144]
    - paragraph [ref=e145]: "Los ejemplos oficiales de la guía también incluyen una infografía de una cafetera en español y una escena publicitaria de producto. Son útiles para mirar asuntos más exigentes que el acabado general: legibilidad, relaciones entre partes y reconocimiento del objeto."
    - figure [ref=e146]:
      - img "Diagrama de una cafetera con etiquetas en español." [ref=e147]
      - generic [ref=e148]:
        - text: OpenAI muestra la traducción al español de una infografía conservando su estructura visual. El texto igual necesita revisión.
        - 'link "Crédito: OpenAI — ejemplo oficial de GPT Image 2.6 Sunburst" [ref=e149] [cursor=pointer]':
          - /url: https://developers.openai.com/api/docs/guides/image-prompting
        - text: .
    - paragraph [ref=e150]: En una infografía, revisa cada etiqueta y el vínculo entre el texto y la pieza que pretende explicar. Luego reduce la imagen al ancho de un teléfono. La información tiene que seguir siendo comprensible ahí. Una demostración de texto dentro de una imagen tampoco verifica que las afirmaciones técnicas del diagrama sean correctas.
    - figure [ref=e151]:
      - img "Cartel publicitario de un champú en una escena invernal." [ref=e152]
      - generic [ref=e153]:
        - text: "Una nueva condición sobre una imagen anterior: el mismo concepto de producto convertido en una escena invernal."
        - 'link "Crédito: OpenAI — ejemplo oficial de GPT Image 2.6 Sunburst" [ref=e154] [cursor=pointer]':
          - /url: https://developers.openai.com/api/docs/guides/image-prompting
        - text: .
    - paragraph [ref=e155]: En una escena publicitaria, observa el producto, la escala y lo que ocurre alrededor del envase. Una imagen puede resultar convincente como conjunto y contener un detalle incompatible con el producto real. Esa diferencia importa mucho si la pieza se va a usar para venderlo.
    - paragraph [ref=e156]:
      - text: Puedes contrastar ambos ejemplos y sus instrucciones completas en la
      - strong [ref=e157]:
        - link "guía oficial de prompts de OpenAI" [ref=e158] [cursor=pointer]:
          - /url: https://developers.openai.com/api/docs/guides/image-prompting
      - text: ". Si te interesa aplicarlos a tu marca, conserva esa relación entre el pedido y el resultado: es lo que permite entender qué estás evaluando."
