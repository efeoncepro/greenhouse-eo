    - paragraph [ref=e11]: El micrófono se abre… en modo Flash.
    - paragraph [ref=e12]: La primera imagen puede salir preciosa. El problema aparece cuando alguien pide cambiar el fondo, mantener el producto exactamente igual y mover un detalle que ya estaba aprobado. De pronto estás revisando otra vez la etiqueta, la cara y una mano que antes funcionaba. Una corrección pequeña acaba de convertirse en una revisión completa.
    - paragraph [ref=e13]:
      - text: "Esa es la parte del lanzamiento de Images 2.6 que me interesa mirar: cuánto control conserva un equipo cuando empieza a trabajar sobre una imagen. OpenAI lo anunció el"
      - strong [ref=e14]: 4 de noviembre de 2026
      - text: ", con más velocidad, nuevas opciones de edición y formatos que incluyen GIF y SVG."
      - strong [ref=e15]:
        - link "El anuncio oficial" [ref=e16] [cursor=pointer]:
          - /url: https://openai.com/index/introducing-images-2-6/
      - text: reúne ejemplos y testimonios de sus primeros usuarios.
    - paragraph [ref=e17]: Hay material para entusiasmarse y también para hacer preguntas bastante concretas. Vamos a revisar qué llegó, qué muestran las demostraciones y cómo evaluar si este lanzamiento sirve para producir una campaña, además de una buena imagen para compartir el día del anuncio.
