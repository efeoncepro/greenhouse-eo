      - text: Conviene ordenar los nombres desde el principio.
      - strong [ref=e23]: Images 2.6
      - text: es el nombre del lanzamiento; en la API aparecen dos modelos.
      - strong [ref=e24]:
        - link "GPT Image 2.6 Flare" [ref=e25] [cursor=pointer]:
          - /url: https://developers.openai.com/api/docs/models/gpt-image-2.6-flare
      - text: se orienta a iterar rápido.
      - strong [ref=e26]:
        - link "GPT Image 2.6 Sunburst" [ref=e27] [cursor=pointer]:
          - /url: https://developers.openai.com/api/docs/models/gpt-image-2.6-sunburst
      - text: apunta al trabajo visual con mayor detalle. Ambos reciben texto e imágenes.
