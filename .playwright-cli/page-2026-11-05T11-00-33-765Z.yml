          - cell "USD 30" [ref=e190]
    - paragraph [ref=e191]: No son precios fijos por imagen. El total depende del consumo de la operación. Tampoco describen la suscripción de ChatGPT. Y la tarifa por token, incluso cuando coincide con la de otro modelo, no prueba que producir la misma pieza vaya a costar lo mismo.
    - paragraph [ref=e192]: "Para decidir en producción, agregaría otra cuenta. Cuántos resultados se descartan, cuántas correcciones requiere el elegido y cuánto tiempo humano consume llegar al archivo aprobado. No hace falta una planilla sofisticada para comenzar: registra la tarea, los intentos, el consumo que devuelve la API y los minutos de revisión."
    - complementary [ref=e193]:
      - text: GLITCH DROP
      - paragraph [ref=e194]: El costo de una pieza se conoce cuando termina la revisión.
      - paragraph [ref=e195]: Un archivo barato que vuelve tres veces a corrección todavía tiene trabajo por pagar.
    - paragraph [ref=e196]: Esto permite discutir una elección con contexto. Un modelo puede justificar un mayor consumo si evita trabajo posterior; otro puede resultar más conveniente para explorar direcciones que todavía no necesitan detalle. Esas son hipótesis para medir con tareas comparables. Una tabla de tarifas no elige por ti.
    - heading "Lo que falta comprobar antes de incorporarlo a una campaña" [level=2] [ref=e197]
    - paragraph [ref=e198]:
      - text: La documentación conserva límites sobre consistencia, texto y composiciones complejas. Además, la
      - strong [ref=e199]:
        - link "system card de Images 2.6" [ref=e200] [cursor=pointer]:
          - /url: https://deploymentsafety.openai.com/chatgpt-images-2-6
      - text: describe evaluaciones y mitigaciones de seguridad, incluidas las relacionadas con GIF. Esas evaluaciones sirven para entender el tratamiento del riesgo; no certifican la calidad creativa de una pieza ni reemplazan su revisión editorial.
    - paragraph [ref=e201]: Para una campaña, añadiría preguntas que la galería del lanzamiento no puede responder por nosotros. ¿El mismo personaje se sostiene en una serie? ¿La etiqueta conserva sus proporciones después de varias correcciones? ¿Una adaptación deja espacio para el texto que realmente debe llevar? ¿El equipo puede continuar una versión sin depender de quien la generó?
    - paragraph [ref=e202]: También conviene distinguir entre un error del modelo y una decisión que nunca se especificó. Si el equipo no definió cuánto puede cambiar un producto o qué rasgos identifican a un personaje, la revisión termina usando criterios que aparecen después del resultado. Eso vuelve difícil aprender de los intentos y comparar herramientas.
    - paragraph [ref=e203]: No daría por resuelta una comparación con otros generadores a partir de este anuncio. Para elegir entre modelos necesitamos el mismo encargo, referencias equivalentes y condiciones de evaluación claras. Los ejemplos destacados por un proveedor son un punto de partida para investigar, no una clasificación independiente.
    - heading "Cómo lo probaría con una tarea real" [level=2] [ref=e204]
    - paragraph [ref=e205]: "Elegiría una tarea recurrente y acotada: una imagen de producto que necesite dos correcciones y una adaptación. Usaría material autorizado y dejaría por escrito lo que debe permanecer. El objetivo inicial sería entender el comportamiento del flujo, antes de extenderlo a una tanda completa."
    - list [ref=e206]:
      - listitem [ref=e207]:
        - strong [ref=e208]: Fija el punto de partida.
        - text: Guarda referencias, formato, textos exactos y elementos que no pueden cambiar. Separa preferencias de condiciones obligatorias.
      - listitem [ref=e209]:
        - strong [ref=e210]: Haz una comparación controlada.
        - text: Entrega el mismo encargo a los modelos que quieras evaluar. Registra los parámetros y conserva también los resultados rechazados.
      - listitem [ref=e211]:
        - strong [ref=e212]: Pide correcciones concretas.
        - text: Cambia un elemento y después otro. Revisa si lo ya aprobado se conserva; no juzgues sólo la primera salida.
      - listitem [ref=e213]:
        - strong [ref=e214]: Mira el archivo en su destino.
        - text: Prueba la lectura en móvil, la edición del vector o la reproducción del loop según corresponda. Evalúa el uso real.
      - listitem [ref=e215]:
        - strong [ref=e216]: Cierra la cuenta completa.
        - text: Anota intentos, consumo, minutos de revisión y motivo de aceptación o descarte. Repite antes de convertir un resultado aislado en una regla.
    - paragraph [ref=e217]: "Una prueba así deja algo que una tarde de exploración suele perder: razones para elegir. También hace visible qué parte del proceso necesita mejorar. Puede ser el modelo, una referencia insuficiente, un criterio de aprobación ambiguo o una etapa manual que sigue consumiendo demasiado tiempo."
    - paragraph [ref=e218]:
      - text: Si quieres profundizar en esa organización del trabajo, en
      - strong [ref=e219]:
        - link "Creative Workflows" [ref=e220] [cursor=pointer]:
          - /url: https://efeoncepro.com/design/creative-workflows/
      - text: desarrollamos cómo conectar decisiones creativas, herramientas y continuidad. Es una conversación especialmente pertinente cuando cada lanzamiento hace más fácil producir archivos y más necesario entender qué merece avanzar.
    - heading "El micrófono se cierra" [level=2] [ref=e221]
    - paragraph [ref=e222]: Images 2.6 abre posibilidades interesantes para iterar, dirigir correcciones y llevar una idea hacia otros formatos. La prueba más útil empieza cuando eliges una de esas posibilidades y la llevas a una tarea con condiciones reales.
    - paragraph [ref=e223]: "Me quedaría con una escena sencilla: tienes una pieza que funciona y alguien pide cambiar un detalle. Si el siguiente resultado conserva lo que estaba bien y resuelve el pedido, el equipo avanza. Si obliga a comenzar de nuevo, habrá que entender dónde se perdió el control. Ahí se juega buena parte del valor de este lanzamiento."
    - paragraph [ref=e224]:
      - text: Para seguir estas conversaciones,
      - strong [ref=e225]:
        - link "suscríbete a Glitch" [ref=e226] [cursor=pointer]:
          - /url: https://efeoncepro.com/glitch/
      - text: ": cada lunes, IA, marketing y negocios con una lectura que ayude a decidir. Cuando una noticia no espera al lunes, abrimos el micrófono en modo Flash."
    - paragraph [ref=e227]:
      - emphasis [ref=e228]: "Nota editorial: este artículo se preparó con apoyo de agentes de IA en investigación, estructura y edición. Las demostraciones visuales pertenecen a OpenAI y a los colaboradores identificados. Los ejemplos analizados proceden de la documentación de lanzamiento; las recomendaciones de evaluación son una propuesta editorial, no resultados de pruebas propias. Las fuentes y condiciones se revisaron el 5 de noviembre de 2026."