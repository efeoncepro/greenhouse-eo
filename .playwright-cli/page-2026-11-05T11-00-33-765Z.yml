    - paragraph [ref=e51]:
      - text: El
      - strong [ref=e52]:
        - link "Centro de Ayuda de OpenAI" [ref=e53] [cursor=pointer]:
          - /url: https://help.openai.com/en/articles/11084440-images-in-chatgpt
      - text: "aclara una distinción importante: Images está disponible en todos los planes, pero las funciones no tienen necesariamente el mismo despliegue. La creación de GIF sigue llegando a ChatGPT. Images con thinking está disponible en Plus, Pro y Business; Enterprise y Edu figuran como próximos. Antes de prometer un flujo a tu equipo, comprueba la cuenta que lo va a ejecutar."
    - paragraph [ref=e54]:
      - text: También hay continuidad.
      - strong [ref=e55]:
        - link "Images 2.5, presentado el 8 de septiembre" [ref=e56] [cursor=pointer]:
