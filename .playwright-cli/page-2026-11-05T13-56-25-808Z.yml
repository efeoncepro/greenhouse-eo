                  - generic [ref=e498]:
                    - text: Un SVG generado por Sunburst para la marca ficticia Field & Flour. Sus trazados, formas y colores se pueden editar.
                    - 'link "Crédito: OpenAI — ejemplo oficial de GPT Image 2.6 Sunburst." [ref=e499] [cursor=pointer]':
                      - /url: https://developers.openai.com/api/docs/guides/image-prompting
                - paragraph [ref=e500]: El ejemplo oficial de Field & Flour permite revisar una composición con ilustración y lettering. Que un archivo se pueda ampliar no resuelve automáticamente su espaciado, la coherencia del trazo o su funcionamiento en tamaños pequeños. Un vector también puede dibujar una decisión equivocada con una nitidez impecable.
                - paragraph [ref=e501]: "Yo lo evaluaría en tres usos reales: el tamaño al que se va a leer, una reducción exigente y una ampliación donde aparezcan los detalles del trazado. Después comprobaría si el equipo puede editarlo de forma razonable. Un archivo que exige rehacer casi todo para cambiar una palabra tiene un valor distinto al de uno que permite continuar el trabajo."
                - paragraph [ref=e502]: Para un logo o un sistema de iconos, además hay decisiones de identidad que no se delegan a la extensión del archivo. Hay que revisar formas, jerarquía, consistencia con el sistema y usos previstos. En impresión también corresponde verificar el proceso de salida. El SVG puede ser un material de trabajo valioso; su aprobación sigue dependiendo del uso.
                - heading "Qué muestran las piezas con texto y producto" [level=2] [ref=e503]
                - paragraph [ref=e504]: "Los ejemplos oficiales de la guía también incluyen una infografía de una cafetera en español y una escena publicitaria de producto. Son útiles para mirar asuntos más exigentes que el acabado general: legibilidad, relaciones entre partes y reconocimiento del objeto."
                - figure [ref=e506]:
