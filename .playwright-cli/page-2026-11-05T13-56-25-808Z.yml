                - 'heading "GIF: el movimiento también necesita una intención" [level=2] [ref=e465]'
                - paragraph [ref=e466]: "Las animaciones breves son una de las novedades más visibles. El anuncio muestra ejemplos de OpenArt y Town: personajes, reacciones y pequeñas escenas que exploran movimiento. Son demostraciones del lanzamiento, seleccionadas por el proveedor y sus colaboradores; no evaluaciones independientes de una campaña."
