                    - /url: https://efeoncepro.com/wp-content/uploads/2026/11/glitch-images-2-6-images-2-6-gif-montage-poster.webp
                    - img "Letras de colores con el nombre Images 2.6 en el anuncio oficial." [ref=e294]
                  - generic [ref=e295]:
                    - text: Letras de colores con el nombre Images 2.6 en el anuncio oficial.
                    - 'link "Crédito: OpenAI — anuncio oficial de Images 2.6, 4 de noviembre de 2026." [ref=e296] [cursor=pointer]':
                      - /url: https://openai.com/index/introducing-images-2-6/
                - paragraph [ref=e297]:
                  - text: Conviene ordenar los nombres desde el principio.
                  - strong [ref=e298]: Images 2.6
                  - text: es el nombre del lanzamiento; en la API aparecen dos modelos.
                  - link [ref=e299] [cursor=pointer]:
