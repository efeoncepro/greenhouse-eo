                - paragraph [ref=e472]: "La documentación oficial añade este ejemplo de un personaje con una linterna. Sirve para mirar un loop con una tarea concreta: seguir el gesto, observar qué partes del personaje permanecen y revisar la transición entre el final y el principio."
                - figure [ref=e474]:
                  - link [ref=e475] [cursor=pointer]:
                    - /url: https://efeoncepro.com/wp-content/uploads/2026/11/glitch-images-2-6-monkey-lantern-gpt-image-2-6-sunburst.gif
