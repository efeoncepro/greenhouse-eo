                  - generic [ref=e509]:
                    - text: OpenAI muestra la traducción al español de una infografía conservando su estructura visual. El texto igual necesita revisión.
                    - 'link "Crédito: OpenAI — ejemplo oficial de GPT Image 2.6 Sunburst." [ref=e510] [cursor=pointer]':
                      - /url: https://developers.openai.com/api/docs/guides/image-prompting
                - paragraph [ref=e511]: En una infografía, revisa cada etiqueta y el vínculo entre el texto y la pieza que pretende explicar. Luego reduce la imagen al ancho de un teléfono. La información tiene que seguir siendo comprensible ahí. Una demostración de texto dentro de una imagen tampoco verifica que las afirmaciones técnicas del diagrama sean correctas.
                - figure [ref=e513]:
