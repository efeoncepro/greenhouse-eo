                    - /url: https://efeoncepro.com/wp-content/uploads/2026/11/glitch-images-2-6-billboard-winter-gpt-image-2-6-sunburst.webp
                    - img "Cartel publicitario de un champú en una escena invernal." [ref=e515]
                  - generic [ref=e516]:
                    - text: "Una nueva condición sobre una imagen anterior: el mismo concepto de producto convertido en una escena invernal."
                    - 'link "Crédito: OpenAI — ejemplo oficial de GPT Image 2.6 Sunburst." [ref=e517] [cursor=pointer]':
                      - /url: https://developers.openai.com/api/docs/guides/image-prompting
                - paragraph [ref=e518]: En una escena publicitaria, observa el producto, la escala y lo que ocurre alrededor del envase. Una imagen puede resultar convincente como conjunto y contener un detalle incompatible con el producto real. Esa diferencia importa mucho si la pieza se va a usar para venderlo.
