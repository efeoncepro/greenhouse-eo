                - 'heading "Calidad y complejidad: dos decisiones distintas" [level=2] [ref=e451]'
                - paragraph [ref=e452]: "El nuevo control de complejidad merece una pausa porque invita a un error conocido: subir todos los parámetros y esperar que eso resuelva el brief."
