                  - generic [ref=e477]:
                    - text: "GIF oficial de Sunburst: nueve fotogramas y un bucle de 1,8 segundos. La novedad se entiende mejor viéndola."
                    - 'link "Crédito: OpenAI — ejemplo oficial de GPT Image 2.6 Sunburst." [ref=e478] [cursor=pointer]':
                      - /url: https://developers.openai.com/api/docs/guides/image-prompting
                - paragraph [ref=e479]: "Un GIF puede resolver una reacción, una señal de estado o el pequeño gesto de una mascota. La pregunta creativa viene antes del movimiento: ¿qué debe comunicar ese gesto que una imagen fija no comunica igual? Si no hay respuesta, probablemente sólo estamos agregando actividad a la pieza."
                - paragraph [ref=e480]: Para una marca, revisaría especialmente que el personaje siga siendo reconocible en cada cuadro y que el loop tenga una vuelta natural. Una deformación apenas perceptible en una reproducción puede volverse evidente después de verla repetirse diez veces. También importan el peso del archivo, el tamaño de visualización y el formato que acepte el canal.
                - paragraph [ref=e481]: Esto no convierte a los modelos en un sistema de producción audiovisual completo. Un GIF no trae por sí solo sonido, montaje ni control narrativo de una secuencia larga. Si el destino requiere MP4, habrá otra etapa de preparación. Y si se usa en una interfaz, hay que decidir cuándo se mueve, cuándo se detiene y cómo se comporta para quien prefiere menos animación.
