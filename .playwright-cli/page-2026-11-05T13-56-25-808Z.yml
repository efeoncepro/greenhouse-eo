                - paragraph [ref=e327]:
                  - text: El
                  - link [ref=e328] [cursor=pointer]:
                    - /url: https://help.openai.com/en/articles/11084440-images-in-chatgpt
                    - strong [ref=e329]: Centro de Ayuda de OpenAI
                  - text: "aclara una distinción importante: Images está disponible en todos los planes, pero las funciones no tienen necesariamente el mismo despliegue. La creación de GIF sigue llegando a ChatGPT. Images con thinking está disponible en Plus, Pro y Business; Enterprise y Edu figuran como próximos. Antes de prometer un flujo a tu equipo, comprueba la cuenta que lo va a ejecutar."
                - paragraph [ref=e330]:
                  - text: También hay continuidad.
                  - link [ref=e331] [cursor=pointer]:
                    - /url: https://openai.com/index/introducing-chatgpt-images-2-5/
                    - strong [ref=e332]: Images 2.5, presentado el 8 de septiembre
                  - text: ", ya trabajaba la fidelidad, los bocetos y la consistencia durante varias ediciones. La historia de 2.6 no empieza desde cero: suma posibilidades sobre una dirección que OpenAI ya venía desarrollando."
                - heading "La velocidad sirve cuando puedes seguir pensando" [level=2] [ref=e333]
                - paragraph [ref=e334]:
                  - text: En su
                  - link [ref=e335] [cursor=pointer]:
                    - /url: https://openai.com/index/introducing-images-2-6/
                    - strong [ref=e336]: anuncio oficial
                  - text: ", OpenAI declara que Images 2.6 genera imágenes"
                  - strong [ref=e337]: un 50 % más rápido
                  - text: y que Flare puede entregar resultados
                  - strong [ref=e338]: desde seis segundos cuando la calidad está en low
                  - text: . Es una afirmación del proveedor bajo esas condiciones. No equivale a un tiempo garantizado para cualquier escena ni permite calcular cuánto tardará una campaña completa.
                - link "Ver comparación oficial (8×)" [ref=e341] [cursor=pointer]:
                  - /url: https://player.vimeo.com/video/1243362697?h=7809127775
                - paragraph [ref=e342]:
                  - text: "Comparación de latencia con anuncio de viajes. Reproducida a 8×: no interpretar como velocidad en tiempo real."
                  - 'link "Fuente: OpenAI." [ref=e343] [cursor=pointer]':
                    - /url: https://openai.com/index/introducing-images-2-6/
                - paragraph [ref=e344]:
                  - text: La comparación oficial de velocidad está reproducida a
                  - strong [ref=e345]: 8×
                  - text: ", según la descripción del anuncio. Sirve para observar la secuencia comparada; no para cronometrar una generación como si estuviéramos viendo tiempo real."
                - paragraph [ref=e346]: La velocidad puede cambiar la conversación creativa. Si una alternativa llega mientras el equipo todavía tiene presente la decisión que estaba discutiendo, es más fácil comparar una luz, un encuadre o una intención. Si llega mucho después, alguien tiene que reconstruir el contexto antes de opinar. Reducir esa espera tiene valor, aunque la pieza final tarde más.
                - paragraph [ref=e347]: "Ahora bien, producir alternativas más rápido también puede llenar la mesa de versiones que nadie tiene tiempo de revisar. Una exploración necesita una pregunta: decidir entre una escena íntima y una abierta, probar dos jerarquías o encontrar un fondo que permita leer el titular. Pedir veinte opciones sin saber qué estamos comparando sólo acelera la indecisión."
                - complementary "Glitch" [ref=e348]:
                  - paragraph [aria-hidden] [ref=e349]: Glitch
                  - generic [ref=e350]: Si duplicas las alternativas, alguien tendrá que elegir entre ellas.La velocidad necesita un criterio de descarte para convertirse en capacidad de producción.
                - paragraph [ref=e351]: Por eso separaría dos mediciones. Una registra cuánto demora el modelo en devolver una imagen. La otra registra cuánto demora el equipo en aceptar una dirección y llegar a un archivo utilizable. El lanzamiento habla directamente de la primera; el trabajo de cada organización tendrá que demostrar qué pasa con la segunda.
                - heading "Editar sin volver a negociar toda la imagen" [level=2] [ref=e352]
                - paragraph [ref=e353]: Imagina una pieza de producto que ya tiene aprobado el encuadre. Falta cambiar el color de un elemento secundario. El pedido parece sencillo, pero el resultado sólo sirve si la forma del envase, las proporciones y el resto de la escena siguen siendo los que aprobaste.
                - paragraph [ref=e354]:
                  - text: La edición por anotaciones ayuda a expresar dónde está el cambio. El
                  - link [ref=e355] [cursor=pointer]:
                    - /url: https://developers.openai.com/api/docs/changelog
                    - strong [ref=e356]: changelog de la API del 4 de noviembre
                  - text: confirma el soporte de image markup para los modelos compatibles 2.5 y 2.6. La
                  - link [ref=e357] [cursor=pointer]:
                    - /url: https://developers.openai.com/api/reference/resources/images/methods/edit
                    - strong [ref=e358]: referencia de edición
                  - text: describe una capa PNG transparente, del mismo tamaño que la primera imagen, sobre la cual se dibujan las indicaciones.
                - figure [ref=e360]:
                  - link [ref=e361] [cursor=pointer]:
                    - /url: https://efeoncepro.com/wp-content/uploads/2026/11/glitch-images-2-6-markup-vase-input-gpt-image-2-6.webp
                    - img "Cocina con un círculo rojo sobre el florero que se pide editar." [ref=e362]
                  - generic [ref=e363]:
                    - text: "La imagen original con una anotación que señala el jarrón: el punto de partida de la edición guiada."
                    - 'link "Crédito: OpenAI — imagen de entrada y anotación de su guía oficial." [ref=e364] [cursor=pointer]':
                      - /url: https://developers.openai.com/api/docs/guides/image-prompting
                - figure [ref=e366]:
                  - link [ref=e367] [cursor=pointer]:
                    - /url: https://efeoncepro.com/wp-content/uploads/2026/11/glitch-images-2-6-markup-vase-gpt-image-2-6-sunburst.webp
                    - img "La misma cocina con el florero azul y sin la anotación roja." [ref=e368]
                  - generic [ref=e369]:
                    - text: "El resultado de Sunburst: jarrón azul cobalto y círculo eliminado. Ejemplo publicado por OpenAI; no es una prueba realizada por Efeonce."
                    - 'link "Crédito: OpenAI — ejemplo oficial de GPT Image 2.6 Sunburst." [ref=e370] [cursor=pointer]':
                      - /url: https://developers.openai.com/api/docs/guides/image-prompting
                - paragraph [ref=e371]:
                  - text: En el ejemplo de la
                  - link [ref=e372] [cursor=pointer]:
                    - /url: https://developers.openai.com/api/docs/guides/image-prompting
                    - strong [ref=e373]: guía de prompts de OpenAI
                  - text: ", una marca roja identifica un florero y la salida lo muestra azul. Mira también la mesa, las sillas y los objetos cercanos. La utilidad de una corrección localizada se juega tanto en el objeto que cambia como en todo aquello que debía quedarse quieto."
                - paragraph [ref=e374]: "Una demostración seleccionada no nos dice qué porcentaje de intentos conserva bien una escena. Sí permite formular una prueba mejor que «haz algo parecido»: partir de la misma imagen, pedir una modificación delimitada y revisar una lista explícita de elementos que deben permanecer. Después repetir el ejercicio con una segunda corrección. Ahí empieza a aparecer la diferencia entre una imagen atractiva y un proceso confiable."
                - complementary "Glitch" [ref=e375]:
                  - paragraph [aria-hidden] [ref=e376]: Glitch
                  - generic [ref=e377]: Una corrección pequeña debería tener un perímetro pequeño de revisión.Si cambiar un florero obliga a revisar de nuevo toda la cocina, todavía hay trabajo que el equipo está absorbiendo.
                - paragraph [ref=e378]: Para una marca, ese perímetro puede incluir la geometría de un producto, un personaje, el vestuario, una textura o el espacio reservado para el copy. Escríbelo antes de generar. Si la condición sólo existe en la cabeza de quien aprueba, cada nueva versión vuelve a abrir la misma conversación.
                - 'heading "Lo pusimos a prueba: dos escenas y dos correcciones" [level=2] [ref=e379]'
                - paragraph [ref=e380]:
                  - text: "Hasta aquí, las demostraciones del lanzamiento. También quisimos llevar la pregunta de este Flash a una prueba propia:"
                  - strong [ref=e381]: ¿qué pasa cuando una imagen tiene que soportar una segunda corrección?
