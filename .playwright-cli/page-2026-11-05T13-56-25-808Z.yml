                - paragraph [ref=e555]: No son precios fijos por imagen. El total depende del consumo de la operación. Tampoco describen la suscripción de ChatGPT. Y la tarifa por token, incluso cuando coincide con la de otro modelo, no prueba que producir la misma pieza vaya a costar lo mismo.
                - paragraph [ref=e556]: "Para decidir en producción, agregaría otra cuenta. Cuántos resultados se descartan, cuántas correcciones requiere el elegido y cuánto tiempo humano consume llegar al archivo aprobado. No hace falta una planilla sofisticada para comenzar: registra la tarea, los intentos, el consumo que devuelve la API y los minutos de revisión."
                - complementary "Glitch" [ref=e557]:
                  - paragraph [aria-hidden] [ref=e558]: Glitch
                  - generic [ref=e559]: El costo de una pieza se conoce cuando termina la revisión.Un archivo barato que vuelve tres veces a corrección todavía tiene trabajo por pagar.
                - paragraph [ref=e560]: Esto permite discutir una elección con contexto. Un modelo puede justificar un mayor consumo si evita trabajo posterior; otro puede resultar más conveniente para explorar direcciones que todavía no necesitan detalle. Esas son hipótesis para medir con tareas comparables. Una tabla de tarifas no elige por ti.
                - heading "Lo que falta comprobar antes de incorporarlo a una campaña" [level=2] [ref=e561]
                - paragraph [ref=e562]:
                  - text: La documentación conserva límites sobre consistencia, texto y composiciones complejas. Además, la
                  - link [ref=e563] [cursor=pointer]:
                    - /url: https://deploymentsafety.openai.com/chatgpt-images-2-6
                    - strong [ref=e564]: system card de Images 2.6
                  - text: describe evaluaciones y mitigaciones de seguridad, incluidas las relacionadas con GIF. Esas evaluaciones sirven para entender el tratamiento del riesgo; no certifican la calidad creativa de una pieza ni reemplazan su revisión editorial.
                - paragraph [ref=e565]: Para una campaña, añadiría preguntas que la galería del lanzamiento no puede responder por nosotros. ¿El mismo personaje se sostiene en una serie? ¿La etiqueta conserva sus proporciones después de varias correcciones? ¿Una adaptación deja espacio para el texto que realmente debe llevar? ¿El equipo puede continuar una versión sin depender de quien la generó?
                - paragraph [ref=e566]: También conviene distinguir entre un error del modelo y una decisión que nunca se especificó. Si el equipo no definió cuánto puede cambiar un producto o qué rasgos identifican a un personaje, la revisión termina usando criterios que aparecen después del resultado. Eso vuelve difícil aprender de los intentos y comparar herramientas.
                - paragraph [ref=e567]: No daría por resuelta una comparación con otros generadores a partir de este anuncio. Para elegir entre modelos necesitamos el mismo encargo, referencias equivalentes y condiciones de evaluación claras. Los ejemplos destacados por un proveedor son un punto de partida para investigar, no una clasificación independiente.
                - heading "Cómo probarlo con una tarea real" [level=2] [ref=e568]
                - paragraph [ref=e569]: "Para llevar esta evaluación a tu equipo, elige una tarea recurrente y acotada: una imagen de producto que necesite dos correcciones y una adaptación. Usa material autorizado y deja por escrito lo que debe permanecer. Empieza por entender el comportamiento del flujo antes de extenderlo a una tanda completa."
                - list [ref=e570]:
                  - listitem [ref=e571]:
                    - strong [ref=e572]: Fija el punto de partida.
                    - text: Guarda referencias, formato, textos exactos y elementos que no pueden cambiar. Separa preferencias de condiciones obligatorias.
                  - listitem [ref=e573]:
                    - strong [ref=e574]: Haz una comparación controlada.
                    - text: Entrega el mismo encargo a los modelos que quieras evaluar. Registra los parámetros y conserva también los resultados rechazados.
                  - listitem [ref=e575]:
                    - strong [ref=e576]: Pide correcciones concretas.
                    - text: Cambia un elemento y después otro. Revisa si lo ya aprobado se conserva; no juzgues sólo la primera salida.
                  - listitem [ref=e577]:
                    - strong [ref=e578]: Mira el archivo en su destino.
                    - text: Prueba la lectura en móvil, la edición del vector o la reproducción del loop según corresponda. Evalúa el uso real.
                  - listitem [ref=e579]:
