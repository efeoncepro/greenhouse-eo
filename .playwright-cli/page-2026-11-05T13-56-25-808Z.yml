                  - text: recomienda probar complejidad baja para muchas ediciones y reservar niveles mayores para solicitudes con más elementos o restricciones.
                - paragraph [ref=e458]: Pensemos en dos pedidos hipotéticos. En uno cambias el color de una taza. En el otro compones una mesa con varias personas, productos identificables, un gesto particular y espacio para un titular. Los dos pueden necesitar una imagen final cuidada, pero el problema de relaciones entre elementos es muy distinto.
                - paragraph [ref=e459]: Esa separación abre una forma más precisa de experimentar. Mantén la calidad que exige el uso final y cambia la complejidad para observar si mejora el cumplimiento del pedido. Después compara el tiempo y las alteraciones que introduce. El ajuste útil será el que resuelva ese trabajo con menos fricción; no hay una combinación universal para todas las marcas, escenas y correcciones.
                - paragraph [ref=e460]: En un flujo compartido, registra también la configuración. Una persona del equipo debería poder entender cómo se obtuvo una versión aceptada sin reconstruir una tarde completa de pruebas. El prompt ayuda, pero una captura aislada del prompt no guarda por sí sola las referencias, las decisiones y los parámetros que hicieron funcionar el resultado.
