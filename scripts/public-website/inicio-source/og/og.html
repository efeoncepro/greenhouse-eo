<!doctype html><html lang="es"><head><meta charset="utf-8">

<style>
/* Social image of the Home (rediseño 2026-10-28). 1200×630. Center-safe: the lens and the signature survive the square
   crop of chat apps and the 2:1 crop of X; the side copy completes the wide card. Render: Playwright 1200×630 screenshot (landing reference «Home»). */
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#001a33}
.c{position:relative;width:1200px;height:630px;font-family:'Poppins',sans-serif;color:#fff;overflow:hidden;background:radial-gradient(60% 75% at 82% 8%,rgba(54,200,191,.16),transparent 70%),radial-gradient(55% 60% at 50% 110%,rgba(3,117,219,.22),transparent 70%),#001a33}
.lens{position:absolute;left:50%;top:44px;width:470px;height:470px;margin-left:-235px}
.halo{position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(closest-side,rgba(54,200,191,.16),rgba(54,200,191,.04) 60%,transparent)}
.inner{position:absolute;inset:6%;border-radius:50%;overflow:hidden;background:radial-gradient(120% 90% at 50% 100%,#1f6f86 0%,#023c70 38%,#001a33 78%)}
.inner img{position:absolute;left:50%;bottom:-3%;height:106%;transform:translateX(-50%)}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring{fill:none;stroke:#fff;stroke-opacity:.28;stroke-width:1.4}
.arc{fill:none;stroke:#36c8bf;stroke-width:2.8;stroke-linecap:round}
.sph{fill:#36c8bf}
.glow{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(54,200,191,.65),transparent);left:30.72%;top:4.59%}
.l{position:absolute;left:64px;top:196px;width:310px}
.chip{display:inline-block;padding:6px 13px;border:1px solid rgba(255,255,255,.3);border-radius:999px;font-size:13px;color:rgba(255,255,255,.8)}
.q{font-weight:300;font-size:34px;line-height:1.15;margin:0 0 12px}
.a{font-family:'Bricolage Grotesque',sans-serif;font-weight:760;font-size:92px;line-height:.9;letter-spacing:-.04em}
.d{color:#36c8bf}
.r{position:absolute;right:64px;top:160px;width:290px;text-align:right;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:44px;line-height:1.16;letter-spacing:-.03em}
.r span{display:block}
.r i{font-style:normal}
.sig{position:absolute;left:50%;bottom:30px;width:170px;transform:translateX(-50%)}
</style></head><body><div class="c">
<div class="lens"><div class="halo"></div><div class="inner"><img src="hero-cast.webp" alt=""></div>
<svg viewBox="0 0 600 600"><circle class="ring" cx="300" cy="300" r="296"/><path class="arc" d="M16.93 213.46 A296 296 0 0 1 184.34 27.53"/><circle class="sph" cx="184.34" cy="27.53" r="7"/></svg><span class="glow"></span></div>
<div class="l"><div class="q">¿Qué necesita tu marketing?</div><div class="a">Crecer<span class="d">.</span></div></div>

</div></body></html>
