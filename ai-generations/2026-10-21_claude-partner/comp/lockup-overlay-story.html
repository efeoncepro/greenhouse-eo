<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}#c{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Poppins}#eb{position:absolute;left:0;top:1250px;width:1080px;text-align:center;font-weight:600;font-size:22px;letter-spacing:.14em;color:#cfe4fa;opacity:0}
#lk{position:absolute;left:0;top:1296px;width:1080px;height:98px;display:flex;align-items:center;justify-content:center;gap:40px;opacity:0}
#row{position:absolute;left:0;top:1428px;width:1080px;display:flex;justify-content:center;align-items:center;gap:34px;font-weight:500;font-size:24px;letter-spacing:.02em;color:#b4c6da;opacity:0}#row span{display:flex;align-items:center;gap:12px}#row img{height:30px}
.logo{position:relative;display:block}.logo img{display:block}.shine{position:absolute;inset:0;-webkit-mask-size:100% 100%;-webkit-mask-repeat:no-repeat;background:linear-gradient(105deg,transparent 0%,transparent 42%,rgba(255,236,224,.95) 50%,transparent 58%,transparent 100%);background-size:300% 100%;background-position:120% 0;opacity:0}#glow{position:absolute;left:90px;top:1240px;width:900px;height:220px;background:radial-gradient(ellipse at center,rgba(255,214,196,.42) 0%,rgba(255,214,196,0) 68%);opacity:0}</style></head><body><div id="c"><div id="glow"></div><div id="eb">AHORA SOMOS PARTNERS</div>
<div id="lk"><span class="logo"><img src="file:///Users/jreye/Documents/greenhouse-eo/ai-generations/2026-10-21_claude-partner/comp/efeonce.svg" style="width:392px;height:92px"><span class="shine" style="-webkit-mask-image:url(file:///Users/jreye/Documents/greenhouse-eo/ai-generations/2026-10-21_claude-partner/comp/efeonce.svg)"></span></span><span style="width:2px;height:88px;background:rgba(207,228,250,.45)"></span><span class="logo"><img src="file:///Users/jreye/Documents/greenhouse-eo/ai-generations/2026-10-21_claude-partner/comp/claude-blanco.svg" style="width:362px;height:78px"><span class="shine" style="-webkit-mask-image:url(file:///Users/jreye/Documents/greenhouse-eo/ai-generations/2026-10-21_claude-partner/comp/claude-blanco.svg)"></span></span></div>

</div>
<script>
const T_SIGN=3.95,clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),easeOut=t=>1-Math.pow(1-t,3)
window.setT=function(t){const h=t-T_SIGN,tl=clamp(h/0.3),lk=document.getElementById('lk')
 lk.style.opacity=clamp(tl*1.8);lk.style.transform='scale('+(1.15-0.15*easeOut(tl))+')'
 const te=clamp((h-0.25)/0.27),tr=clamp((h-0.4)/0.27)
 for(const [id,v] of [['eb',te],['row',tr]]){const e=document.getElementById(id);e.style.opacity=v;e.style.transform='translateY('+8*(1-easeOut(v))+'px)'};const sp=clamp((h-0.28)/0.55);for(const e of document.querySelectorAll('.shine')){e.style.opacity=(sp>0&&sp<1)?1:0;e.style.backgroundPosition=(120-140*easeOut(sp))+'% 0'};const g=document.getElementById('glow');g.style.opacity=h<0.3?clamp(h/0.3)*0.9:Math.max(0,0.9-(h-0.3)/0.9)}
setT(0)</script></body></html>
