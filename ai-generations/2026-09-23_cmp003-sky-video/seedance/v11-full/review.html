<!doctype html><html lang="es"><meta charset="utf-8"><title>SKY V11 · revisión de imagen</title><style>body{margin:0;background:#131720;color:#eee;font:16px system-ui;display:flex;gap:28px;padding:20px}video{height:calc(100vh - 40px);max-width:60vw}aside{max-width:430px}button,input{font:inherit;padding:8px;margin:4px}small{display:block;color:#bbc5d5;line-height:1.5}</style><video id="v" src="sky-v11-fal-native.mp4" controls muted preload="auto"></video><aside><h1>SKY V11</h1><p>Revisión de imagen · sin audio</p><p><output id="t">Cargando</output></p><button id="play">Reproducir / pausar</button><button id="speed">Velocidad 1× / 0,5×</button><p><label>Segundo <input id="seek" type="number" min="0" max="30" step="0.0416667" value="0"></label><button id="go">Ir</button></p><button id="back">−1 cuadro</button><button id="next">+1 cuadro</button><p><button id="native">Fuente generada</button><button id="composite">Con cartelas</button></p><small>0–1,8 búsqueda lateral; 1,8–3,8 resultados; 3,8–4,4 turno; 4,4–8,4 respuesta/cita; 8,4–10 puente; 10–15,75 vuelo; 15,75–26 cielo; 26–30 cierre. Verificar tiempos reales: estos son objetivos del prompt.</small></aside><script>const v=document.querySelector('#v'),t=document.querySelector('#t');function update(){t.textContent=v.currentTime.toFixed(3)+' s · cuadro '+Math.floor(v.currentTime*24)+' · '+v.playbackRate+'×';requestAnimationFrame(update)}update();document.querySelector('#play').onclick=()=>v.paused?v.play():v.pause();document.querySelector('#speed').onclick=()=>v.playbackRate=v.playbackRate===1?.5:1;document.querySelector('#go').onclick=()=>{v.pause();v.currentTime=+document.querySelector('#seek').value};for(const [id,d]of [['back',-1],['next',1]])document.querySelector('#'+id).onclick=()=>{v.pause();v.currentTime=Math.max(0,v.currentTime+d/24)};document.querySelector('#native').onclick=()=>v.src='sky-v11-fal-native.mp4';document.querySelector('#composite').onclick=()=>v.src='sky-v11-picture-cartelas.mp4';</script></html>
