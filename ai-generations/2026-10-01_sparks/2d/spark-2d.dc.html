<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0375db","options":["#0375db","#36c8bf","#ff6500","#e86bd0"]},"expr":{"editor":"enum","default":"feliz","options":["feliz","atento","trabajando","sorprendido","pensando","listo"]},"accessory":{"editor":"enum","default":"ninguno","options":["ninguno","lupa","tarjeta","fichas","burbuja","grafico"]},"outline":{"editor":"enum","default":"no","options":["no","si"]},"arms":{"editor":"enum","default":"no","options":["no","si"]},"detail":{"editor":"enum","default":"auto","options":["auto","completo","simple"]},"size":{"editor":"int","default":400,"min":24,"max":1600,"unit":"px"},"$preview":{"width":400,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const accent = p.accent || '#0375db';
    const expr = p.expr || 'feliz';
    const acc = p.accessory || 'ninguno';
    const outline = p.outline === 'si' || p.outline === true;
    const size = parseInt(p.size, 10) || 400;
    const show = (k, v) => (k === v ? 'inline' : 'none');
    const d = {};
    ['feliz', 'atento', 'trabajando', 'sorprendido', 'pensando', 'listo'].forEach((e) => { d[e] = show(e, expr); });
    const a = {};
    ['lupa', 'tarjeta', 'fichas', 'burbuja', 'grafico'].forEach((x) => { a[x] = show(x, acc); });
    const sw = outline ? 5 : 0;
    const showArms = p.arms === 'si' || p.arms === true ? 'inline' : 'none';
    const detail = p.detail || 'auto';
    const simple = detail === 'simple' || (detail === 'auto' && size <= 72);
    return { accent, px: size + 'px', d, a, sw, showArms, full: simple ? 'none' : 'inline', ringOuter: simple ? 32 : 26, ringInner: simple ? 22 : 16 };
  }
}
</script>
