<text x="88" y="808" fill="#173044" font-family="Poppins,Arial,sans-serif" font-size="16" font-weight="500" >el vacío permite que el trabajo respire.</text>


<rect x="572" y="244" width="455" height="590" rx="22" fill="#FFFFFF" stroke="none"/>
<text x="600" y="296" fill="#0375DB" font-family="Poppins,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">02 / B</text>
<text x="600" y="337" fill="#023C70" font-family="Poppins,Arial,sans-serif" font-size="28" font-weight="700" >Punto de encuentro</text>
<text x="600" y="365" fill="#667987" font-family="Poppins,Arial,sans-serif" font-size="15" font-weight="400" >Dos recorridos crean un foco común.</text>
