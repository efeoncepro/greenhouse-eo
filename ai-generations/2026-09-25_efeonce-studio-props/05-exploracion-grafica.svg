<text x="60" y="65" fill="#A7CBE4" font-family="Poppins,Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="3">EFEONCE  /  EXPLORACIÓN DE LENGUAJE</text>
<text x="60" y="130" fill="#FFFFFF" font-family="Poppins,Arial,sans-serif" font-size="48" font-weight="700" >Del círculo al sistema</text>
