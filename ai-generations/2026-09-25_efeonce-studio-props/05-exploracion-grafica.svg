<text x="88" y="296" fill="#0375DB" font-family="Poppins,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">01 / A</text>
<text x="88" y="337" fill="#023C70" font-family="Poppins,Arial,sans-serif" font-size="28" font-weight="700" >Trayectoria abierta</text>
<text x="88" y="365" fill="#667987" font-family="Poppins,Arial,sans-serif" font-size="15" font-weight="400" >El recorrido estructura la composición.</text>
