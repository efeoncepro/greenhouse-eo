<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}#c{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:Poppins}
#eb{position:absolute;left:0;width:1080px;text-align:center;font-weight:600;font-size:30px;letter-spacing:.16em;color:#ffe3bf;opacity:0}
#lk{position:absolute;left:0;width:1080px;height:104px;display:flex;align-items:center;justify-content:center;gap:44px;opacity:0}
#row{position:absolute;left:0;width:1080px;display:flex;justify-content:center;align-items:center;gap:34px;font-weight:500;font-size:24px;letter-spacing:.02em;color:#d3d9e1;opacity:0}#row span{display:flex;align-items:center;gap:12px}#row img{height:38px;border-radius:4px}
.logo{position:relative;display:block}.logo img{display:block}.shine{position:absolute;inset:0;-webkit-mask-size:100% 100%;-webkit-mask-repeat:no-repeat;background:linear-gradient(105deg,transparent 0%,transparent 42%,rgba(255,236,205,.95) 50%,transparent 58%,transparent 100%);background-size:300% 100%;background-position:120% 0;opacity:0}
#glow{position:absolute;left:90px;width:900px;height:240px;background:radial-gradient(ellipse at center,rgba(255,153,0,.34) 0%,rgba(255,153,0,0) 68%);opacity:0}</style></head><body><div id="c"><div id="glow"></div><div id="eb">AHORA SOMOS PARTNERS</div>
<div id="lk"><span class="logo"><img src="efeonce.svg" style="width:392px;height:92px"><span class="shine" style="-webkit-mask-image:url(efeonce.svg)"></span></span><span style="width:2px;height:92px;background:rgba(255,227,191,.45)"></span><span class="logo"><img src="aws-oscuro.svg" style="width:177px;height:104px"><span class="shine" style="-webkit-mask-image:url(aws-oscuro.svg)"></span></span></div>
<div id="row"><span><img src="icons/Arch_Amazon-EC2_64.svg">Amazon EC2</span><span><img src="icons/Arch_Amazon-Simple-Storage-Service_64.svg">Amazon S3</span><span><img src="icons/Arch_Amazon-Bedrock_64.svg">Amazon Bedrock</span></div>
</div>
<script>
const H=+(new URLSearchParams(location.search).get('h')||1350)
const Y=H===1350?{eb:1002,lk:1056,row:1198,gl:986}:{eb:1222,lk:1278,row:1420,gl:1206}
document.getElementById('c').style.height=H+'px'
for(const k of ['eb','lk','row'])document.getElementById(k).style.top=Y[k]+'px';document.getElementById('glow').style.top=Y.gl+'px'
const T_SIGN=4.65,clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),easeOut=t=>1-Math.pow(1-t,3)
window.setT=function(t){const h=t-T_SIGN,tl=clamp(h/0.5),lk=document.getElementById('lk')
 lk.style.opacity=clamp(h/0.35);lk.style.transform='scale('+(1.10-0.10*easeOut(tl))+')'
 const te=clamp((h-0.35)/0.4),tr=clamp((h-0.6)/0.4)
 for(const [id,v] of [['eb',te],['row',tr]]){const e=document.getElementById(id);e.style.opacity=v;e.style.transform='translateY('+10*(1-easeOut(v))+'px)'}
 const sp=clamp((h-0.45)/0.6);for(const e of document.querySelectorAll('.shine')){e.style.opacity=(sp>0&&sp<1)?1:0;e.style.backgroundPosition=(120-140*easeOut(sp))+'% 0'}
 const g=document.getElementById('glow');g.style.opacity=h<0.5?clamp(h/0.5)*0.9:Math.max(0,0.9-(h-0.5)/1.0)}
setT(0)</script></body></html>
