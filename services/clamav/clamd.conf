# TASK-1378 — Configuración de clamd para el scanner de assets de Greenhouse.
#
# Sólo INSTREAM por socket local: el shim HTTP es el único cliente. clamd NUNCA
# escucha en TCP — la superficie de red del contenedor es el puerto de Cloud Run
# y nada más.

LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
User clamav

# `Foreground yes` + `clamd &` en el entrypoint es deliberado: queremos que el
# proceso quede como hijo del shell (logs a stdout, capturados por Cloud
# Logging) en vez de que clamd se auto-daemonice y pierda la salida.
Foreground yes
LogTime yes

# Sin LogVerbose: el contenido escaneado es el CV de una persona real
# (PII, Ley 21.719) y no tiene por qué aparecer en los logs.
LogVerbose no

# Techo del stream. Alineado con CLAMAV_MAX_BYTES del shim (32 MiB); el upload
# público limita el CV muy por debajo de esto.
StreamMaxLength 32M
MaxScanSize 100M
MaxFileSize 32M

# Defensa contra bombas de descompresión dentro de un archivo que sí es válido.
MaxRecursion 12
MaxFiles 5000

# Heurística de PDF/documentos: es exactamente la cobertura que el escáner
# `structural` no puede dar (firmas dentro de un PDF estructuralmente válido).
ScanPDF yes
ScanArchive yes
ScanOLE2 yes
ScanHTML yes
AlertBrokenExecutables yes
