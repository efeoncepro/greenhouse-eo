# TASK-1378 — Actualización de la base de firmas.
#
# Corre como daemon DENTRO del contenedor, no como Cloud Scheduler: la base vive
# en el filesystem de la instancia, así que quien la mantiene fresca tiene que
# ser el propio contenedor. Con `min-instances=1` siempre hay una instancia viva
# que la actualiza.

DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net

# 12 chequeos al día ≈ cada 2 h. ClamAV publica varias veces al día y el umbral
# de vejez del shim es 168 h (7 d), así que queda margen amplio.
Checks 12

# Igual que clamd: foreground + `&` en el entrypoint, para que la salida quede
# en stdout y la recoja Cloud Logging.
Foreground yes
LogTime yes

ConnectTimeout 30
ReceiveTimeout 300
