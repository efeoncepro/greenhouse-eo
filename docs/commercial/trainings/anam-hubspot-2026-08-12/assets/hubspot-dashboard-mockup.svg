<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mockup conceptual de backlog, metas y calidad del dato</title>
  <desc id="desc">Panel conceptual que separa backlog comercial, metas y calidad del dato, declarando universo, fuente y estado.</desc>
  <defs><style>.ui{font-family:Arial,Helvetica,sans-serif;fill:#213343}.muted{fill:#6b7c93}.tiny{font-size:13px}.small{font-size:16px}.body{font-size:18px}.label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.heading{font-size:29px;font-weight:700}.card{fill:#fff;stroke:#dfe6ee;stroke-width:1}.line{stroke:#dfe6ee;stroke-width:1}.nav{fill:#192733}.nav-text{fill:#b6c7d6}.orange{fill:#ff7a59}.teal{fill:#00a4bd}.green{fill:#2eaf7d}.purple{fill:#7256c8}</style></defs>
  <rect width="1600" height="900" fill="#f5f8fa"/><rect width="1600" height="6" fill="#7256c8"/><rect y="6" width="1600" height="76" fill="#fff"/><image href="data:image/svg+xml;base64," x="28" y="17" width="188" height="54" preserveAspectRatio="xMinYMid meet"/><text x="280" y="51" class="ui small">CRM</text><text x="355" y="51" class="ui small">Sales</text><text x="430" y="51" class="ui small">Service</text><text x="520" y="51" class="ui small" font-weight="700">Reporting</text><circle cx="1490" cy="44" r="18" fill="#eaf0f6"/><text x="1484" y="50" class="ui small" font-weight="700">A</text>
  <rect y="82" width="230" height="818" class="nav"/><text x="30" y="126" fill="#b6c7d6" class="label">Reporting</text><rect x="18" y="148" width="194" height="44" rx="8" fill="#33475b"/><circle cx="42" cy="170" r="9" fill="#7256c8"/><text x="62" y="176" class="ui nav-text small" fill="#fff">Dashboards</text><text x="62" y="226" class="ui nav-text small">Reportes</text><text x="62" y="276" class="ui nav-text small">Objetivos</text><text x="62" y="326" class="ui nav-text small">Exportar</text><line x1="28" y1="374" x2="202" y2="374" stroke="#40566b"/><text x="30" y="415" fill="#b6c7d6" class="label">Vistas</text><text x="62" y="460" class="ui nav-text small">Crecimiento</text><text x="62" y="510" class="ui nav-text small">Backlog comercial</text><text x="62" y="560" class="ui nav-text small">Fidelización</text>
  <g transform="translate(276 118)" class="ui"><text x="0" y="0" class="heading">Backlog, metas y calidad del dato</text><text x="0" y="35" class="body muted">Cada panel responde una decisión distinta y declara su universo.</text><rect x="0" y="72" width="1220" height="50" class="card" rx="8"/><text x="24" y="104" class="small" font-weight="700">Período: ejemplo guiado</text><text x="300" y="104" class="small muted">Universo: backlog comercial</text><text x="590" y="104" class="small muted">Fuente: Deals + Goals</text><rect x="990" y="82" width="200" height="30" rx="15" fill="#f0edfb"/><text x="1022" y="102" class="tiny purple" font-weight="700">PILOTO · panel conceptual</text>
    <g transform="translate(0 148)"><rect width="280" height="142" class="card" rx="10"/><text x="22" y="34" class="label muted">Backlog comercial</text><text x="22" y="86" class="small" font-size="27" font-weight="700">Growth + Renewal</text><text x="22" y="119" class="tiny muted">universo declarado</text></g><g transform="translate(305 148)"><rect width="280" height="142" class="card" rx="10"/><text x="22" y="34" class="label muted">Metas 2026</text><text x="22" y="82" class="small" font-size="24" font-weight="700">Revenue · emails · meetings</text><text x="22" y="119" class="tiny muted">Growth-only</text></g><g transform="translate(610 148)"><rect width="280" height="142" class="card" rx="10"/><text x="22" y="34" class="label muted">Calidad del dato</text><text x="22" y="82" class="small" font-size="27" font-weight="700">Deal sin Company</text><text x="22" y="119" class="tiny muted">cola operativa</text></g><g transform="translate(915 148)"><rect width="305" height="142" class="card" rx="10"/><text x="22" y="34" class="label muted">Estado del dato</text><text x="22" y="88" class="small" font-size="25" font-weight="700">Validación live</text><rect x="22" y="104" width="132" height="24" rx="12" fill="#fff7e5"/><text x="42" y="121" class="tiny" fill="#d98a00" font-weight="700">No publicar aún</text></g>
    <g transform="translate(0 322)"><rect width="760" height="384" class="card" rx="10"/><text x="24" y="40" class="heading" font-size="23">Preguntas de control</text><text x="24" y="68" class="small muted">Leer antes de presentar un número.</text><rect x="24" y="94" width="712" height="56" rx="8" fill="#f5f8fa"/><circle cx="46" cy="122" r="7" fill="#ff7a59"/><text x="68" y="119" class="small" font-weight="700">Backlog Comercial</text><text x="68" y="140" class="tiny muted">¿Qué Deals abiertos requieren acción?</text><rect x="24" y="160" width="712" height="56" rx="8" fill="#f5f8fa"/><circle cx="46" cy="188" r="7" fill="#7256c8"/><text x="68" y="185" class="small" font-weight="700">Goals</text><text x="68" y="206" class="tiny muted">¿Qué mide cada meta y para quién?</text><rect x="24" y="226" width="712" height="56" rx="8" fill="#f5f8fa"/><circle cx="46" cy="254" r="7" fill="#00a4bd"/><text x="68" y="251" class="small" font-weight="700">Data Quality</text><text x="68" y="272" class="tiny muted">¿Qué asociación falta y quién la corrige?</text><rect x="24" y="292" width="712" height="56" rx="8" fill="#f5f8fa"/><circle cx="46" cy="320" r="7" fill="#2eaf7d"/><text x="68" y="317" class="small" font-weight="700">Fuente y período</text><text x="68" y="338" class="tiny muted">¿El dato está operativo, piloto o no publicado?</text><text x="24" y="370" class="tiny muted">Sin fuente, período y denominador declarados, no interpretes el número.</text></g>
    <g transform="translate(790 322)"><rect width="430" height="384" class="card" rx="10"/><text x="24" y="40" class="heading" font-size="23">Reglas de lectura</text><circle cx="38" cy="88" r="8" fill="#2eaf7d"/><text x="58" y="94" class="small" font-weight="700">Operativo / documentado</text><text x="58" y="113" class="tiny muted">Fuente y definición disponibles.</text><circle cx="38" cy="148" r="8" fill="#7256c8"/><text x="58" y="154" class="small" font-weight="700">Piloto</text><text x="58" y="173" class="tiny muted">Útil para probar, no para cerrar.</text><circle cx="38" cy="208" r="8" fill="#ff7a59"/><text x="58" y="214" class="small" font-weight="700">Validación live</text><text x="58" y="233" class="tiny muted">Requiere licencia, permisos y fecha.</text><circle cx="38" cy="268" r="8" fill="#d98a00"/><text x="58" y="274" class="small" font-weight="700">No publicado</text><text x="58" y="293" class="tiny muted">No enseñar como capacidad operativa.</text><rect x="24" y="312" width="382" height="52" rx="8" fill="#fff1ed"/><text x="42" y="335" class="tiny orange" font-weight="700">Disciplina del dato</text><text x="42" y="355" class="small">Growth + Renewal no es revenue.</text></g>
  </g><rect x="276" y="846" width="1220" height="34" rx="17" fill="#edf1f5"/><circle cx="298" cy="863" r="5" fill="#7256c8"/><text x="314" y="868" class="ui tiny muted">PILOTO · datos ilustrativos · no es un dashboard oficial ni una métrica financiera actual de ANAM</text>
</svg>
