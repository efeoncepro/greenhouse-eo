<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mockup conceptual de Customer Success y servicios</title>
  <desc id="desc">Vista conceptual de cuentas, servicios, riesgo y próxima acción con estados de validación.</desc>
  <defs><style>.ui{font-family:Arial,Helvetica,sans-serif;fill:#213343}.muted{fill:#6b7c93}.tiny{font-size:13px}.small{font-size:16px}.body{font-size:18px}.label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.heading{font-size:29px;font-weight:700}.card{fill:#fff;stroke:#dfe6ee;stroke-width:1}.line{stroke:#dfe6ee;stroke-width:1}.nav{fill:#192733}.nav-text{fill:#b6c7d6}.orange{fill:#ff7a59}.teal{fill:#00a4bd}.green{fill:#2eaf7d}.amber{fill:#d98a00}.purple{fill:#7256c8}</style></defs>
  <rect width="1600" height="900" fill="#f5f8fa"/><rect width="1600" height="6" fill="#00a4bd"/><rect y="6" width="1600" height="76" fill="#fff"/><image href="data:image/svg+xml;base64," x="28" y="17" width="188" height="54" preserveAspectRatio="xMinYMid meet"/><text x="280" y="51" class="ui small">CRM</text><text x="355" y="51" class="ui small">Sales</text><text x="430" y="51" class="ui small" font-weight="700">Service</text><text x="520" y="51" class="ui small">Automation</text><text x="650" y="51" class="ui small">Reporting</text><circle cx="1490" cy="44" r="18" fill="#eaf0f6"/><text x="1484" y="50" class="ui small" font-weight="700">A</text>
  <rect y="82" width="230" height="818" class="nav"/><text x="30" y="126" fill="#b6c7d6" class="label">Service</text><rect x="18" y="148" width="194" height="44" rx="8" fill="#33475b"/><circle cx="42" cy="170" r="9" fill="#00a4bd"/><text x="62" y="176" class="ui nav-text small" fill="#fff">Cuentas</text><text x="62" y="226" class="ui nav-text small">Tickets</text><text x="62" y="276" class="ui nav-text small">Servicios</text><text x="62" y="326" class="ui nav-text small">Señales</text><line x1="28" y1="374" x2="202" y2="374" stroke="#40566b"/><text x="30" y="415" fill="#b6c7d6" class="label">Atajos</text><text x="62" y="460" class="ui nav-text small">Renovaciones</text><text x="62" y="510" class="ui nav-text small">Escalaciones</text><text x="62" y="560" class="ui nav-text small">Reportes</text>
  <g transform="translate(276 118)" class="ui"><text x="0" y="0" class="heading">Customer Success · cuentas y servicios</text><text x="0" y="35" class="body muted">Una vista para detectar riesgo, renovación y expansión con contexto.</text><rect x="0" y="72" width="1220" height="54" class="card" rx="8"/><text x="24" y="106" class="small" font-weight="700">Todas las cuentas</text><text x="180" y="106" class="small muted">Riesgo</text><text x="280" y="106" class="small muted">Renovación</text><text x="405" y="106" class="small muted">Servicios</text><rect x="1010" y="82" width="184" height="34" rx="17" fill="#e7f7fa"/><text x="1040" y="104" class="tiny" fill="#00a4bd" font-weight="700">PILOTO · configuración</text>
    <rect x="0" y="154" width="720" height="552" class="card" rx="10"/><text x="24" y="194" class="heading" font-size="23">Cuentas que requieren atención</text><text x="24" y="223" class="small muted">La cuenta conecta empresa, servicio, ticket y negocio.</text><line x1="24" y1="248" x2="696" y2="248" class="line"/><text x="24" y="278" class="label muted">Cuenta</text><text x="300" y="278" class="label muted">Estado</text><text x="430" y="278" class="label muted">Próxima acción</text>
    <text x="24" y="322" class="body" font-weight="700">Cuenta de ejemplo ANAM</text><text x="24" y="347" class="small muted">Servicio activo · renovación próxima</text><rect x="300" y="304" width="94" height="28" rx="14" fill="#fff7e5"/><text x="320" y="323" class="tiny amber" font-weight="700">Atención</text><text x="430" y="322" class="small">Confirmar uso y fecha</text><line x1="24" y1="374" x2="696" y2="374" class="line"/>
    <text x="24" y="422" class="body" font-weight="700">Cuenta de ejemplo B</text><text x="24" y="447" class="small muted">Ticket abierto · calidad</text><rect x="300" y="404" width="94" height="28" rx="14" fill="#f0edfb"/><text x="320" y="423" class="tiny purple" font-weight="700">Riesgo</text><text x="430" y="422" class="small">Derivar con contexto</text><line x1="24" y1="474" x2="696" y2="474" class="line"/>
    <text x="24" y="522" class="body" font-weight="700">Cuenta de ejemplo C</text><text x="24" y="547" class="small muted">Servicio sin alertas</text><rect x="300" y="504" width="94" height="28" rx="14" fill="#e9f8f1"/><text x="320" y="523" class="tiny green" font-weight="700">Estable</text><text x="430" y="522" class="small">Explorar expansión</text><line x1="24" y1="574" x2="696" y2="574" class="line"/>
    <text x="24" y="626" class="tiny muted">Datos de ejemplo · no equivale a un health score oficial.</text>
    <g transform="translate(750 154)"><rect width="470" height="552" class="card" rx="10"/><text x="24" y="40" class="label muted">Ficha de cuenta</text><text x="24" y="80" class="heading" font-size="24">Cuenta de ejemplo ANAM</text><text x="24" y="108" class="small muted">Empresa asociada · servicios · negocios</text><rect x="24" y="134" width="422" height="78" rx="8" fill="#f5f8fa"/><text x="42" y="161" class="label muted">Servicio principal</text><text x="42" y="190" class="small" font-weight="700">Servicio activo · revisión de renovación</text><text x="24" y="254" class="label muted">Señales a revisar</text><circle cx="38" cy="286" r="8" fill="#ff7a59"/><text x="58" y="292" class="small">Fecha de renovación</text><circle cx="38" cy="326" r="8" fill="#00a4bd"/><text x="58" y="332" class="small">Uso / satisfacción</text><circle cx="38" cy="366" r="8" fill="#2eaf7d"/><text x="58" y="372" class="small">Contacto responsable</text><rect x="24" y="412" width="422" height="74" rx="8" fill="#fff1ed"/><text x="42" y="440" class="label orange">Paso siguiente</text><text x="42" y="467" class="small" font-weight="700">Confirmar reunión y registrar resultado</text><rect x="24" y="506" width="162" height="28" rx="14" fill="#fff7e5"/><text x="44" y="525" class="tiny amber" font-weight="700">Revisión humana</text></g>
  </g><rect x="276" y="846" width="1220" height="34" rx="17" fill="#edf1f5"/><circle cx="298" cy="863" r="5" fill="#00a4bd"/><text x="314" y="868" class="ui tiny muted">VISTA CONCEPTUAL DE ENTRENAMIENTO · datos ilustrativos · Customer Success depende de licencia y configuración</text>
</svg>
