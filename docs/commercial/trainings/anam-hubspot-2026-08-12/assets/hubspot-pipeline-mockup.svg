<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mockup conceptual de pipelines comerciales y de fidelización</title>
  <desc id="desc">Tablero conceptual con etapas de nuevo negocio y renovación, datos ilustrativos y estados de revisión.</desc>
  <defs>
