    <rect x="18" y="574" width="1184" height="108" rx="8" fill="#fff" stroke="#dfe6ee"/><text x="34" y="600" class="label muted">Fidelización / renovación</text><text x="34" y="630" class="small" font-weight="700">Por revisar → Elegibilidad confirmada → Contacto iniciado → Propuesta en negociación → Renovado</text><text x="34" y="658" class="tiny muted">Salidas: No renovado · No aplica / Desestimado · cada etapa abierta requiere Paso siguiente.</text>
