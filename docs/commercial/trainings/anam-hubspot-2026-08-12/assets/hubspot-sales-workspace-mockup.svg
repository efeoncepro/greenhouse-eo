<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mockup conceptual del Sales Workspace de HubSpot para capacitación ANAM</title>
  <desc id="desc">Interfaz de capacitación con navegación de HubSpot, tareas del día, prioridades comerciales y una oportunidad de renovación con próximo paso.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#192733" flood-opacity=".18"/>
    </filter>
    <linearGradient id="topGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#ff9f8a"/>
    </linearGradient>
    <style>
      .ui{font-family:Arial,Helvetica,sans-serif;fill:#213343}
      .muted{fill:#6b7c93}
      .tiny{font-size:13px}
      .small{font-size:16px}
      .body{font-size:18px}
      .label{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
      .heading{font-size:28px;font-weight:700}
      .card{fill:#fff;stroke:#dfe6ee;stroke-width:1}
      .line{stroke:#dfe6ee;stroke-width:1}
      .orange{fill:#ff7a59}
      .teal{fill:#00a4bd}
      .green{fill:#2eaf7d}
      .nav{fill:#192733}
      .nav-text{fill:#b6c7d6}
      .nav-active-text{fill:#fff}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f5f8fa"/>
  <rect width="1600" height="6" fill="url(#topGlow)"/>

  <!-- Conceptual navigation; official HubSpot wordmark asset, used at native proportions. -->
  <rect y="6" width="1600" height="76" fill="#fff"/>
  <image href="data:image/svg+xml;base64," x="28" y="17" width="188" height="54" preserveAspectRatio="xMinYMid meet"/>
  <text x="248" y="51" class="ui small">CRM</text>
  <text x="320" y="51" class="ui small">Marketing</text>
  <text x="442" y="51" class="ui small" font-weight="700">Sales</text>
  <text x="500" y="51" class="ui small">Service</text>
  <text x="582" y="51" class="ui small">Automation</text>
  <text x="710" y="51" class="ui small">Reporting</text>
  <rect x="1310" y="25" width="148" height="38" rx="19" fill="#f5f8fa"/>
  <text x="1332" y="49" class="ui small muted">Buscar</text>
  <circle cx="1485" cy="44" r="18" fill="#eaf0f6"/>
  <text x="1479" y="50" class="ui small" font-weight="700">A</text>

  <!-- Left navigation -->
  <rect y="82" width="230" height="818" class="nav"/>
  <text x="30" y="126" fill="#b6c7d6" class="label">Sales workspace</text>
  <rect x="18" y="148" width="194" height="44" rx="8" fill="#33475b"/>
  <circle cx="42" cy="170" r="9" fill="#ff7a59"/>
  <text x="62" y="176" class="ui nav-active-text small">Resumen</text>
  <text x="62" y="226" class="ui nav-text small">Prospectos</text>
  <text x="62" y="276" class="ui nav-text small">Negocios</text>
  <text x="62" y="326" class="ui nav-text small">Tareas</text>
  <text x="62" y="376" class="ui nav-text small">Agenda</text>
  <text x="62" y="426" class="ui nav-text small">Dashboards</text>
  <line x1="28" y1="474" x2="202" y2="474" stroke="#40566b"/>
  <text x="30" y="515" fill="#b6c7d6" class="label">Atajos</text>
  <text x="62" y="560" class="ui nav-text small">Crear negocio</text>
  <text x="62" y="610" class="ui nav-text small">Registrar actividad</text>
  <text x="62" y="660" class="ui nav-text small">Abrir bandeja</text>

  <!-- Main workspace -->
  <g transform="translate(276 118)" class="ui">
    <text x="0" y="0" class="heading">Sales workspace</text>
    <text x="0" y="35" class="body muted">Una vista para decidir qué hacer hoy y dejar trazabilidad.</text>
    <rect x="1084" y="-28" width="152" height="44" rx="8" fill="#ff7a59"/>
    <text x="1112" y="0" fill="#fff" class="small" font-weight="700">Crear negocio</text>

    <rect x="0" y="72" width="1220" height="52" class="card" rx="8"/>
    <text x="24" y="105" class="small" font-weight="700">Resumen</text>
    <text x="130" y="105" class="small muted">Prospectos</text>
    <text x="250" y="105" class="small muted">Negocios</text>
    <text x="355" y="105" class="small muted">Tareas</text>
    <text x="440" y="105" class="small muted">Agenda</text>
    <text x="530" y="105" class="small muted">Dashboards</text>
    <line x1="20" y1="122" x2="85" y2="122" stroke="#ff7a59" stroke-width="3"/>

    <!-- KPI cards -->
    <g transform="translate(0 150)">
      <rect width="386" height="134" class="card" rx="10" filter="url(#shadow)"/>
      <text x="24" y="32" class="label muted">Tareas de hoy</text>
      <text x="24" y="82" font-size="40" font-weight="700">07</text>
      <text x="114" y="80" class="small muted">2 vencidas · 5 pendientes</text>
      <circle cx="338" cy="66" r="24" fill="#fff1ed"/>
      <path d="M326 66l8 8 16-20" fill="none" stroke="#ff7a59" stroke-width="5"/>
    </g>
    <g transform="translate(417 150)">
      <rect width="386" height="134" class="card" rx="10" filter="url(#shadow)"/>
      <text x="24" y="32" class="label muted">Próximos pasos</text>
      <text x="24" y="82" font-size="40" font-weight="700">04</text>
      <text x="114" y="80" class="small muted">con responsable y fecha</text>
      <circle cx="338" cy="66" r="24" fill="#e7f7fa"/>
      <path d="M326 66h24M338 54v24" stroke="#00a4bd" stroke-width="5"/>
    </g>
    <g transform="translate(834 150)">
      <rect width="386" height="134" class="card" rx="10" filter="url(#shadow)"/>
      <text x="24" y="32" class="label muted">Revisiones prioritarias</text>
      <text x="24" y="82" font-size="40" font-weight="700">03</text>
      <text x="114" y="80" class="small muted">renovaciones próximas</text>
      <circle cx="338" cy="66" r="24" fill="#e9f8f1"/>
      <path d="M326 70h24M326 60h24" stroke="#2eaf7d" stroke-width="5"/>
    </g>

    <!-- Opportunity list -->
    <g transform="translate(0 314)">
      <rect width="803" height="392" class="card" rx="10"/>
      <text x="24" y="38" class="heading" font-size="23">Oportunidades que requieren acción</text>
      <text x="24" y="67" class="small muted">La etapa no está completa hasta dejar un siguiente paso verificable.</text>
      <line x1="24" y1="90" x2="779" y2="90" class="line"/>
      <text x="24" y="120" class="label muted">Negocio</text>
      <text x="310" y="120" class="label muted">Etapa</text>
      <text x="486" y="120" class="label muted">Paso siguiente</text>
      <text x="705" y="120" class="label muted">Fecha</text>
      <line x1="24" y1="138" x2="779" y2="138" class="line"/>

      <text x="24" y="176" class="body" font-weight="700">Renovación de servicio</text>
      <text x="24" y="201" class="small muted">Cuenta de ejemplo ANAM</text>
      <rect x="310" y="158" width="144" height="30" rx="15" fill="#fff1ed"/>
      <text x="330" y="179" class="tiny orange" font-weight="700">Contacto iniciado</text>
      <text x="486" y="176" class="small">Confirmar reunión</text>
      <text x="486" y="201" class="tiny muted">responsable + resultado</text>
      <text x="705" y="186" class="small" font-weight="700">12 ago</text>
      <line x1="24" y1="228" x2="779" y2="228" class="line"/>

      <text x="24" y="266" class="body" font-weight="700">Nueva oportunidad</text>
      <text x="24" y="291" class="small muted">Cuenta de ejemplo B</text>
      <rect x="310" y="248" width="144" height="30" rx="15" fill="#e7f7fa"/>
      <text x="331" y="269" class="tiny teal" font-weight="700">Elegibilidad</text>
      <text x="486" y="266" class="small">Validar alcance</text>
      <text x="486" y="291" class="tiny muted">campo obligatorio pendiente</text>
      <text x="705" y="276" class="small" font-weight="700">14 ago</text>
      <line x1="24" y1="318" x2="779" y2="318" class="line"/>

      <text x="24" y="356" class="body" font-weight="700">Expansión de cuenta</text>
      <text x="24" y="381" class="small muted">Cuenta de ejemplo C</text>
      <rect x="310" y="338" width="144" height="30" rx="15" fill="#e9f8f1"/>
      <text x="329" y="359" class="tiny green" font-weight="700">Propuesta</text>
      <text x="486" y="356" class="small">Enviar resumen</text>
      <text x="486" y="381" class="tiny muted">con contexto de la cuenta</text>
      <text x="705" y="366" class="small" font-weight="700">18 ago</text>
    </g>

    <!-- Right detail rail -->
    <g transform="translate(834 314)">
      <rect width="386" height="392" class="card" rx="10"/>
      <text x="24" y="38" class="label muted">Vista de trabajo</text>
      <text x="24" y="78" class="heading" font-size="22">Renovación de servicio</text>
      <text x="24" y="106" class="small muted">Cuenta de ejemplo ANAM</text>
      <rect x="24" y="132" width="338" height="48" rx="8" fill="#f5f8fa"/>
      <text x="40" y="153" class="tiny muted">Paso siguiente</text>
      <text x="40" y="172" class="small" font-weight="700">Confirmar reunión y registrar resultado</text>
      <text x="24" y="219" class="label muted">Checklist</text>
      <circle cx="36" cy="248" r="9" fill="#2eaf7d"/>
      <path d="M31 248l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/>
      <text x="58" y="254" class="small">Empresa asociada</text>
      <circle cx="36" cy="286" r="9" fill="#2eaf7d"/>
      <path d="M31 286l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/>
      <text x="58" y="292" class="small">Etapa actualizada</text>
      <circle cx="36" cy="324" r="9" fill="#ff7a59"/>
      <text x="58" y="330" class="small">Fecha y responsable</text>
      <rect x="24" y="350" width="160" height="30" rx="15" fill="#fff1ed"/>
      <text x="44" y="370" class="tiny orange" font-weight="700">Revisión humana</text>
    </g>
  </g>

  <!-- Honest status label -->
  <rect x="276" y="846" width="1220" height="34" rx="17" fill="#edf1f5"/>
  <circle cx="298" cy="863" r="5" fill="#ff7a59"/>
  <text x="314" y="868" class="ui tiny muted">VISTA CONCEPTUAL DE ENTRENAMIENTO · datos ilustrativos · no corresponde a una captura del portal de ANAM</text>
</svg>
