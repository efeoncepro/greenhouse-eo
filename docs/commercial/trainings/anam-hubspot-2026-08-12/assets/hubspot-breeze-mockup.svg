<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mockup conceptual de Breeze y revisión humana</title>
  <desc id="desc">Registro conceptual con panel de IA que resume una cuenta y redacta un borrador de seguimiento sin ejecutar acciones.</desc>
  <defs><style>.ui{font-family:Arial,Helvetica,sans-serif;fill:#213343}.muted{fill:#6b7c93}.tiny{font-size:13px}.small{font-size:16px}.body{font-size:18px}.label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.heading{font-size:29px;font-weight:700}.card{fill:#fff;stroke:#dfe6ee;stroke-width:1}.line{stroke:#dfe6ee;stroke-width:1}.nav{fill:#192733}.nav-text{fill:#b6c7d6}.orange{fill:#ff7a59}.teal{fill:#00a4bd}.green{fill:#2eaf7d}.purple{fill:#7256c8}</style></defs>
  <rect width="1600" height="900" fill="#f5f8fa"/><rect width="1600" height="6" fill="#7256c8"/><rect y="6" width="1600" height="76" fill="#fff"/><image href="data:image/svg+xml;base64," x="28" y="17" width="188" height="54" preserveAspectRatio="xMinYMid meet"/><text x="280" y="51" class="ui small">CRM</text><text x="355" y="51" class="ui small">Sales</text><text x="430" y="51" class="ui small">Service</text><text x="520" y="51" class="ui small">Automation</text><circle cx="1490" cy="44" r="18" fill="#eaf0f6"/><text x="1484" y="50" class="ui small" font-weight="700">A</text>
  <rect y="82" width="230" height="818" class="nav"/><text x="30" y="126" fill="#b6c7d6" class="label">Intelligence</text><rect x="18" y="148" width="194" height="44" rx="8" fill="#33475b"/><circle cx="42" cy="170" r="9" fill="#7256c8"/><text x="62" y="176" class="ui nav-text small" fill="#fff">Breeze</text><text x="62" y="226" class="ui nav-text small">Registros</text><text x="62" y="276" class="ui nav-text small">Negocios</text><text x="62" y="326" class="ui nav-text small">Tickets</text><line x1="28" y1="374" x2="202" y2="374" stroke="#40566b"/><text x="30" y="415" fill="#b6c7d6" class="label">Guardrails</text><text x="62" y="460" class="ui nav-text small">Revisar antes de enviar</text><text x="62" y="510" class="ui nav-text small">No incluir datos sensibles</text>
  <g transform="translate(276 118)" class="ui"><text x="0" y="0" class="heading">Breeze prepara resumen y seguimiento</text><text x="0" y="35" class="body muted">La IA resume, redacta y acelera; la persona conserva el control.</text><rect x="0" y="72" width="790" height="634" class="card" rx="10"/><text x="24" y="112" class="label muted">Registro seleccionado</text><text x="24" y="152" class="heading" font-size="25">Renovación de servicio</text><text x="24" y="181" class="small muted">Cuenta de ejemplo ANAM · negocio comercial</text><line x1="24" y1="208" x2="766" y2="208" class="line"/><text x="24" y="246" class="label muted">Contexto visible</text><rect x="24" y="268" width="230" height="82" rx="8" fill="#f5f8fa"/><text x="42" y="296" class="tiny muted">Etapa</text><text x="42" y="326" class="small" font-weight="700">Contacto iniciado</text><rect x="272" y="268" width="230" height="82" rx="8" fill="#f5f8fa"/><text x="290" y="296" class="tiny muted">Próximo paso</text><text x="290" y="326" class="small" font-weight="700">Confirmar reunión</text><rect x="520" y="268" width="230" height="82" rx="8" fill="#f5f8fa"/><text x="538" y="296" class="tiny muted">Fecha</text><text x="538" y="326" class="small" font-weight="700">12 ago</text><text x="24" y="400" class="label muted">Actividad reciente</text><text x="24" y="432" class="small">Reunión pendiente de confirmación</text><text x="24" y="462" class="small">Renovación requiere revisar alcance</text><rect x="24" y="510" width="742" height="76" rx="8" fill="#f0edfb"/><text x="42" y="540" class="tiny purple" font-weight="700">PREGUNTA PARA BREEZE</text><text x="42" y="568" class="small">Resume el contexto y redacta un borrador breve de seguimiento.</text><rect x="24" y="612" width="172" height="34" rx="17" fill="#7256c8"/><text x="62" y="634" fill="#fff" class="small" font-weight="700">Consultar</text>
    <g transform="translate(820 72)"><rect width="400" height="634" rx="10" fill="#1f163a"/><circle cx="34" cy="38" r="12" fill="#ff7a59"/><text x="58" y="46" fill="#fff" class="small" font-weight="700">Breeze</text><rect x="24" y="74" width="352" height="74" rx="8" fill="#332753"/><text x="42" y="102" fill="#d9cef9" class="tiny">Resumen sugerido</text><text x="42" y="128" fill="#fff" class="small">La cuenta está en contacto iniciado.</text><text x="42" y="150" fill="#fff" class="small">Conviene confirmar reunión y alcance.</text><text x="24" y="202" fill="#a99bd1" class="label">Borrador de seguimiento</text><rect x="24" y="224" width="352" height="138" rx="8" fill="#2c2147"/><text x="42" y="254" fill="#fff" class="small" font-weight="700">Asunto: Confirmar reunión</text><text x="42" y="284" fill="#d9cef9" class="small">Mensaje: revisar alcance y fecha</text><text x="42" y="314" fill="#d9cef9" class="small">Acción: registrar resultado</text><text x="24" y="408" fill="#a99bd1" class="label">Antes de ejecutar</text><circle cx="40" cy="444" r="8" fill="#ff7a59"/><text x="60" y="450" fill="#fff" class="small">Verificar fuente y permisos</text><circle cx="40" cy="484" r="8" fill="#ff7a59"/><text x="60" y="490" fill="#fff" class="small">Editar lenguaje y destinatario</text><circle cx="40" cy="524" r="8" fill="#ff7a59"/><text x="60" y="530" fill="#fff" class="small">Confirmar antes de enviar</text><rect x="24" y="566" width="164" height="30" rx="15" fill="#ff7a59"/><text x="45" y="586" fill="#fff" class="tiny" font-weight="700">Revisión humana</text></g>
  </g><rect x="276" y="846" width="1220" height="34" rx="17" fill="#edf1f5"/><circle cx="298" cy="863" r="5" fill="#7256c8"/><text x="314" y="868" class="ui tiny muted">VISTA CONCEPTUAL · IA exploratoria / validación live pendiente · no ejecuta acciones en ANAM</text>
</svg>
