<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mockup conceptual de Meeting Notetaker y Smart Deal Progression</title>
  <desc id="desc">Registro conceptual con notas, acuerdos, tareas y sugerencias de progresión que requieren revisión humana.</desc>
  <defs><style>.ui{font-family:Arial,Helvetica,sans-serif;fill:#213343}.muted{fill:#6b7c93}.tiny{font-size:13px}.small{font-size:16px}.body{font-size:18px}.label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.heading{font-size:29px;font-weight:700}.card{fill:#fff;stroke:#dfe6ee;stroke-width:1}.line{stroke:#dfe6ee;stroke-width:1}.nav{fill:#192733}.nav-text{fill:#b6c7d6}.orange{fill:#ff7a59}.teal{fill:#00a4bd}.green{fill:#2eaf7d}.purple{fill:#7256c8}</style></defs>
  <rect width="1600" height="900" fill="#f5f8fa"/><rect width="1600" height="6" fill="#ff7a59"/><rect y="6" width="1600" height="76" fill="#fff"/><image href="data:image/svg+xml;base64," x="28" y="17" width="188" height="54" preserveAspectRatio="xMinYMid meet"/><text x="280" y="51" class="ui small">CRM</text><text x="355" y="51" class="ui small">Sales</text><text x="430" y="51" class="ui small">Service</text><text x="520" y="51" class="ui small" font-weight="700">Meetings</text><circle cx="1490" cy="44" r="18" fill="#eaf0f6"/><text x="1484" y="50" class="ui small" font-weight="700">A</text>
  <rect y="82" width="230" height="818" class="nav"/><text x="30" y="126" fill="#b6c7d6" class="label">Productivity</text><rect x="18" y="148" width="194" height="44" rx="8" fill="#33475b"/><circle cx="42" cy="170" r="9" fill="#ff7a59"/><text x="62" y="176" class="ui nav-text small" fill="#fff">Reuniones</text><text x="62" y="226" class="ui nav-text small">Notas</text><text x="62" y="276" class="ui nav-text small">Negocios</text><text x="62" y="326" class="ui nav-text small">Tareas</text><line x1="28" y1="374" x2="202" y2="374" stroke="#40566b"/><text x="30" y="415" fill="#b6c7d6" class="label">Automatización</text><text x="62" y="460" class="ui nav-text small">Progresión sugerida</text><text x="62" y="510" class="ui nav-text small">Revisión humana</text>
  <g transform="translate(276 118)" class="ui"><text x="0" y="0" class="heading">De una reunión a acciones verificables</text><text x="0" y="35" class="body muted">Las notas ayudan a no perder acuerdos; la persona decide qué se registra.</text><g transform="translate(0 72)"><rect width="580" height="634" class="card" rx="10"/><text x="24" y="42" class="label muted">Meeting Notetaker · vista conceptual</text><text x="24" y="82" class="heading" font-size="24">Revisión de renovación</text><text x="24" y="110" class="small muted">Cuenta de ejemplo ANAM · 12 ago · transcripción sujeta a permisos</text><line x1="24" y1="138" x2="556" y2="138" class="line"/><circle cx="38" cy="184" r="8" fill="#ff7a59"/><text x="60" y="190" class="small" font-weight="700">Acuerdo</text><text x="60" y="216" class="small">Revisar alcance del servicio.</text><circle cx="38" cy="270" r="8" fill="#00a4bd"/><text x="60" y="276" class="small" font-weight="700">Próximo paso</text><text x="60" y="302" class="small">Confirmar reunión con responsable.</text><circle cx="38" cy="356" r="8" fill="#2eaf7d"/><text x="60" y="362" class="small" font-weight="700">Riesgo</text><text x="60" y="388" class="small">Fecha de renovación por confirmar.</text><rect x="24" y="442" width="532" height="82" rx="8" fill="#f5f8fa"/><text x="42" y="472" class="label muted">Tareas extraídas</text><text x="42" y="500" class="small">• Confirmar reunión · owner pendiente</text><text x="42" y="524" class="small">• Actualizar etapa si aplica</text><rect x="24" y="556" width="156" height="30" rx="15" fill="#fff1ed"/><text x="44" y="576" class="tiny orange" font-weight="700">Revisión humana</text></g>
    <g transform="translate(610 72)"><rect width="610" height="634" class="card" rx="10"/><text x="24" y="42" class="label muted">Smart Deal Progression · sugerencia</text><text x="24" y="82" class="heading" font-size="24">¿Qué debería cambiar?</text><rect x="24" y="112" width="562" height="78" rx="8" fill="#f0edfb"/><text x="42" y="142" class="tiny purple" font-weight="700">PROPUESTA DE IA</text><text x="42" y="168" class="small">Mantener etapa hasta confirmar resultado.</text><text x="24" y="236" class="label muted">Cambios sugeridos</text><rect x="24" y="258" width="562" height="68" rx="8" fill="#f5f8fa"/><text x="42" y="286" class="small" font-weight="700">Etapa</text><text x="200" y="286" class="small">Contacto iniciado → sin cambio</text><rect x="24" y="342" width="562" height="68" rx="8" fill="#f5f8fa"/><text x="42" y="370" class="small" font-weight="700">Tarea</text><text x="200" y="370" class="small">Confirmar reunión · asignar owner</text><rect x="24" y="426" width="562" height="68" rx="8" fill="#f5f8fa"/><text x="42" y="454" class="small" font-weight="700">Correo</text><text x="200" y="454" class="small">Borrador pendiente de edición</text><rect x="24" y="540" width="156" height="34" rx="17" fill="#7256c8"/><text x="52" y="562" fill="#fff" class="small" font-weight="700">Revisar</text><rect x="196" y="540" width="156" height="34" rx="17" fill="#e9f8f1"/><text x="230" y="562" fill="#2eaf7d" class="small" font-weight="700">Confirmar</text><text x="24" y="608" class="tiny muted">Depende de calendario, grabación, transcripción, permisos y licencia.</text></g>
  </g><rect x="276" y="846" width="1220" height="34" rx="17" fill="#edf1f5"/><circle cx="298" cy="863" r="5" fill="#ff7a59"/><text x="314" y="868" class="ui tiny muted">VISTA CONCEPTUAL · propuesta de IA · revisión humana obligatoria · dependencias de licencia y permisos</text>
</svg>
