        - in: header
          name: x-greenhouse-purpose
          required: false
          schema: { type: string, enum: [talent_pool_candidate_review] }
        - in: header
          name: x-greenhouse-agent-host
          required: false
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,63}$' }
        - in: query
          name: query
          schema: { type: string }
        - in: query
          name: capability
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - in: query
          name: seniority
          schema: { type: string }
        - in: query
          name: language
          schema: { type: string }
        - in: query
          name: country
          schema: { type: string }
        - in: query
          name: availability
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Talent Pool search result
          content:
            application/json:
              schema:
                allOf:
