  <style>/*
 * Molde del catálogo deck-axis — ARTEFACTO COMPILADO, no convención (TASK-1393 Slice 3b-molde).
 *
 * "Un contrato que hay que re-implementar 25 veces no es un contrato: es una sugerencia" — el
 * lienzo (lo más invariante del sistema) estaba re-declarado 25/25. Desde este slice las
 * plantillas COMPONEN el molde: lo cargan después de deck-tokens.css y dejan de dibujarlo.
 *
 * Qué es del MOLDE (invariante del catálogo): lienzo · safe-area · escala de espaciado · escala de
 * blur del glass · el chrome de la firma (deck-signature.css, anclado a REGIÓN vía
 * data-url-bubble-backdrop — nunca a un píxel medido a mano).
 * Qué NO es del molde: átomos de contenido (stat, bullet, card) — un átomo se extrae sólo cuando
 * está duplicado ≥3 veces Y es idéntico; si hay que parametrizarlo, es una plantilla nueva y eso
 * lo decide el catálogo. Las primitivas del molde son detalle INTERNO: el Plan sigue eligiendo
 * UNA plantilla por nombre, nunca ensambla primitivas.
 */

:root {
  /* Lienzo 16:9 del deck. El canvas es dato del registry; estas vars lo materializan en CSS. */
  --deck-canvas-w: 1920px;
  --deck-canvas-h: 1080px;

  /* Safe-area editorial: el contenido nunca toca el borde (regla 3 del molde). */
  --deck-safe: 72px;

  /* Escala de espaciado medida del catálogo vigente (vocabulario del molde; múltiplos editoriales
     reales del deck, no una escala 4n inventada). */
  --deck-space-1: 8px;
  --deck-space-2: 14px;
  --deck-space-3: 20px;
  --deck-space-4: 28px;
  --deck-space-5: 36px;
  --deck-space-6: 42px;
  --deck-space-7: 56px;
  --deck-space-8: 72px;

  /* Escala de blur del glass (los 5 pasos medidos en las 9 superficies glass del catálogo). */
  --deck-blur-s: 14px;
  --deck-blur-m: 16px;
  --deck-blur-l: 18px;
  --deck-blur-xl: 20px;
  --deck-blur-2xl: 24px;
}

/* El documento ES el lienzo: sin scroll, sin sorpresa de layout. */
html,
body {
  width: var(--deck-canvas-w);
  height: var(--deck-canvas-h);
}

/*
 * El lienzo de lámina. `overflow:hidden` es parte del contrato: junto con `assertSlideFitsCanvas`
 * (que audita ANTES de imprimir), garantiza que nada sangra fuera del canvas sin que el geometry
 * gate lo haya visto. Una plantilla no re-declara esto: lo compone.
 */
.slide {
  position: relative;
  width: var(--deck-canvas-w);
  height: var(--deck-canvas-h);
  overflow: hidden;
}

/*
 * Enlaces en copy autorado (el sanitizador permite <a href="https://…"> desde 2026-07-14; Chromium
 * los imprime como anotaciones /Link y el merge las porta al PDF final). El color es SIEMPRE el del
 * texto que los rodea: el default UA (azul sobre panel navy) es ilegible y fuera de marca. El
 * subrayado es el único affordance — y en papel, la señal de que la URL existe.
 */
a {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 0.055em;
  text-underline-offset: 0.14em;
}
</style>
<style>/*
 * URL Bubble — primitive de firma del catálogo Tender Deck.
 *
 * Usa el SVG canónico `assets/url-lum.svg`, no una recreación CSS. La clase base define el
 * tratamiento óptico; `signature-<Template>` sólo decide placement y nunca puede sobrescribir
 * blend, opacidad ni asset.
 */
.deck-url-bubble {
  position:absolute;
  right:56px;
  bottom:36px;
  z-index:999;
  width:220px;
  height:auto;
  display:block;
  /* El SVG fuente se mantiene gris: `luminosity` lo adapta al fondo sin cambiar su color base. */
  opacity:.72;
  pointer-events:none;
  mix-blend-mode:luminosity;
}

/* Variante de flujo: la contraportada la integra a su stack de cierre. */
.deck-url-bubble--inline {
  position:relative;
  right:auto;
  bottom:auto;
  z-index:auto;
  width:270px;
  margin-top:10px;
}

/* La portada y contraportada ya contienen la burbuja canónica como asset semántico. */
[data-template='AgendaFull'] .r { display:none; }

/* Centro global: hay una banda negativa real bajo el contenido. No usar transform: rompería luminosity. */
.signature-AgendaFull,
.signature-CardGridFull {
  left:0;
  right:0;
  margin-inline:auto;
  bottom:36px;
}

/* Portada: banda negativa propia, centrada sin transform para no aislar el blend. */
.signature-CoverFull {
  right:0;
  left:0;
  margin-inline:auto;
  bottom:72px;
}

/* Centro local del panel oscuro que pinta el backdrop: nunca el canvas claro padre. */
.signature-BulletListSplit,
.signature-DualListSplit,
.signature-MetricsSplit,
.signature-StatSplit,
.signature-TeamSplit,
.signature-SectionDividerSplit {
  left:0;
  right:0;
  margin-inline:auto;
  bottom:36px;
}

/* QuoteSplit: el statement deja una banda de cierre centrada dentro del campo de marca derecho. */
.signature-QuoteSplit {
  left:0;
  right:0;
  margin-inline:auto;
  bottom:36px;
}

/* TeamGalleryFull: canvas navy completo; el padding inferior de la lámina reserva la banda. */
.signature-TeamGalleryFull {
  left:0;
  right:0;
  margin-inline:auto;
  bottom:36px;
}

/* La banda inferior está ocupada: firma lateral superior, antes del recorrido de lectura. */
.signature-DualTextSplit {
  top:48px;
  right:56px;
  bottom:auto;
}
.signature-EvidenceStoryGrid {
  top:54px;
  right:auto;
  bottom:auto;
  left:940px;
}

/* Estas superficies llevan contenido claro en el borde inferior o derecho. */
.signature-FourPillarsFull {
  top:440px;
  right:auto;
  left:850px;
  bottom:auto;
}
.signature-HumanImpactFull {
  top:60px;
  right:auto;
  left:850px;
  bottom:auto;
}
.signature-CredentialsFull {
  top:auto;
  right:auto;
  left:850px;
  bottom:28px;
}
.signature-ProcessStepsFull {
  right:auto;
  left:42px;
  bottom:30px;
}

/* La escalera ocupa la izquierda y la lectura la derecha: la firma se va al margen inferior
   derecho, bajo el readout, donde no compite con ningún peldaño ni con su score. */
.signature-MaturityLadderFull {
  right:56px;
  bottom:30px;
}

/* La matriz termina antes de la firma: la URL Bubble no puede leerse como una sexta fila. */
.signature-RequirementsTableFull {
  right:0;
  left:0;
  margin-inline:auto;
  bottom:36px;
}

/* La oferta económica cierra sobre el eje del canvas, no sobre las condiciones comerciales. */
.signature-PricingFull {
  right:0;
  left:0;
  margin-inline:auto;
  bottom:36px;
}

/* La anatomía abre un artefacto simétrico y ya concentra peso en el inspector derecho: la firma
   cierra sobre el eje del canvas, fuera del shell, sin competir con la capa técnica. */
.signature-ContentHubAnatomyFull {
  right:0;
  left:0;
  margin-inline:auto;
  bottom:28px;
}

/* El artefacto ocupa la derecha entera: la firma se va al margen inferior IZQUIERDO, bajo el texto,
   donde no se superpone a la captura ni se lee como parte del producto mostrado. */
.signature-ArtifactShowcaseFull {
  right:auto;
  left:132px;
  bottom:52px;
}
