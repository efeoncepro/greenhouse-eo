<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · super de dato</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `data-super` (audiovisual, papel data-super). La cifra en grande sobre la zona calma del plano y la
      órbita que la mide (arco de medida de AXIS, pintado en el builder como capa); la leyenda al lado. La fuente de
      la cifra se exige y no se pinta. Capa transparente. Referencia aprobada: «Escenas con texto · 04 super de dato».
    -->
    <main class="gl-layer gl-data-super" data-gl-root data-slot="frame">
      <figure class="gl-orbit" data-slot="orbit">
        <img data-slot-field="src" alt="" />
      </figure>

      <div data-slot="datum">
        <p class="gl-datum-value" data-slot-field="value">62%</p>
        <p class="gl-datum-caption" data-slot-field="caption">de los cortes se aprueban a la primera</p>
      </div>
    </main>
  </body>
</html>
