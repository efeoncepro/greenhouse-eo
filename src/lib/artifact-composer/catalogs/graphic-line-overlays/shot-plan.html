<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · plan de planos</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `shot-plan` (audiovisual, papel plan). La hoja del plan de planos, OPACA en papel claro: un cuadro clave
      por plano con su tiempo y su lente (de los tokens de la receta), la ficha y el registro, y debajo las reglas de
      producción de la superficie tal como las escribe AXIS. El último plano es el cierre: su cuadro es el último del
      reveal aprobado. Referencia aprobada: «Producción audiovisual · planos y reglas».
    -->
    <main class="gl-layer gl-sheet" data-gl-root data-slot="frame">
      <h1 class="gl-sheet-title" data-slot="title">Producción audiovisual · un video de 12,6 s «Cómo trabajamos», cuadros clave generados</h1>

      <ol class="gl-shots" data-slot="shots">
        <li class="gl-shot">
          <img class="gl-shot-frame" data-slot-field="src" alt="" />
          <p class="gl-shot-heading" data-slot-field="heading">01 · 0–3 s · Plano general</p>
          <p class="gl-shot-spec" data-slot-field="spec">Terreno, panadería del cliente · 35 mm</p>
          <p class="gl-shot-note" data-slot-field="note">Documental: nadie mira a cámara</p>
        </li>
      </ol>

      <ol class="gl-rules" data-slot="rules">
        <li class="gl-rule">El primer cuadro de cada plano es una foto que pasó el QA fijo.</li>
      </ol>
    </main>
  </body>
</html>
