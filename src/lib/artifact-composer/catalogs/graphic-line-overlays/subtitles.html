<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · subtítulos quemados</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `subtitles` (audiovisual, papel subtitles). Subtítulos quemados para redes: Poppins en el peso, tamaño e
      interlineado del token de AXIS, dos líneas como máximo, centrados en el tercio inferior, sin caja (sólo la
      sombra del token). Capa transparente, una por intervención. Referencia aprobada: «Escenas con texto · 06».
    -->
    <main class="gl-layer gl-subtitles-layer" data-gl-root data-slot="frame">
      <p class="gl-subtitles" data-slot="lines">
        <span class="gl-subtitle-line">«Ya no discutimos el gusto:</span>
      </p>
    </main>
  </body>
</html>
