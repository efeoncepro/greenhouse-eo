<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Marketing con Manzanitas · Contraportada A</title>
<link rel="stylesheet" href="deck-fonts.css" />
<link rel="stylesheet" href="manzanitas-tokens.css" />
<link rel="stylesheet" href="manzanitas.css" />
<style>
.mcm-back-cover .mcm-big-apple { left: 470px; top: -180px; width: calc(178.34px * var(--mcm-back-apple-scale)); }
.mcm-back-cover .mcm-masthead { left: 80px; top: 76px; width: 180px; height: 48px; }
.mcm-back-cover .mcm-voice { --mcm-answer-px: 190px; left: 80px; top: 650px; width: 920px; }
.mcm-back-cover .mcm-sub { margin-top: 24px; font-size: 30px; line-height: 1.4; white-space: nowrap; }
.mcm-back-cover .mcm-lockup { bottom: calc(100% - var(--mcm-close-block-ends-y)); }
</style>
</head>
<body>
<main class="mcm-canvas mcm-canvas--4x5 mcm-tone-navy mcm-line-engine mcm-back-cover" data-mcm-root data-slot="theme">
  <div class="mcm-bleed" aria-hidden="true"><img class="mcm-big-apple" data-mcm-apple src="assets/manzanitas-apple-navy-engine.svg" alt="" /></div>
  <img class="mcm-masthead" data-mcm-masthead src="assets/manzanitas-wordmark-negative.svg" alt="Marketing con Manzanitas" />
  <div class="mcm-voice" data-slot="voice">
    <p class="mcm-q"><span class="mcm-ring" aria-hidden="true"></span><span data-slot-field="question">¿La pregunta?</span></p>
    <p class="mcm-a"><span data-slot-field="answer">Respuesta</span><span class="mcm-sphere" aria-hidden="true"></span></p>
    <p class="mcm-sub" data-slot="sub">La bajada con <strong>lo importante</strong>.</p>
  </div>
  <div class="mcm-lockup">
    <img class="mcm-lockup__logo" data-mcm-signature src="assets/efeonce-logo-negative.svg" alt="Efeonce" />
    <p class="mcm-slogan" data-slot="slogan"><span class="mcm-slogan__lead">Empower </span><span class="mcm-slogan__your">your </span><span class="mcm-slogan__word" data-slot-field="word">Engine</span></p>
  </div>
</main>
</body>
</html>
