<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Marketing con Manzanitas · Portada Pizarra</title>
<link rel="stylesheet" href="deck-fonts.css" />
<link rel="stylesheet" href="manzanitas-tokens.css" />
<link rel="stylesheet" href="manzanitas.css" />
<style>
.mcm-cover-pizarra .mcm-big-apple { left: 520px; top: 24px; width: 704.44px; }
.mcm-cover-pizarra .mcm-masthead { left: 80px; top: 76px; width: 180px; height: 48px; }
.mcm-cover-pizarra .mcm-voice { --mcm-answer-px: 190px; --mcm-voice-left: 80px; left: 80px; top: 810px; width: 920px; }
</style>
</head>
<body>
<main class="mcm-canvas mcm-canvas--4x5 mcm-tone-navy mcm-line-engine mcm-cover-pizarra" data-mcm-root data-slot="theme">
  <div class="mcm-bleed" aria-hidden="true"><img class="mcm-big-apple" data-mcm-apple src="assets/manzanitas-apple-navy-engine.svg" alt="" /></div>
  <img class="mcm-masthead" data-mcm-masthead src="assets/manzanitas-wordmark-negative.svg" alt="Marketing con Manzanitas" />
  <div class="mcm-voice mcm-voice--beside-swipe" data-slot="voice">
    <p class="mcm-q"><span class="mcm-ring" aria-hidden="true"></span><span data-slot-field="question">¿La pregunta?</span></p>
    <p class="mcm-a"><span data-slot-field="answer">Respuesta</span><span class="mcm-sphere" aria-hidden="true"></span></p>
  </div>
  <img class="mcm-swipe mcm-swipe--cover" data-mcm-swipe src="assets/swipe-rest-navy-engine.svg" alt="Desliza" />
  <img class="mcm-signature mcm-signature--carousel" data-mcm-signature src="assets/efeonce-logo-negative.svg" alt="Efeonce" />
</main>
</body>
</html>
