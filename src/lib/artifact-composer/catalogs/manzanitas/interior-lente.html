<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Marketing con Manzanitas · Lente interior</title>
<link rel="stylesheet" href="deck-fonts.css" />
<link rel="stylesheet" href="manzanitas-tokens.css" />
<link rel="stylesheet" href="manzanitas.css" />
<style>
.mcm-interior-lente .mcm-masthead { left: 80px; top: 72px; width: 160px; height: 72px; }
.mcm-interior-lente .mcm-voice { --mcm-answer-px: 140px; --mcm-voice-left: 97.2px; left: 97.2px; top: 943.384px; width: 885.6px; }
</style>
</head>
<body>
<main class="mcm-canvas mcm-canvas--4x5 mcm-tone-navy mcm-line-engine mcm-interior-lente" data-mcm-root data-slot="theme">
  <div class="mcm-layer" data-slot="lens"><img data-slot-field="src" src="assets/manzanitas-apple-navy-engine.svg" alt="" /></div>
  <img class="mcm-masthead" data-mcm-masthead src="assets/manzanitas-logo-negative-engine.svg" alt="Marketing con Manzanitas" />
  <div class="mcm-voice mcm-voice--beside-swipe" data-slot="voice">
    <p class="mcm-q mcm-q--one-line"><span class="mcm-ring" aria-hidden="true"></span><span data-slot-field="question">¿La pregunta?</span></p>
    <p class="mcm-a"><span data-slot-field="answer">Respuesta</span></p>
  </div>
  <img class="mcm-swipe mcm-swipe--interior" data-mcm-swipe src="assets/swipe-rest-navy-engine.svg" alt="Desliza" />
  <img class="mcm-signature mcm-signature--carousel" data-mcm-signature src="assets/efeonce-logo-negative.svg" alt="Efeonce" />
</main>
</body>
</html>
