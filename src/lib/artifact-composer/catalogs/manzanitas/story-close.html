<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Marketing con Manzanitas · Story de cierre</title>
<link rel="stylesheet" href="deck-fonts.css" />
<link rel="stylesheet" href="manzanitas-tokens.css" />
<link rel="stylesheet" href="manzanitas.css" />
<style>
.mcm-story-close .mcm-masthead { left: 108px; top: 262px; width: 200px; height: 90px; }
.mcm-story-close .mcm-voice { --mcm-answer-px: 190px; left: 108px; top: 760px; width: 864px; }
.mcm-story-close .mcm-sub { margin-top: 24px; font-size: 30px; }
.mcm-story-close .mcm-lockup { top: 1392px; }
</style>
</head>
<body>
<main class="mcm-canvas mcm-canvas--9x16 mcm-tone-navy mcm-line-engine mcm-story-close" data-mcm-root data-slot="theme">
  <img class="mcm-masthead" data-mcm-masthead src="assets/manzanitas-logo-negative-engine.svg" alt="Marketing con Manzanitas" />
  <div class="mcm-voice" data-slot="voice">
    <p class="mcm-q"><span class="mcm-ring" aria-hidden="true"></span><span data-slot-field="question">¿La pregunta?</span></p>
    <p class="mcm-a"><span data-slot-field="answer">Respuesta</span><span class="mcm-sphere" aria-hidden="true"></span></p>
    <p class="mcm-sub" data-slot="sub">La bajada con <strong>lo importante</strong>.</p>
  </div>
  <div class="mcm-lockup">
    <img class="mcm-lockup__logo" data-mcm-signature src="assets/efeonce-logo-negative.svg" alt="Efeonce" />
    <p class="mcm-slogan" data-slot="slogan"><span class="mcm-slogan__lead">Empower </span><span class="mcm-slogan__your">your </span><span class="mcm-slogan__word" data-slot-field="word">Engine</span></p>
  </div>
</main>
</body>
</html>
