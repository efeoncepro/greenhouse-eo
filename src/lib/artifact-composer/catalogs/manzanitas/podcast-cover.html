<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Marketing con Manzanitas · Portada del pódcast</title>
<link rel="stylesheet" href="deck-fonts.css" />
<link rel="stylesheet" href="manzanitas-tokens.css" />
<link rel="stylesheet" href="manzanitas.css" />
<style>
.mcm-podcast .mcm-big-apple { left: 560px; top: 56px; width: 570.69px; }
.mcm-podcast .mcm-masthead { left: 80px; top: 72px; width: 420px; height: 112px; }
.mcm-podcast .mcm-episode { position: absolute; left: 80px; top: 214px; width: 440px; font-size: 24px; }
.mcm-podcast .mcm-voice { --mcm-answer-px: 140px; left: 80px; top: 698px; width: 920px; }
.mcm-podcast .mcm-signature { left: 432px; top: 932px; width: 216px; height: 51px; }
</style>
</head>
<body>
<main class="mcm-canvas mcm-canvas--1x1 mcm-tone-navy mcm-line-engine mcm-podcast" data-mcm-root data-slot="theme">
  <div class="mcm-bleed" aria-hidden="true"><img class="mcm-big-apple" data-mcm-apple src="assets/manzanitas-apple-navy-engine.svg" alt="" /></div>
  <img class="mcm-masthead" data-mcm-masthead src="assets/manzanitas-wordmark-negative.svg" alt="Marketing con Manzanitas" />
  <p class="mcm-sub mcm-episode" data-slot="episode">Pódcast · Ep. 12<br>Con <strong>Nombre del invitado</strong></p>
  <div class="mcm-voice" data-slot="voice">
    <p class="mcm-q mcm-q--one-line"><span class="mcm-ring" aria-hidden="true"></span><span data-slot-field="question">¿La pregunta?</span></p>
    <p class="mcm-a"><span data-slot-field="answer">Respuesta</span><span class="mcm-sphere" aria-hidden="true"></span></p>
  </div>
  <img class="mcm-signature" data-mcm-signature src="assets/efeonce-logo-negative.svg" alt="Efeonce" />
</main>
</body>
</html>
