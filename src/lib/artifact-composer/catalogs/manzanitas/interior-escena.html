<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Marketing con Manzanitas · Escena interior</title>
<link rel="stylesheet" href="deck-fonts.css" />
<link rel="stylesheet" href="manzanitas-tokens.css" />
<link rel="stylesheet" href="manzanitas.css" />
<style>
.mcm-interior-escena .mcm-masthead { left: 80px; top: 64px; width: 160px; height: 72px; }
.mcm-interior-escena .mcm-step-label { position: absolute; right: 80px; top: 64px; height: 72px; display: flex; align-items: center; font-size: 26px; }
.mcm-interior-escena .mcm-voice { --mcm-answer-px: 90px; left: 80px; top: 156px; width: 920px; }
</style>
</head>
<body>
<main class="mcm-canvas mcm-canvas--4x5 mcm-tone-navy mcm-line-engine mcm-interior-escena" data-mcm-root data-slot="theme">
  <div class="mcm-photo" data-slot="photo"><img data-slot-field="src" src="assets/manzanitas-apple-navy-engine.svg" alt="" /></div>
  <img class="mcm-masthead" data-mcm-masthead src="assets/manzanitas-logo-negative-engine.svg" alt="Marketing con Manzanitas" />
  <p class="mcm-label mcm-step-label" data-slot="stepLabel">Paso 3 de 5</p>
  <div class="mcm-voice" data-slot="voice">
    <p class="mcm-q"><span class="mcm-ring" aria-hidden="true"></span><span data-slot-field="question">¿La pregunta?</span></p>
    <p class="mcm-a"><span data-slot-field="answer">Respuesta</span><span class="mcm-sphere" aria-hidden="true"></span></p>
  </div>
  <img class="mcm-swipe mcm-swipe--interior" data-mcm-swipe src="assets/swipe-rest-navy-engine.svg" alt="Desliza" />
  <img class="mcm-signature mcm-signature--carousel" data-mcm-signature src="assets/efeonce-logo-negative.svg" alt="Efeonce" />
</main>
</body>
</html>
