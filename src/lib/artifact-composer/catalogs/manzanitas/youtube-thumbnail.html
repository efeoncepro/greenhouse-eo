<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Marketing con Manzanitas · Miniatura de YouTube</title>
<link rel="stylesheet" href="deck-fonts.css" />
<link rel="stylesheet" href="manzanitas-tokens.css" />
<link rel="stylesheet" href="manzanitas.css" />
<style>
.mcm-youtube .mcm-masthead { left: 72px; top: 56px; width: 200px; height: 90px; }
.mcm-youtube .mcm-voice { --mcm-answer-px: 150px; left: 72px; top: 196px; width: 620px; }
.mcm-youtube .mcm-signature { left: 72px; top: 612px; width: 180px; height: 43px; }
</style>
</head>
<body>
<main class="mcm-canvas mcm-canvas--16x9 mcm-tone-navy mcm-line-engine mcm-youtube" data-mcm-root data-slot="theme">
  <div class="mcm-photo" data-slot="photo"><img data-slot-field="src" src="assets/manzanitas-apple-navy-engine.svg" alt="" /></div>
  <img class="mcm-masthead" data-mcm-masthead src="assets/manzanitas-logo-negative-engine.svg" alt="Marketing con Manzanitas" />
  <div class="mcm-voice" data-slot="voice">
    <p class="mcm-q"><span class="mcm-ring" aria-hidden="true"></span><span data-slot-field="question">¿La pregunta?</span></p>
    <p class="mcm-a"><span data-slot-field="answer">Respuesta</span><span class="mcm-sphere" aria-hidden="true"></span></p>
  </div>
  <img class="mcm-signature" data-mcm-signature src="assets/efeonce-logo-negative.svg" alt="Efeonce" />
</main>
</body>
</html>
