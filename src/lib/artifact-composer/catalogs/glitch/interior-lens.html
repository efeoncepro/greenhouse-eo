<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Glitch · Lámina interior con lente</title>
<link rel="stylesheet" href="deck-fonts.css" />
<link rel="stylesheet" href="glitch-tokens.css" />
<link rel="stylesheet" href="glitch.css" />
<style>
  .gx-interior  .gx-masthead { left: 88px; right: 88px; top: 64px; }
  .gx-interior .gx-photo { top: 176px; width: 1080px; height: 450px; }
  .gx-interior .gx-credit { top: 188px; }
  .gx-interior .gx-lens { position: absolute; width: 260px; height: 260px; transform: translate(-50%, -50%); color: var(--gx-accent); }
  .gx-interior .gx-lens__detail { position: absolute; left: 20px; top: 20px; width: 220px; height: 220px; border-radius: 50%; overflow: hidden; }
  .gx-interior .gx-lens__detail img { display: block; width: 100%; height: 100%; }
  .gx-interior .gx-lens__anatomy { position: absolute; inset: 0; overflow: visible; }
  .gx-interior .gx-pov .gx-headline__entry { font-size: var(--gx-entry-size); }
  .gx-interior .gx-chip { left: 88px; top: 564px; font-size: 15px; }
  .gx-interior .gx-opening { left: 88px; top: 133px; }
  .gx-interior .gx-news { left: 88px; right: 88px; top: 812px; }
  .gx-interior .gx-footer { left: 88px; right: 88px; bottom: 58px; }
  .gx-interior .gx-signature { bottom: 50px; width: 140px; }
</style>
</head>
<body>
<main class="gx-canvas gx-canvas--4x5 gx-interior" data-gx-root>
  <header class="gx-masthead gx-masthead--compact">
    <img class="gx-masthead__wordmark" src="assets/glitch-logo-negative.svg" alt="Glitch" />
    <div class="gx-masthead__inline"><span class="gx-masthead__label">EDICIÓN</span><span class="gx-masthead__number"><span class="gx-hash">#</span><span class="gx-num" data-slot="edition">17</span></span></div>
  </header>
  <div class="gx-photo" data-slot="photo"><img data-slot-field="src" src="assets/glitch-apple.svg" alt="" /></div>
  <svg class="gx-bytes" data-gx-bytes viewBox="0 0 1080 1350" width="1080" height="1350" aria-hidden="true"></svg>
  <div class="gx-lens" data-slot="lens" role="img" aria-label="Lente: lo que Glitch mira dentro de la foto">
    <div class="gx-lens__detail"><img data-slot-field="src" src="assets/glitch-apple.svg" alt="" /></div>
    <svg class="gx-lens__anatomy" viewBox="0 0 260 260" width="260" height="260" aria-hidden="true"><circle cx="130" cy="130" r="124" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-width="1.9" /><path d="M13.5 87.6 A124 124 0 0 1 87.6 13.5" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" /><circle cx="87.6" cy="13.5" r="7.6" fill="currentColor" /></svg>
  </div>
  <div class="gx-chip"><span class="gx-chip__tag">NOTICIA <span data-slot="newsNumber">1</span></span><span class="gx-chip__meta" data-slot="outlet">Medio · fecha</span></div>
  <p class="gx-credit" data-slot="credit">Foto: crédito de la foto</p>
  <section class="gx-news">
    <div class="gx-news__section"><span data-slot="section">Sección</span> <span class="gx-plus-ia">+ IA</span> · LA NOTICIA</div>
    <div class="gx-news__headline" data-slot="headline">El titular de la noticia, tal como lo cuentan los medios</div>
    <div class="gx-drop"><svg class="gx-dots" width="70" height="16" viewBox="0 0 70 16" aria-hidden="true"><g fill="currentColor"><circle cx="8" cy="8" r="8"/><circle cx="29" cy="8" r="8"/><rect x="46" y="0" width="4" height="4"/><rect x="50" y="0" width="4" height="4"/><rect x="47" y="4" width="4" height="4"/><rect x="51" y="4" width="4" height="4"/><rect x="55" y="4" width="4" height="4"/><rect x="59" y="4" width="4" height="4"/><rect x="39" y="8" width="4" height="4"/><rect x="43" y="8" width="4" height="4"/><rect x="47" y="8" width="4" height="4"/><rect x="51" y="8" width="4" height="4"/><rect x="53" y="12" width="4" height="4"/><rect x="57" y="12" width="4" height="4"/></g></svg><span class="gx-drop__label">GLITCH DROP</span></div>
    <div class="gx-pov" data-slot="pov"><span class="gx-headline__entry" data-slot-field="entry">Todos miraron al que hablaba.</span><span data-slot-field="punch">Nosotros, al detalle.</span></div>
    <div class="gx-why" data-slot="why">Por qué importa el lunes.</div>
  </section>
  <div class="gx-footer">
    <div class="gx-progress" data-slot="progress"><span class="gx-seg"></span><span class="gx-seg"></span><span class="gx-seg"></span><span class="gx-seg"></span><span class="gx-seg"></span><span class="gx-seg"></span><span class="gx-seg"></span><span class="gx-seg"></span><span class="gx-progress__label" data-slot-field="label">1 / 8</span></div>
    <div class="gx-swipe"><span class="gx-swipe__label">DESLIZA</span><img class="gx-swipe__icon" src="assets/icon-deslizar.svg" alt="" /></div>
  </div>
  <img class="gx-signature" src="assets/efeonce-logo-negative.svg" alt="Efeonce" />
</main>
</body>
</html>
