<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Glitch Flash · Banner del blog (16:9)</title>
<link rel="stylesheet" href="deck-fonts.css" />
<link rel="stylesheet" href="glitch-tokens.css" />
<link rel="stylesheet" href="glitch.css" />
<style>
  .gx-blog-a .gx-photo { left: 820px; top: 0; width: 1100px; height: 800px; }
  .gx-blog-a .gx-credit { top: 772px; }
  .gx-blog-a .gx-masthead { left: 110px; right: 88px; top: 70px; }
  .gx-blog-a .gx-chip { left: 110px; top: 300px; background: color-mix(in srgb, var(--gx-text-strong) 6%, transparent); }
  .gx-blog-a .gx-headline { left: 106px; width: 660px; top: 368px; font-size: 100px; line-height: 0.94; }
  .gx-blog-a .gx-lines { left: 110px; top: 760px; width: 620px; flex-direction: column; gap: 14px; }
  .gx-blog-a .gx-line { width: 620px; }
  .gx-blog-a .gx-signature { bottom: 52px; width: 180px; }
</style>
</head>
<body>
<main class="gx-canvas gx-canvas--16x9 gx-blog-a" data-gx-root>
  <div class="gx-photo" data-slot="photo"><img data-slot-field="src" src="assets/glitch-apple.svg" alt="" /></div>
  <svg class="gx-bytes" data-gx-bytes viewBox="0 0 1920 1080" width="1920" height="1080" aria-hidden="true"></svg>
  <p class="gx-credit" data-slot="credit">Foto: crédito de la foto</p>

  <header class="gx-masthead">
    <img class="gx-masthead__wordmark" src="assets/glitch-logo-negative.svg" alt="Glitch" />
    <div class="gx-masthead__edition">
      <span class="gx-masthead__label">NO ESPERA AL LUNES</span>
      <span class="gx-masthead__number"><span class="gx-flash-mark"><img class="gx-flash-trail" src="assets/flash-trail.svg" alt="" /><span class="gx-num">FLASH</span></span></span>
    </div>
  </header>

  <div class="gx-chip"><span class="gx-chip__tag gx-chip__tag--accent">LA NOTICIA</span><span class="gx-chip__meta" data-slot="outlet">Medio · fecha</span></div>

  <h1 class="gx-headline" data-slot="headline">
    <span class="gx-headline__entry" data-slot-field="entry">Entrada ligera</span><span data-slot-field="punchLead">remate que</span> <span class="gx-nowrap"><span data-slot-field="punchLast">cierra</span><img class="gx-apple" src="assets/glitch-apple.svg" alt="" /></span>
  </h1>

  <div class="gx-lines" data-slot="lines">
    <div class="gx-line"><span class="gx-section"><span data-slot-field="section">Sección</span> <span class="gx-plus-ia">+ IA</span></span><span class="gx-line__text" data-slot-field="text">Noticia en seis palabras</span></div>
  </div>

  <img class="gx-signature" src="assets/efeonce-logo-negative.svg" alt="Efeonce" />
</main>
</body>
</html>
