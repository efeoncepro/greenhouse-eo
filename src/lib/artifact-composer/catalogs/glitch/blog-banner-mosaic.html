<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Glitch · Banner del blog C (mosaico)</title>
<link rel="stylesheet" href="deck-fonts.css" />
<link rel="stylesheet" href="glitch-tokens.css" />
<link rel="stylesheet" href="glitch.css" />
<style>
  .gx-blog-c .gx-masthead { left: 110px; right: 88px; top: 70px; }
  .gx-blog-c .gx-headline { left: 106px; right: 106px; top: 236px; font-size: 100px; line-height: 0.94; letter-spacing: 0; }
  .gx-blog-c .gx-card { width: 400px; top: 486px; }
  .gx-blog-c .gx-card:nth-of-type(1) { left: 110px; }
  .gx-blog-c .gx-card:nth-of-type(2) { left: 543px; }
  .gx-blog-c .gx-card:nth-of-type(3) { left: 976px; }
  .gx-blog-c .gx-card:nth-of-type(4) { left: 1409px; }
  .gx-blog-c .gx-card__photo { width: 400px; height: 220px; border-radius: 10px 10px 0 0; }
  .gx-blog-c .gx-card__body { top: 286px; width: 400px; gap: 8px; }
  .gx-blog-c .gx-card__pov { font-size: 32px; }
  .gx-blog-c .gx-credit--mosaic { left: 110px; right: auto; top: 1000px; color: var(--gx-sub); opacity: 1; font-size: 13px; }
  .gx-blog-c .gx-signature { bottom: 52px; width: 180px; }
</style>
</head>
<body>
<main class="gx-canvas gx-canvas--16x9 gx-blog-c" data-gx-root>
  <header class="gx-masthead">
    <img class="gx-masthead__wordmark" src="assets/glitch-logo-negative.svg" alt="Glitch" />
    <div class="gx-masthead__edition">
      <span class="gx-masthead__label">EDICIÓN</span>
      <span class="gx-masthead__number"><span class="gx-hash">#</span><span class="gx-num" data-slot="edition">17</span></span>
    </div>
  </header>
  <h1 class="gx-headline" data-slot="headline"><span class="gx-headline__entry" data-slot-field="entry">Ocho noticias.</span><span data-slot-field="punchLead">Un mismo</span> <span class="gx-nowrap"><span data-slot-field="punchLast">aviso</span><img class="gx-apple" src="assets/glitch-apple.svg" alt="" /></span></h1>
  <article class="gx-card" data-slot="card1">
    <div class="gx-card__photo"><img data-slot-field="src" src="assets/glitch-apple.svg" alt="" /></div>
    <div class="gx-card__body"><span class="gx-card__section"><span data-slot-field="section">Sección</span> <span class="gx-plus-ia">+ IA</span></span><span class="gx-card__pov" data-slot-field="pov">El POV de la noticia</span></div>
  </article>
  <article class="gx-card" data-slot="card2">
    <div class="gx-card__photo"><img data-slot-field="src" src="assets/glitch-apple.svg" alt="" /></div>
    <div class="gx-card__body"><span class="gx-card__section"><span data-slot-field="section">Sección</span> <span class="gx-plus-ia">+ IA</span></span><span class="gx-card__pov" data-slot-field="pov">El POV de la noticia</span></div>
  </article>
  <article class="gx-card" data-slot="card3">
    <div class="gx-card__photo"><img data-slot-field="src" src="assets/glitch-apple.svg" alt="" /></div>
    <div class="gx-card__body"><span class="gx-card__section"><span data-slot-field="section">Sección</span> <span class="gx-plus-ia">+ IA</span></span><span class="gx-card__pov" data-slot-field="pov">El POV de la noticia</span></div>
  </article>
  <article class="gx-card" data-slot="card4">
    <div class="gx-card__photo"><img data-slot-field="src" src="assets/glitch-apple.svg" alt="" /></div>
    <div class="gx-card__body"><span class="gx-card__section"><span data-slot-field="section">Sección</span> <span class="gx-plus-ia">+ IA</span></span><span class="gx-card__pov" data-slot-field="pov">El POV de la noticia</span></div>
  </article>
  <svg class="gx-bytes" data-gx-bytes viewBox="0 0 1920 1080" width="1920" height="1080" aria-hidden="true"></svg>
  <p class="gx-credit gx-credit--mosaic" data-slot="credit">Fotos: créditos</p>
  <img class="gx-signature" src="assets/efeonce-logo-negative.svg" alt="Efeonce" />
</main>
</body>
</html>
