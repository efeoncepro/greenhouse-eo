<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<!--
  InsightsLimitsSlide — cierre del deck con el estilo editorial (TASK-1889); reemplaza a la v1. El
  canvas no la diseñó. Lo que la edición no puede afirmar, cada límite con su causa: nunca se omite.
-->
<link rel="stylesheet" href="deck-tokens.css" />
<link rel="stylesheet" href="deck-fonts.css" />
<link rel="stylesheet" href="deck-editorial.css" />
<style>
  .v2-main { position: absolute; left: 72px; right: 72px; top: 104px; display: flex; flex-direction: column; }

  .v2-assertion {
    margin: 22px 0 0;
    max-width: 1000px;
    font-family: var(--axis-deck-type-display);
    font-size: 40px;
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .v2-assertion em { font-style: normal; color: var(--axis-deck-role-navyAccent); }

  .limits { margin-top: 40px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 56px; }

  .limit { display: flex; flex-direction: column; gap: 6px; padding: 14px 0; border-top: 1px solid rgba(var(--axis-deck-role-navyMuted-rgb), 0.14); }

  .limit-subject { font-family: var(--axis-deck-type-display); font-size: 15px; font-weight: 600; line-height: 1.3; }

  .limit-cause { font-size: 14px; line-height: 1.5; color: var(--axis-deck-role-navyLead); }
</style>
</head>
<body>
  <div class="lamina">
    <svg class="art" width="1280" height="720" viewBox="0 0 1280 720" aria-hidden="true">
      <defs>
        <radialGradient id="limitsHalo" cx="0.5" cy="0.5" r="0.5">
          <stop class="halo-stop" offset="0" stop-opacity="0.2"></stop>
          <stop class="halo-stop" offset="0.55" stop-opacity="0.06"></stop>
          <stop class="halo-stop" offset="1" stop-opacity="0"></stop>
        </radialGradient>
      </defs>
      <circle cx="230" cy="250" r="380" fill="url(#limitsHalo)"></circle>
      <g class="orbit-rings">
        <circle cx="1290" cy="740" r="230"></circle>
        <circle cx="1290" cy="740" r="330"></circle>
        <circle cx="1290" cy="740" r="430"></circle>
      </g>
    </svg>

    <header class="deck-head">
      <span class="deck-tab">
        <span class="deck-tab-number" data-slot="tabNumber">00</span>
        <span class="deck-tab-section" data-slot="section">Resumen ejecutivo</span>
      </span>
      <span class="deck-period" data-slot="period">Agosto 2026 · contra julio 2026</span>
    </header>

    <main class="v2-main">
      <span class="deck-eyebrow"><svg class="stroke-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.585 10.587a2 2 0 0 0 2.829 2.828"></path><path d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87"></path><path d="M3 3l18 18"></path></svg><span data-slot="eyebrow">Límites de la edición</span></span>
      <h1 class="v2-assertion" data-slot="assertion">Lo que esta edición <em>no</em> puede afirmar</h1>
      <div class="limits" data-slot="limits">
        <div class="limit"><span class="limit-subject" data-slot-field="subject">Posiciones promedio</span><span class="limit-cause" data-slot-field="cause">Search Console entrega un promedio ponderado.</span></div>
      </div>
    </main>
    <footer class="deck-foot2">
      <span class="deck-foot2-id">
        <img src="assets/brand/logo-negative.svg" alt="Efeonce" />
        <span class="divider"></span>
        <span class="deck-foot2-edition" data-slot="footerEdition">Insights · Informe de agosto 2026</span>
      </span>
      <span class="deck-foot2-end">
        <img class="url-bubble" data-slot="urlBubble" src="assets/url-lum.svg" alt="efeoncepro.com" />
        <span class="divider"></span>
        <span class="deck-folio" data-slot="folio"><span class="deck-folio-page" data-slot-field="page">03</span><span class="deck-folio-total">/ <span data-slot-field="total">24</span></span></span>
      </span>
    </footer>
  </div>
</body>
</html>
