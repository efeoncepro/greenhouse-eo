<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<!--
  InsightsNarrativeSlide — lámina narrada del deck (TASK-1889). Sin lámina propia en el canvas: usa
  la gramática aprobada de «Nuestra lectura» del deck — afirmación grande, puntos numerados en columnas
  con filete y la franja «En una frase» si el plan trae la frase clave. El primer punto lleva el filete
  teal (el que abre el argumento); el ordinal sale de la posición. Sirve a lo que ninguna figura tituló y
  al capítulo sin figura (se narra, no se omite).
-->
<link rel="stylesheet" href="deck-tokens.css" />
<link rel="stylesheet" href="deck-fonts.css" />
<link rel="stylesheet" href="deck-editorial.css" />
<style>
  .narr-main { position: absolute; left: 72px; right: 72px; top: 104px; display: flex; flex-direction: column; }

  .narr-assertion {
    margin: 22px 0 0;
    max-width: 1000px;
    font-family: var(--axis-deck-type-display);
    font-size: 46px;
    line-height: 1.08;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .narr-assertion em { font-style: normal; color: var(--axis-deck-role-navyAccent); }

  .points { margin-top: 52px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 44px; }

  .points:has(.point:nth-child(4)) { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 36px; }

  .points:not(:has(.point:nth-child(3))) { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .point { display: flex; flex-direction: column; gap: 12px; padding-top: 18px; border-top: 2px solid rgba(var(--axis-deck-role-navyMuted-rgb), 0.3); }

  .point:first-child { border-top-color: var(--axis-deck-role-navyAccent); }

  .point-ordinal { font-family: var(--axis-deck-type-display); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--axis-deck-role-dataPriorOnNavy); }

  .point-text { margin: 0; font-size: 16px; line-height: 1.55; color: var(--axis-deck-role-navyLead); }

  .point-text strong { font-weight: 700; color: var(--axis-deck-role-navyInk); }

  .deck-band-text em { font-style: italic; font-weight: 700; }
</style>
</head>
<body>
  <div class="lamina">
    <svg class="art" width="1280" height="720" viewBox="0 0 1280 720" aria-hidden="true">
      <defs>
        <radialGradient id="narrativeHalo" cx="0.5" cy="0.5" r="0.5">
          <stop class="halo-stop" offset="0" stop-opacity="0.2"></stop>
          <stop class="halo-stop" offset="0.55" stop-opacity="0.06"></stop>
          <stop class="halo-stop" offset="1" stop-opacity="0"></stop>
        </radialGradient>
      </defs>
      <circle cx="230" cy="250" r="380" fill="url(#narrativeHalo)"></circle>
      <g class="orbit-rings">
        <circle cx="1290" cy="740" r="230"></circle>
        <circle cx="1290" cy="740" r="330"></circle>
        <circle cx="1290" cy="740" r="430"></circle>
      </g>
    </svg>

    <header class="deck-head">
      <span class="deck-tab">
        <span class="deck-tab-number" data-slot="tabNumber">00</span>
        <span class="deck-tab-section" data-slot="section">Resumen ejecutivo</span>
      </span>
      <span class="deck-period" data-slot="period">Agosto 2026 · contra julio 2026</span>
    </header>

    <main class="narr-main">
      <span class="deck-eyebrow"><svg class="stroke-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v4a1 1 0 0 0 1 1h4"></path><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"></path><path d="M9 9h1"></path><path d="M9 13h6"></path><path d="M9 17h6"></path></svg><span data-slot="eyebrow">Visibilidad orgánica</span></span>
      <h1 class="narr-assertion" data-slot="assertion">La afirmación que ordena este capítulo</h1>
      <div class="points" data-slot="points">
        <div class="point"><span class="point-ordinal" data-slot-field="ordinal">01</span><p class="point-text" data-slot-field="text">Desarrollo.</p></div>
      </div>
    </main>

    <div class="deck-band" data-slot="oneLiner"><span class="deck-band-label"><svg class="stroke-icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 11h-4a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1h3a1 1 0 0 1 1 1v6c0 2.667 -1.333 4.333 -4 5"></path><path d="M19 11h-4a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1h3a1 1 0 0 1 1 1v6c0 2.667 -1.333 4.333 -4 5"></path></svg><span data-slot-field="label">En una frase</span></span><span class="deck-band-text" data-slot-field="text">La frase que el lector se lleva.</span></div>

    <footer class="deck-foot2">
      <span class="deck-foot2-id">
        <img src="assets/brand/logo-negative.svg" alt="Efeonce" />
        <span class="divider"></span>
        <span class="deck-foot2-edition" data-slot="footerEdition">Insights · Informe de agosto 2026</span>
      </span>
      <span class="deck-foot2-end">
        <img class="url-bubble" data-slot="urlBubble" src="assets/url-lum.svg" alt="efeoncepro.com" />
        <span class="divider"></span>
        <span class="deck-folio" data-slot="folio"><span class="deck-folio-page" data-slot-field="page">03</span><span class="deck-folio-total">/ <span data-slot-field="total">24</span></span></span>
      </span>
    </footer>
  </div>
</body>
</html>
