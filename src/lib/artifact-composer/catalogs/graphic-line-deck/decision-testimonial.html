<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · testimonio</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `decision-testimonial` (surface deck, tema oscuro, TASK-1928). La frase del cliente es la respuesta, a escala
      de titular y entre comillas (la comilla de cierre en el acento cierra la frase en lugar de la esfera); la cita
      textual debajo; la firma con el logo del cliente, y a la derecha tres cifras del mismo caso con su fuente. La
      selección toma la frase. Referencia: DeckTestimonio (E5b-testimonio).
    -->
    <main class="gl-slide gl-dt" data-gl-root data-slot="frame">
      <figure class="gl-layer gl-dt-glow" data-slot="glow">
        <img data-slot-field="src" alt="" />
      </figure>
      <figure class="gl-layer" data-slot="indicator">
        <img data-slot-field="src" alt="" />
      </figure>

      <div data-slot="voice">
        <p class="gl-eyebrow" data-slot-field="eyebrow">En palabras de Sky</p>
        <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot-field="question">¿Cómo es trabajar con nosotros?</span></p>
        <p class="gl-dt-mark" aria-hidden="true">«</p>
        <p class="gl-answer gl-dt-phrase"><span data-gl-selection-target><span class="gl-answer-lead" data-slot-field="answerLead">Agilizar mucho</span><span data-slot-field="answer">la carga de trabajo</span></span><span class="gl-dt-close" data-gl-part="sphere" aria-hidden="true">»</span></p>
      </div>

      <p class="gl-dt-quote" data-slot="quote">«Hemos mejorado muchísimo en cuanto a las herramientas tecnológicas.»</p>

      <div class="gl-dt-signature">
        <figure class="gl-dt-logo" data-slot="clientLogo">
          <img data-slot-field="src" alt="" />
        </figure>
        <span class="gl-dt-divider" aria-hidden="true"></span>
        <div data-slot="author">
          <p class="gl-dt-name" data-slot-field="name">Adriana Contreras</p>
          <p class="gl-dt-role" data-slot-field="role">Team SKY</p>
        </div>
      </div>

      <div class="gl-dt-proof">
        <ol class="gl-dt-proof-list" data-slot="proof">
          <li class="gl-dt-proof-item">
            <p class="gl-dt-proof-value" data-slot-field="value">+2.000</p>
            <p class="gl-dt-proof-label" data-slot-field="label">piezas aprobadas</p>
          </li>
        </ol>
        <p class="gl-dt-source" data-slot="source">Fuente: caso publicado de Sky Airlines.</p>
      </div>

      <div class="gl-hidden" data-slot="selection"></div>

      <img class="gl-url-bubble" data-slot="urlBubble" src="assets/url-bubble-baked-dark.svg" alt="efeoncepro.com" />
    </main>
  </body>
</html>
