<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · la cotización por capacidad</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `content-pricing`, composición `table` (surface deck, tema oscuro, TASK-1928). La voz grande a la izquierda y
      los tres planes en una fila; el recomendado sale de la grilla (más alto, en papel, con la selección de Finanzas).
      Los montos son SIEMPRE el marcador. Referencia: DeckCotizacion (D5-cotizacion).
    -->
    <main class="gl-slide gl-pt" data-gl-root data-slot="frame">
      <div data-slot="voice">
        <p class="gl-eyebrow" data-slot-field="eyebrow">Inversión</p>
        <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot-field="question">¿Cómo se cotiza?</span></p>
        <p class="gl-answer"><span class="gl-answer-lead" data-slot-field="answerLead">Por</span><span data-slot-field="answer">capacidad</span><span class="gl-sphere" data-gl-part="sphere" aria-hidden="true"></span></p>
      </div>

      <p class="gl-body" data-slot="body">El fee del equipo se cotiza por capacidad gobernada.</p>
      <p class="gl-pt-legal" data-slot="legal">Valores netos, IVA no incluido.</p>

      <ol class="gl-pt-plans" data-slot="plans">
        <li class="gl-pt-plan" data-gl-select-item>
          <p class="gl-pt-label" data-slot-field="label">Recomendado</p>
          <p class="gl-pt-name" data-slot-field="name">Basic</p>
          <p class="gl-pt-tagline" data-slot-field="tagline">Para empezar a medir</p>
          <p class="gl-pt-amount" data-slot-field="amount">[MONTO]</p>
          <p class="gl-pt-period" data-slot-field="period">al mes · neto + IVA</p>
          <ul class="gl-pt-features" data-slot-field="features">
            <li class="gl-pt-feature"><span data-slot-field="text">Dashboard y KPIs</span></li>
          </ul>
        </li>
      </ol>

      <div class="gl-hidden" data-slot="selection"></div>

      <img class="gl-url-bubble" data-slot="urlBubble" src="assets/url-bubble-baked-dark.svg" alt="efeoncepro.com" />
    </main>
  </body>
</html>
