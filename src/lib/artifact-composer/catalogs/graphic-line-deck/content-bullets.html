<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · texto con viñetas</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `content-bullets` (surface deck, tema oscuro, TASK-1928). Cuatro puntos numerados en una grilla de 2 × 2: el
      número en Bricolage de lectura y en el acento, nunca la esfera; la selección toma el que define la oferta.
      Referencia: DeckVinetas (D2-vinetas).
    -->
    <main class="gl-slide gl-cb" data-gl-root data-slot="frame">
      <figure class="gl-layer" data-slot="indicator">
        <img data-slot-field="src" alt="" />
      </figure>

      <div data-slot="voice">
        <p class="gl-eyebrow" data-slot-field="eyebrow">La experiencia Efeonce</p>
        <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot-field="question">¿Qué recibes al trabajar con nosotros?</span></p>
        <p class="gl-answer"><span data-slot-field="answer">Un sistema</span><span class="gl-sphere" data-gl-part="sphere" aria-hidden="true"></span></p>
      </div>

      <ol class="gl-cb-items" data-slot="items">
        <li class="gl-cb-item" data-gl-select-item>
          <p class="gl-cb-number" data-slot-field="number">01</p>
          <div class="gl-cb-text">
            <p class="gl-cb-title" data-slot-field="title">Un solo interlocutor</p>
            <p class="gl-cb-desc" data-slot-field="desc">Tu Director de Cuenta coordina todas las líneas.</p>
          </div>
        </li>
      </ol>

      <div class="gl-hidden" data-slot="selection"></div>

      <img class="gl-url-bubble" data-slot="urlBubble" src="assets/url-bubble-baked-dark.svg" alt="efeoncepro.com" />
    </main>
  </body>
</html>
