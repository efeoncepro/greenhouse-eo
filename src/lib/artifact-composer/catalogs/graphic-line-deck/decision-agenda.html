<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · agenda</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `decision-agenda` (surface deck, papel, TASK-1928). Cinco temas grandes con su número; el que importa marcado
      (número en el acento, texto en su peso fuerte) y con la selección de Cliente. Referencia: DeckAgenda (E6-agenda).
    -->
    <main class="gl-slide gl-paper gl-ag" data-gl-root data-slot="frame">
      <figure class="gl-layer" data-slot="indicator">
        <img data-slot-field="src" alt="" />
      </figure>

      <div data-slot="voice">
        <p class="gl-eyebrow" data-slot-field="eyebrow">Agenda</p>
        <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot-field="question">¿Qué veremos hoy?</span></p>
        <p class="gl-answer"><span class="gl-answer-lead" data-slot-field="answerLead">Cinco</span><span data-slot-field="answer">temas</span><span class="gl-sphere" data-gl-part="sphere" aria-hidden="true"></span></p>
      </div>

      <ol class="gl-ag-topics" data-slot="topics">
        <li class="gl-ag-topic" data-gl-select-item>
          <span class="gl-ag-number" data-slot-field="number">01</span>
          <span class="gl-ag-text" data-slot-field="topic">Quiénes somos</span>
        </li>
      </ol>

      <div class="gl-hidden" data-slot="selection"></div>

      <img class="gl-url-bubble" data-slot="urlBubble" src="assets/url-bubble-baked-light.svg" alt="efeoncepro.com" />
    </main>
  </body>
</html>
