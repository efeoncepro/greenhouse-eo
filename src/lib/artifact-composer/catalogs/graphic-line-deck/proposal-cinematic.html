<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · propuesta cinematográfica</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `proposal-cinematic` (surface deck, papel proposal). Vende un servicio con una imagen que se
      recuerda: foto de cine a sangre con el sujeto a la derecha, la voz en el espacio oscuro de la
      izquierda, la prueba con fuente y hasta cuatro pasos. Sin logo ni indicador: firma la burbuja URL
      en el pie. Referencia aprobada: página «Deck» del canvas por superficie.
    -->
    <main class="gl-slide gl-steps-inline" data-gl-root data-slot="frame">
      <figure class="gl-photo" data-slot="photo">
        <img data-slot-field="src" alt="" />
      </figure>

      <div data-slot="voice">
        <p class="gl-eyebrow" data-slot-field="eyebrow">Nuestra propuesta · Servicios creativos</p>
        <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot-field="question">¿Tu marca en cada pantalla?</span></p>
        <p class="gl-answer" data-gl-selection-target><span class="gl-answer-lead" data-slot-field="answerLead"></span><span data-slot-field="answer">En todas</span><span class="gl-sphere" data-gl-part="sphere" aria-hidden="true"></span></p>
      </div>

      <p class="gl-body" data-slot="body">Social, campañas, video, motion y creatividad para performance.</p>

      <div data-slot="proof">
        <p class="gl-proof" data-slot-field="text">Sky: +2.000 piezas aprobadas en 12 meses</p>
      </div>

      <ol class="gl-steps" data-slot="steps">
        <li class="gl-step">
          <img class="gl-step-icon" data-slot-field="icon" alt="" />
          <div>
            <p class="gl-step-kicker" data-slot-field="kicker">Empieza aquí</p>
            <p class="gl-step-name" data-slot-field="name">Creative Sprint</p>
          </div>
        </li>
      </ol>

      <div class="gl-hidden" data-slot="selection"></div>

      <img class="gl-url-bubble" data-slot="urlBubble" src="assets/url-bubble-baked-dark.svg" alt="efeoncepro.com" />
    </main>
  </body>
</html>
