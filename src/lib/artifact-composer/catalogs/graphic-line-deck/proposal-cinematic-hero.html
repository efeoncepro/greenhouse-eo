<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · propuesta cinematográfica · protagonista</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `proposal-cinematic`, composición `hero` (contrato 0.1.2): la escena es la protagonista. Foto de cine a
      sangre, la voz completa a la izquierda con la respuesta a su tamaño mayor y la selección sobre la respuesta; sin
      prueba ni pasos (AXIS los prohíbe en este layout). Firma la burbuja URL en el pie. Referencia aprobada:
      `proposal-cinematic-nexa`.
    -->
    <main class="gl-slide" data-gl-root data-slot="frame">
      <figure class="gl-photo" data-slot="photo">
        <img data-slot-field="src" alt="" />
      </figure>

      <div data-slot="voice">
        <p class="gl-eyebrow" data-slot-field="eyebrow">Fuerza de trabajo híbrida</p>
        <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot-field="question">¿Listos para la carrera?</span></p>
        <p class="gl-answer" data-gl-selection-target><span class="gl-answer-lead" data-slot-field="answerLead"></span><span data-slot-field="answer">Vamos</span><span class="gl-sphere" data-gl-part="sphere" aria-hidden="true"></span></p>
      </div>

      <p class="gl-body" data-slot="body">Nexa y sus agentes arrancan contigo.</p>

      <div class="gl-hidden" data-slot="selection"></div>

      <img class="gl-url-bubble" data-slot="urlBubble" src="assets/url-bubble-baked-dark.svg" alt="efeoncepro.com" />
    </main>
  </body>
</html>
