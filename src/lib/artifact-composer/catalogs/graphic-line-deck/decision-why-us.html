<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · por qué elegirnos</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `decision-why-us` (surface deck, papel, TASK-1928). Un muro de seis cifras citables (3 × 2) con su fuente; la
      selección toma la que se elige. La caja de la cifra se reserva a su tamaño mayor en todas las celdas: una cifra larga
      baja de cuerpo sin mover su rótulo. Referencia: DeckPorQue (F5-porque).
    -->
    <main class="gl-slide gl-paper gl-dw" data-gl-root data-slot="frame">
      <figure class="gl-layer" data-slot="indicator">
        <img data-slot-field="src" alt="" />
      </figure>

      <div data-slot="voice">
        <p class="gl-eyebrow" data-slot-field="eyebrow">Por qué elegirnos</p>
        <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot-field="question">¿Por qué Efeonce?</span></p>
        <p class="gl-answer"><span data-slot-field="answer">Por esto</span><span class="gl-sphere" data-gl-part="sphere" aria-hidden="true"></span></p>
      </div>

      <p class="gl-body gl-dw-body" data-slot="body">No te entregamos crecimiento: lo construimos contigo.</p>

      <ol class="gl-dw-facts" data-slot="facts">
        <li class="gl-dw-fact" data-gl-select-item>
          <p class="gl-dw-value"><span data-slot-field="value">+10</span></p>
          <p class="gl-dw-label" data-slot-field="label">años ejecutando en LATAM</p>
        </li>
      </ol>

      <p class="gl-dw-source" data-slot="source">Fuente: Efeonce.</p>

      <div class="gl-hidden" data-slot="selection"></div>

      <img class="gl-url-bubble" data-slot="urlBubble" src="assets/url-bubble-baked-light.svg" alt="efeoncepro.com" />
    </main>
  </body>
</html>
