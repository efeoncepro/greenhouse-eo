<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · la escalera tipográfica del método</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `method-staircase`, composición `flat` (surface deck, tema oscuro, TASK-1928). La escalera tipográfica:
      cinco filas que suben en diagonal hacia la derecha, sin peldaños ni brillo; número en suave, nombre en Bricolage y
      descriptor en Poppins. El último nombre, más grande y en el acento (≥ 24 px, cumple D1). La selección toma el nivel
      que se trabaja. Sin foto ni órbita: firma la burbuja URL en el pie. Referencia: DeckBex (F2-bex).
    -->
    <main class="gl-slide gl-mf" data-gl-root data-slot="frame">
      <ol class="gl-mf-levels" data-slot="levels">
        <li class="gl-mf-level">
          <div class="gl-mf-row" data-gl-level-row>
            <span class="gl-mf-number" aria-hidden="true"></span>
            <span class="gl-mf-name" data-slot-field="name">Be Found</span>
            <span class="gl-mf-descriptor" data-slot-field="descriptor">que te encuentre</span>
          </div>
        </li>
      </ol>

      <div class="gl-column">
        <div data-slot="voice">
          <p class="gl-eyebrow" data-slot-field="eyebrow">AEO · metodología BeX</p>
          <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot-field="question">¿Te recomienda la IA?</span></p>
          <p class="gl-answer"><span class="gl-answer-lead" data-slot-field="answerLead"></span><span data-slot-field="answer">por capa</span><span class="gl-sphere" data-gl-part="sphere" aria-hidden="true"></span></p>
        </div>

        <p class="gl-body" data-slot="body">ChatGPT, Claude, Perplexity, Gemini y Google AI Overviews.</p>

        <p class="gl-mf-note" data-slot="note">Be Intrinsic es una trayectoria, no una garantía.</p>
      </div>

      <div class="gl-hidden" data-slot="selection"></div>

      <img class="gl-url-bubble" data-slot="urlBubble" src="assets/url-bubble-baked-dark.svg" alt="efeoncepro.com" />
    </main>
  </body>
</html>
