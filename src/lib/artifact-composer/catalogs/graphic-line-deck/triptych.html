<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · tríptico</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `triptych` (surface deck, papel content, tema oscuro). Tres tomas verticales nativas a altura completa,
      separadas por un canal fino, y UNA palabra por toma, cada una cerrada por su esfera («Escucha.» «Crea.»
      «Mide.»; regla `triptych-word-per-panel`). La pregunta va arriba sobre un difuminado de la primera toma.
      Referencia aprobada: `triptych`.
    -->
    <main class="gl-slide gl-tr gl-ring-small" data-gl-root data-slot="frame">
      <ul class="gl-tr-panels" data-slot="panels">
        <li class="gl-tr-panel">
          <img data-slot-field="src" alt="" />
          <p class="gl-answer"><span data-slot-field="word">Crea</span><span class="gl-sphere" data-gl-part="sphere" aria-hidden="true"></span></p>
        </li>
      </ul>

      <figure class="gl-tr-bed" data-slot="bed" aria-hidden="true">
        <img data-slot-field="src" alt="" />
      </figure>
      <div class="gl-tr-shade" aria-hidden="true"></div>

      <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot="question">¿Cómo trabajamos?</span></p>
    </main>
  </body>
</html>
