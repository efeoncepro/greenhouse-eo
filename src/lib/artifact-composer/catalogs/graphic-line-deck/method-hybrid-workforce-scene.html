<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · la fuerza híbrida en escena</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `method-hybrid-workforce`, composición `scene` (surface deck, tema oscuro, TASK-1928). La estratega y un
      agente trabajan la misma pieza en la misma pantalla: foto a sangre, la voz sobre el muro calmo de la izquierda y
      dos selecciones de objeto sobre regiones del monitor medidas en la toma, nunca sobre la persona (la única
      excepción aprobada a «una selección por lámina»). Sin órbita ni logo. Referencia: DeckHibridoEscena.
    -->
    <main class="gl-slide gl-hws" data-gl-root data-slot="frame">
      <figure class="gl-photo" data-slot="photo">
        <img data-slot-field="src" alt="" />
      </figure>

      <div data-slot="voice">
        <p class="gl-eyebrow" data-slot-field="eyebrow">Fuerza de trabajo híbrida</p>
        <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot-field="question">¿Quién hace el trabajo?</span></p>
        <p class="gl-answer"><span class="gl-answer-lead" data-slot-field="answerLead">Personas</span><span data-slot-field="answer">y agentes</span><span class="gl-sphere" data-gl-part="sphere" aria-hidden="true"></span></p>
      </div>

      <p class="gl-body" data-slot="body">Sobre la misma pieza, al mismo tiempo.</p>

      <div class="gl-hidden" data-slot="selection"></div>

      <img class="gl-url-bubble" data-slot="urlBubble" src="assets/url-bubble-baked-dark.svg" alt="efeoncepro.com" />
    </main>
  </body>
</html>
