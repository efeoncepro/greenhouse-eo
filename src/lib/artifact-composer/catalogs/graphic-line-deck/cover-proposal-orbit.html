<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · portada de propuesta · órbita</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `cover-proposal`, composición `orbit` (uso proposal; aprobada 2026-09-27). SIN foto: la órbita gigante de
      luz sostiene el logo del cliente y la columna de voz va a la izquierda. La evidencia nombra al cliente; la burbuja
      URL va alineada a la columna. La selección toma el LOGO DEL CLIENTE (8 manijas, un colaborador). Sin logo del
      cliente, sale el marcador de la plantilla. La órbita la pinta el builder desde `orbitPaint` de AXIS.
    -->
    <main class="gl-slide gl-frame gl-frame-column" data-gl-root data-slot="frame">
      <figure class="gl-backdrop" data-slot="backdrop">
        <img data-slot-field="src" alt="" />
      </figure>

      <img class="gl-logo" data-slot="logo" src="assets/efeonce-logo-negative.svg" alt="Efeonce" />

      <div data-slot="voice">
        <p class="gl-eyebrow" data-slot-field="eyebrow">Eyebrow</p>
        <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot-field="question">¿Pregunta?</span></p>
        <p class="gl-answer"><span class="gl-answer-lead" data-slot-field="answerLead"></span><span data-slot-field="answer">Respuesta</span><span class="gl-sphere" data-gl-part="sphere" aria-hidden="true"></span></p>
      </div>

      <p class="gl-evidence" data-slot="evidence">Evidencia</p>

      <div class="gl-client" data-gl-selection-target>
        <figure class="gl-client-logo" data-slot="clientLogo">
          <img data-slot-field="src" alt="" />
        </figure>
        <p class="gl-client-placeholder" data-slot="clientPlaceholder">Logo del cliente</p>
      </div>

      <div class="gl-hidden" data-slot="selection"></div>

      <img class="gl-url-bubble" data-slot="urlBubble" src="assets/url-bubble-baked-dark.svg" alt="efeoncepro.com" />
      <!-- El lockup de submarca OPCIONAL (TASK-1949, deck SEO/AEO): archivo oficial de axis-brand-assets; su lugar y su alto
           llegan del builder. Sin `productMark` el nodo queda vacío y la lámina es la de siempre. -->
      <div class="gl-product-mark" data-slot="productMark">
        <img data-slot-field="src" alt="" />
      </div>
    </main>
  </body>
</html>
