<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · sección partida</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `section-split` (surface deck, papel section). Un panel de papel con UNA esquina curva grande arriba a
      la derecha; la foto se extiende por debajo de la curva. El indicador de sección (80 px) nace abajo y sube por
      la derecha. Número, «Sección n de N», pregunta y respuesta sobre el papel. Referencia: DeckSeccionMedia.
    -->
    <main class="gl-slide gl-paper gl-ss gl-ring-small" data-gl-root data-slot="frame">
      <figure class="gl-split-photo" data-slot="photo">
        <img data-slot-field="src" alt="" />
      </figure>

      <div class="gl-split-panel" aria-hidden="true"></div>

      <figure class="gl-layer" data-slot="indicator">
        <img data-slot-field="src" alt="" />
      </figure>

      <div class="gl-column" data-slot="progress">
        <p class="gl-section-number" data-slot-field="number">02</p>
        <p class="gl-section-label" data-slot-field="label">Sección 2 de 5</p>
      </div>

      <div class="gl-column" data-slot="voice">
        <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot-field="question">¿Quién decide el corte?</span></p>
        <p class="gl-answer"><span class="gl-answer-lead" data-slot-field="answerLead"></span><span data-slot-field="answer">El dato</span><span class="gl-sphere" data-gl-part="sphere" aria-hidden="true"></span></p>
      </div>
    </main>
  </body>
</html>
