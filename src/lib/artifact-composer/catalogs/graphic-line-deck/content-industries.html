<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · industrias</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `content-industries` (surface deck, tema oscuro, TASK-1949). «¿Conocemos tu industria? Por dentro.»: seis
      fichas de vidrio (3 × 2) en perspectiva sobre la plataforma de luz, numeradas por la plantilla, cada una con la
      industria y la pregunta que ese comprador le hace a la IA junto al ícono Trazo `composer`. La destacada va adelante con
      contorno y la única sombra profunda; tres columnas de luz suben de la plataforma. Sin selección.
      Referencia: deck SEO/AEO, Completo · 27 (aprobada el 2026-09-30).
    -->
    <main class="gl-slide gl-ls gl-sv gl-sin" data-gl-root data-slot="frame">
      <figure class="gl-layer gl-ls-stage" data-slot="stage">
        <img data-slot-field="src" alt="" />
      </figure>

      <figure class="gl-layer gl-ls-platform" data-slot="platform">
        <img data-slot-field="src" alt="" />
      </figure>

      <figure class="gl-layer gl-sin-columns" data-slot="columns">
        <img data-slot-field="src" alt="" />
      </figure>

      <div class="gl-sin-scene">
        <ol class="gl-sin-grid" data-slot="industries">
          <li class="gl-sin-card">
            <p class="gl-sin-number" data-slot-field="number">01</p>
            <p class="gl-sin-name" data-slot-field="name">Banca y finanzas</p>
            <p class="gl-sin-question"><img class="gl-sin-icon" data-slot-field="icon" alt="" /><span data-slot-field="question">¿Qué banco tiene la mejor cuenta para pymes?</span></p>
          </li>
        </ol>
      </div>

      <div class="gl-live-voice" data-slot="voice">
        <p class="gl-eyebrow" data-slot-field="eyebrow">Industrias</p>
        <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot-field="question">¿Conocemos tu industria?</span></p>
        <p class="gl-answer"><span class="gl-answer-lead" data-slot-field="answerLead">Por</span><span data-slot-field="answer">dentro</span><span class="gl-sphere" data-gl-part="sphere" aria-hidden="true"></span></p>
      </div>

      <p class="gl-body gl-live-body" data-slot="body">Seis industrias donde tu comprador ya le pregunta a la IA antes de llamarte. Nosotros sabemos <strong>qué pregunta</strong>.</p>

      <div class="gl-product-mark" data-slot="productMark">
        <img data-slot-field="src" alt="" />
      </div>

      <img class="gl-url-lum" data-slot="urlBubble" src="assets/url-bubble-source.svg" alt="efeoncepro.com" />
    </main>
  </body>
</html>
