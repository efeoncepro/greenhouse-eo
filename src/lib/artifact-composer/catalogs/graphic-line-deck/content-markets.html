<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · mercados</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `content-markets` (surface deck, tema oscuro, TASK-1949). «¿Dónde operamos? Cinco países.»: las Américas de
      noche desde la órbita (plate MK2 a sangre, puesta en escena) con cinco nodos de luz; junto a cada nodo, la etiqueta
      COMPUESTA del país y su ciudad de referencia, del lado que el builder calcula desde el nodo medido. La voz va en el
      espacio oscuro de la izquierda y el lockup de SV360 arriba. Sin selección.
      Referencia: deck SEO/AEO, Completo · 28 (aprobada el 2026-09-30).
    -->
    <main class="gl-slide gl-ls gl-sv gl-smk" data-gl-root data-slot="frame">
      <figure class="gl-photo" data-slot="photo">
        <img data-slot-field="src" alt="" />
      </figure>

      <ol class="gl-smk-markets" data-slot="markets">
        <li class="gl-smk-label">
          <p class="gl-smk-country" data-slot-field="country">EE. UU.</p>
          <p class="gl-smk-city" data-slot-field="city">Miami</p>
        </li>
      </ol>

      <div class="gl-live-voice" data-slot="voice">
        <p class="gl-eyebrow" data-slot-field="eyebrow">Mercados</p>
        <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot-field="question">¿Dónde operamos?</span></p>
        <p class="gl-answer"><span class="gl-answer-lead" data-slot-field="answerLead">Cinco</span><span data-slot-field="answer">países</span><span class="gl-sphere" data-gl-part="sphere" aria-hidden="true"></span></p>
      </div>

      <p class="gl-body gl-live-body" data-slot="body">Chile, Estados Unidos, Colombia, México y Perú, con <strong>un solo equipo</strong> y un solo interlocutor.</p>

      <div class="gl-product-mark" data-slot="productMark">
        <img data-slot-field="src" alt="" />
      </div>

      <img class="gl-url-lum" data-slot="urlBubble" src="assets/url-bubble-source.svg" alt="efeoncepro.com" />
    </main>
  </body>
</html>
