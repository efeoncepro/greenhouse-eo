<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · por qué lo hacemos</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `section-cine`, composición `purpose` (surface deck, tema oscuro, TASK-1928). «Contigo» gigante, la promesa con
      UNA expresión en negrita y los tres pilares en filas con su filete. El rótulo del pilar va en blanco (el halo a 22 px
      era texto chico en el acento: D1). Sin logo ni velo: firma la burbuja URL. Referencia: DeckPorQueLoHacemos (QS2).
    -->
    <main class="gl-slide gl-sec gl-sec-purpose" data-gl-root data-slot="frame">
      <figure class="gl-photo" data-slot="photo">
        <img data-slot-field="src" alt="" />
      </figure>

      <div data-slot="voice">
        <p class="gl-eyebrow" data-slot-field="eyebrow">Por qué lo hacemos</p>
        <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot-field="question">¿Por qué lo hacemos así?</span></p>
        <p class="gl-answer"><span data-slot-field="answer">Contigo</span><span class="gl-sphere" data-gl-part="sphere" aria-hidden="true"></span></p>
      </div>

      <p class="gl-body gl-sec-body" data-slot="body">No te entregamos crecimiento. Lo construimos contigo.</p>

      <ol class="gl-sec-pillars" data-slot="pillars">
        <li class="gl-sec-pillar">
          <p class="gl-sec-pillar-label" data-slot-field="label">Co-creación</p>
          <p class="gl-sec-pillar-text" data-slot-field="text">operas con nosotros en vivo, en tu panel.</p>
        </li>
      </ol>

      <img class="gl-url-bubble" data-slot="urlBubble" src="assets/url-bubble-baked-dark.svg" alt="efeoncepro.com" />
    </main>
  </body>
</html>
