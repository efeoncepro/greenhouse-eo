<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · la cotización en vivo</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `content-pricing`, composición `live` (surface deck, tema oscuro, TASK-1928). La cotización como la recibe
      el cliente: un documento claro en perspectiva con cada línea a la vista, el total y el cursor del lector en el
      botón; dos notas de vidrio en profundidad y la plataforma de luz debajo. Montos siempre como marcador.
      Referencia: DeckCotizacionVivo (CQ2-cotizacion-vivo).
    -->
    <main class="gl-slide gl-pv" data-gl-root data-slot="frame">
      <figure class="gl-layer gl-pv-bg" data-slot="stage">
        <img data-slot-field="src" alt="" />
      </figure>

      <figure class="gl-layer gl-pv-platform" data-slot="platform">
        <img data-slot-field="src" alt="" />
      </figure>

      <ol class="gl-pv-chips" data-slot="chips">
        <li class="gl-pv-chip">
          <p class="gl-pv-chip-kicker" data-slot-field="kicker">Cómo se mide</p>
          <p class="gl-pv-chip-text" data-slot-field="text">Capacidad gobernada</p>
        </li>
      </ol>

      <section class="gl-pv-doc" data-slot="quote">
        <div class="gl-pv-head">
          <span class="gl-pv-tile"><img src="assets/efeonce-isotype-negative.svg" alt="" /></span>
          <div>
            <p class="gl-pv-kicker" data-slot-field="kicker">Propuesta · Cotización</p>
            <p class="gl-pv-title" data-slot-field="title">Para tu marca</p>
          </div>
        </div>

        <ol class="gl-pv-lines" data-slot="lines">
          <li class="gl-pv-line">
            <span class="gl-pv-line-number" data-slot-field="number">1</span>
            <div class="gl-pv-line-text">
              <p class="gl-pv-line-name" data-slot-field="name">Equipo</p>
              <p class="gl-pv-line-desc" data-slot-field="desc">Capacidad gobernada del squad</p>
            </div>
            <p class="gl-pv-line-amount" data-slot-field="amount">[MONTO] / mes</p>
          </li>
        </ol>

        <div class="gl-pv-total">
          <div>
            <p class="gl-pv-total-label" data-slot-field="totalLabel">Total mensual</p>
            <p class="gl-pv-total-amount" data-slot-field="total">[MONTO]</p>
            <p class="gl-pv-tax" data-slot-field="tax">neto + IVA</p>
          </div>
          <div data-slot="cta">
            <p class="gl-pv-cta" data-gl-cta-target data-slot-field="text">Aprobar propuesta</p>
          </div>
        </div>
      </section>

      <div data-slot="voice">
        <p class="gl-eyebrow" data-slot-field="eyebrow">Inversión</p>
        <div class="gl-flow-voice">
          <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot-field="question">¿Cuánto cuesta?</span></p>
          <p class="gl-answer"><span class="gl-answer-lead" data-slot-field="answerLead">Sin letra</span><span data-slot-field="answer">chica</span><span class="gl-sphere" data-gl-part="sphere" aria-hidden="true"></span></p>
          <p class="gl-body gl-flow-body" data-slot="body">Cada línea de la cotización a la vista.</p>
        </div>
      </div>

      <img class="gl-url-lum" data-slot="urlBubble" src="assets/url-bubble-source.svg" alt="efeoncepro.com" />
    </main>
  </body>
</html>
