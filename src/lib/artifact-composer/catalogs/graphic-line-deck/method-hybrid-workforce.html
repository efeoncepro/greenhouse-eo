<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · la fuerza de trabajo híbrida</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `method-hybrid-workforce`, composición `ladder` (surface deck, tema oscuro, TASK-1928). Personas y agentes
      sobre el mismo trabajo: la respuesta la toman DOS cursores a la vez (Estrategia y Agente IA) y la autoridad del
      agente crece por tramos (cuatro barras desde una base común, tres de vidrio y la cuarta sólida en el acento). El
      indicador de navegación es la única órbita. Sin foto ni logo: firma la burbuja URL. Referencia: DeckHibrido.
    -->
    <main class="gl-slide gl-hw" data-gl-root data-slot="frame">
      <figure class="gl-layer" data-slot="indicator">
        <img data-slot-field="src" alt="" />
      </figure>

      <div data-slot="voice">
        <p class="gl-eyebrow" data-slot-field="eyebrow">Fuerza de trabajo híbrida</p>
        <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot-field="question">¿Quién hace el trabajo?</span></p>
        <p class="gl-answer" data-gl-selection-target><span class="gl-answer-lead" data-slot-field="answerLead">Personas</span><span data-slot-field="answer">y agentes</span><span class="gl-sphere" data-gl-part="sphere" aria-hidden="true"></span></p>
      </div>

      <p class="gl-body" data-slot="body">Diseñamos, activamos y operamos equipos donde personas y agentes comparten un trabajo medible.</p>

      <p class="gl-hw-title" data-slot="ladderTitle">La autoridad del agente crece por tramos</p>

      <ol class="gl-hw-ladder" data-slot="ladder">
        <li class="gl-hw-bar">
          <span class="gl-hw-number" aria-hidden="true"></span>
          <span class="gl-hw-label" data-slot-field="label">Leer y resumir</span>
        </li>
      </ol>

      <div class="gl-hw-baseline" aria-hidden="true"></div>

      <p class="gl-hw-path" data-slot="path">Blueprint → primer equipo híbrido → operación híbrida</p>

      <div class="gl-hidden" data-slot="selection"></div>

      <img class="gl-url-bubble" data-slot="urlBubble" src="assets/url-bubble-baked-dark.svg" alt="efeoncepro.com" />
    </main>
  </body>
</html>
