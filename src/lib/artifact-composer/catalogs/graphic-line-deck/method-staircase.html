<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La órbita · la escalera del método</title>
    <link rel="stylesheet" href="deck-fonts.css" />
    <link rel="stylesheet" href="graphic-line-tokens.css" />
    <link rel="stylesheet" href="graphic-line.css" />
  </head>
  <body>
    <!--
      Receta `method-staircase` (surface deck, papel method, tema oscuro). Un método por niveles como una escalera:
      peldaños de vidrio que se iluminan al subir y sangran por la derecha; el nivel de llegada es sólido en el acento
      de la línea, con brillo. La selección toma el nivel que se está trabajando. Sin foto: firma la burbuja URL en el
      pie. Referencia: DeckBexEscalera (F2b).
    -->
    <main class="gl-slide gl-ms" data-gl-root data-slot="frame">
      <ol class="gl-ms-levels" data-slot="levels">
        <li class="gl-ms-level">
          <div class="gl-ms-row" data-gl-level-row>
            <span class="gl-ms-number" aria-hidden="true"></span>
            <span class="gl-ms-name" data-slot-field="name">Be Found</span>
            <span class="gl-ms-descriptor" data-slot-field="descriptor">que te encuentre</span>
          </div>
        </li>
      </ol>

      <div class="gl-column">
        <div data-slot="voice">
          <p class="gl-eyebrow" data-slot-field="eyebrow">AEO · metodología BeX</p>
          <p class="gl-question"><span class="gl-ring" aria-hidden="true"></span><span data-slot-field="question">¿Te recomienda la IA?</span></p>
          <p class="gl-answer"><span class="gl-answer-lead" data-slot-field="answerLead"></span><span data-slot-field="answer">por capa</span><span class="gl-sphere" data-gl-part="sphere" aria-hidden="true"></span></p>
        </div>

        <p class="gl-body" data-slot="body">ChatGPT, Claude, Perplexity, Gemini y Google AI Overviews.</p>

        <p class="gl-ms-note" data-slot="note">Be Intrinsic es una trayectoria, no una garantía.</p>
      </div>

      <div class="gl-hidden" data-slot="selection"></div>

      <img class="gl-url-bubble" data-slot="urlBubble" src="assets/url-bubble-baked-dark.svg" alt="efeoncepro.com" />
      <!-- El lockup de submarca OPCIONAL (TASK-1949, deck SEO/AEO): archivo oficial de axis-brand-assets; su lugar y su alto
           llegan del builder. Sin `productMark` el nodo queda vacío y la lámina es la de siempre. -->
      <div class="gl-product-mark" data-slot="productMark">
        <img data-slot-field="src" alt="" />
      </div>
    </main>
  </body>
</html>
